<!doctype html><html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>写真を直す | 和酒ログ</title><style>*{box-sizing:border-box}body{margin:0;background:#f5f4ee;color:#1d251f;font-family:system-ui,-apple-system,"Noto Sans JP",sans-serif}.app{max-width:430px;margin:auto;min-height:100vh;background:#fbfaf6}.head{padding:15px 18px;border-bottom:1px solid #e4e0d7}.head a{text-decoration:none;color:#276149;font-size:12px;font-weight:800}.wrap{padding:25px 16px 55px}h1{font:700 26px serif}.photo{background:#fff;border:1px solid #e4e0d7;border-radius:20px;padding:14px;margin-bottom:11px}.preview{height:150px;border-radius:13px;background:#eee9dc;display:flex;align-items:center;justify-content:center;color:#817a6e;font-size:11px;overflow:hidden}.preview img{width:100%;height:100%;object-fit:contain}.name{font:700 17px serif;margin:10px 0}.actions{display:flex;gap:7px}.actions button{flex:1;border-radius:12px;padding:10px;font-size:11px;font-weight:800}.replace{background:#eef3ef;border:1px solid #d8e2db;color:#285743}.remove{background:#fff;border:1px solid #dfd7d1;color:#8b5148}.msg{margin:12px 0;padding:11px;border-radius:12px;font-size:12px}.ok{background:#e8f7ef;color:#17683f}.err{background:#fff0ee;color:#a32c22}.done{display:block;margin-top:18px;background:#173c32;color:#fff;text-decoration:none;text-align:center;border-radius:15px;padding:15px;font-size:12px;font-weight:800}.hint{font-size:10px;line-height:1.75;color:#777e79;margin:7px 2px 16px}</style></head><body><div class="app"><div class="head"><a id="back" href="record-edit.html">← 編集する場所を選ぶ</a></div><main class="wrap"><h1>写真を直す</h1><p class="hint">表ラベル・裏ラベル・料理・思い出を、それぞれ変更・追加・削除できます。ほかの写真には影響しません。</p><div id="msg"></div><div id="list">読み込み中…</div><a id="done" class="done" href="record-detail.html">写真の編集を終える</a></main></div><input id="picker" type="file" accept="image/*" hidden><script>
const BASE='https://mtshsijgfmottgkbgnir.supabase.co',KEY='sb_publishable_iN9jbt45ga1sPbzt5aw-0w_iWs8eWW-';const q=new URLSearchParams(location.search),id=q.get('id'),token=localStorage.getItem('sakelog_token'),uid=JSON.parse(localStorage.getItem('sakelog_user')||'null')?.id;const H={'apikey':localStorage.getItem('sakelog_pubkey')||KEY,'Authorization':'Bearer '+token};const types=[['front','表ラベル'],['back','裏ラベル'],['food','料理'],['memory','思い出']];let rows=[],activeType=null;const $=x=>document.getElementById(x);$('back').href=id?'record-edit.html?id='+encodeURIComponent(id):'record-edit.html';$('done').href=id?'record-detail.html?id='+encodeURIComponent(id):'record-detail.html';function m(t,c){$('msg').innerHTML=t?'<div class="msg '+c+'">'+t+'</div>':''}async function objectUrl(path){const r=await fetch(BASE+'/storage/v1/object/sake-photos/'+encodeURI(path),{headers:H});if(!r.ok)return null;return URL.createObjectURL(await r.blob())}async function load(){if(!id){m('記録IDがありません','err');$('list').innerHTML='';return}const r=await fetch(BASE+'/rest/v1/sake_photos?select=*&drinking_record_id=eq.'+encodeURIComponent(id)+'&order=created_at.asc',{headers:H});if(!r.ok){m('写真を読み込めませんでした','err');return}rows=await r.json();let html='';for(const [type,name] of types){const p=rows.find(x=>x.photo_type===type),url=p?await objectUrl(p.storage_path):null;html+='<section class="photo"><div class="preview">'+(url?'<img src="'+url+'">':'写真なし')+'</div><div class="name">'+name+'</div><div class="actions"><button class="replace" data-replace="'+type+'">'+(p?'写真を変更':'写真を追加')+'</button>'+(p?'<button class="remove" data-remove="'+type+'">この写真だけ外す</button>':'')+'</div></section>'}$('list').innerHTML=html;document.querySelectorAll('[data-replace]').forEach(b=>b.onclick=()=>{activeType=b.dataset.replace;$('picker').value='';$('picker').click()});document.querySelectorAll('[data-remove]').forEach(b=>b.onclick=()=>removePhoto(b.dataset.remove))}async function removePhoto(type){const p=rows.find(x=>x.photo_type===type);if(!p)return;if(!confirm('この写真だけ外しますか？\nほかの写真や記録は残ります。'))return;const r=await fetch(BASE+'/rest/v1/sake_photos?id=eq.'+encodeURIComponent(p.id),{method:'DELETE',headers:H});if(!r.ok){m('写真を外せませんでした','err');return}await fetch(BASE+'/storage/v1/object/sake-photos/'+encodeURI(p.storage_path),{method:'DELETE',headers:H}).catch(()=>{});m('✓ この写真だけ外しました。続けて別の写真も編集できます。','ok');await load()} $('picker').onchange=async()=>{const file=$('picker').files?.[0];if(!file||!activeType)return;try{m('写真を保存中…','');const old=rows.find(x=>x.photo_type===activeType);const ext=(file.name.split('.').pop()||'jpg').toLowerCase(),path=uid+'/'+Date.now()+'-'+Math.random().toString(36).slice(2)+'.'+ext;let r=await fetch(BASE+'/storage/v1/object/sake-photos/'+encodeURI(path),{method:'POST',headers:{...H,'Content-Type':file.type||'image/jpeg','x-upsert':'false'},body:file});if(!r.ok)throw new Error('写真のアップロードに失敗しました');r=await fetch(BASE+'/rest/v1/sake_photos',{method:'POST',headers:{...H,'Content-Type':'application/json'},body:JSON.stringify({user_id:uid,drinking_record_id:id,photo_type:activeType,storage_path:path,mime_type:file.type||'image/jpeg'})});if(!r.ok){await fetch(BASE+'/storage/v1/object/sake-photos/'+encodeURI(path),{method:'DELETE',headers:H}).catch(()=>{});throw new Error((await r.json().catch(()=>({}))).message||'写真情報を保存できませんでした')}if(old){await fetch(BASE+'/rest/v1/sake_photos?id=eq.'+encodeURIComponent(old.id),{method:'DELETE',headers:H});await fetch(BASE+'/storage/v1/object/sake-photos/'+encodeURI(old.storage_path),{method:'DELETE',headers:H}).catch(()=>{})}m('✓ 写真を更新しました。続けて編集するか、「写真の編集を終える」で戻れます。','ok');await load()}catch(e){m(e.message,'err')}};load();
</script></body></html>
