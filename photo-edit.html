<!doctype html><html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>写真を直す | 和酒ログ</title><style>*{box-sizing:border-box}body{margin:0;background:#f5f4ee;color:#1d251f;font-family:system-ui,-apple-system,"Noto Sans JP",sans-serif}.app{max-width:430px;margin:auto;min-height:100vh;background:#fbfaf6}.head{padding:15px 18px;border-bottom:1px solid #e4e0d7}.head a{text-decoration:none;color:#276149;font-size:12px;font-weight:800}.wrap{padding:25px 16px 55px}h1{font:700 26px serif}.photo{background:#fff;border:1px solid #e4e0d7;border-radius:20px;padding:14px;margin-bottom:11px}.preview{height:100px;border-radius:13px;background:#eee9dc;display:flex;align-items:center;justify-content:center;color:#817a6e;font-size:11px}.name{font:700 17px serif;margin:10px 0}.actions{display:flex;gap:7px}.actions button{flex:1;border-radius:12px;padding:10px;font-size:11px;font-weight:800}.replace{background:#eef3ef;border:1px solid #d8e2db;color:#285743}.remove{background:#fff;border:1px solid #dfd7d1;color:#8b5148}.note{margin-top:18px;background:#f1efe8;border-radius:14px;padding:12px;font-size:10px;line-height:1.8;color:#6b685f}</style></head><body><div class="app"><div class="head"><a href="record-edit.html">← 編集する場所を選ぶ</a></div><main class="wrap"><h1>写真を直す</h1><p>写真ごとに変更できます。</p><section class="photo"><div class="preview">表ラベル・現在の写真</div><div class="name">表ラベル</div><div class="actions"><button class="replace">写真を変更</button><button class="remove">この写真だけ外す</button></div></section><section class="photo"><div class="preview">裏ラベル・現在の写真</div><div class="name">裏ラベル</div><div class="actions"><button class="replace">写真を変更</button><button class="remove">この写真だけ外す</button></div></section><section class="photo"><div class="preview">料理・現在の写真</div><div class="name">料理</div><div class="actions"><button class="replace">写真を変更</button><button class="remove">この写真だけ外す</button></div></section><section class="photo"><div class="preview">思い出・写真なし</div><div class="name">思い出</div><div class="actions"><button class="replace">写真を追加</button></div></section><div class="note">写真を外しても、酒の記録やほかの写真には影響しません。操作前に確認画面を表示する設計にします。</div></main></div></body></html>
