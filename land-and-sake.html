<!doctype html><html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#173c32"><title>あなたが飲んだ日本地図 | 和酒ログ</title><style>*{box-sizing:border-box}body{margin:0;background:#f6f4ed;color:#18221d;font-family:system-ui,-apple-system,"Noto Sans JP",sans-serif}a{text-decoration:none;color:inherit}.app{max-width:430px;margin:auto;min-height:100vh;background:#fbfaf6}.head{padding:16px 18px;background:#fff;border-bottom:1px solid #e5e1d7}.back{font-size:12px;color:#24634b;font-weight:800}.hero{padding:27px 19px 18px}.hero h1{font:700 28px/1.35 serif;margin:5px 0 8px}.small{font-size:11px;line-height:1.75;color:#6d756f}.wrap{padding:0 15px 50px}.card{background:#fff;border:1px solid #e4e0d6;border-radius:21px;padding:16px;margin-bottom:13px}.card h2{font:700 20px serif;margin:0 0 6px}.overview{display:grid;grid-template-columns:repeat(3,1fr);gap:7px;margin-top:13px}.stat{background:#f1f5f2;border-radius:13px;padding:10px 7px}.stat b{display:block;font:700 21px serif}.stat span{font-size:9px;color:#6f7872}.regions{display:grid;grid-template-columns:1fr 1fr;gap:9px;margin-top:14px}.region{border:1px solid #dfe4dd;background:#f7f8f5;border-radius:16px;padding:14px 11px}.region.drunk{background:#e8f1ec;border-color:#bdd3c7}.region b{font:700 16px serif}.region span{display:block;font-size:9px;color:#66736c;margin-top:4px}.region.drunk b{color:#205b44}.panel{display:none}.panel.show{display:block}.panelHead{display:flex;align-items:center;justify-content:space-between;margin-bottom:12px}.panelHead button{border:0;background:none;color:#276149;font-weight:800;font-size:11px}.prefs{display:grid;grid-template-columns:repeat(2,1fr);gap:8px}.pref{border:1px solid #e1e4df;background:#f8f8f5;border-radius:14px;padding:12px 9px;font-size:12px}.pref.drunk{background:#e9f2ed;border-color:#c1d5ca;color:#205b44;font-weight:800}.pref span{display:block;font-size:9px;margin-top:3px;font-weight:500;color:#728078}.sake{display:block;padding:12px 1px;border-top:1px solid #ece9e1}.sake b{font-size:14px}.sake span{display:block;font-size:10px;color:#747b76;margin-top:3px}.landTaste{margin-top:16px;padding-top:15px;border-top:1px solid #e8e5dc}.landTaste h3{font:700 17px serif;margin:0 0 8px}.foods{display:grid;gap:7px}.food{background:#f4f2ea;border-radius:12px;padding:10px;font-size:11px}.culture{font-size:11px;line-height:1.8;color:#5f6862;margin-top:10px}.sourceNote{font-size:9px;line-height:1.6;color:#858b86;margin-top:10px}.empty{font-size:11px;line-height:1.8;color:#727a74;padding:8px 0}.hidden{display:none}</style></head><body><div class="app"><div class="head"><a class="back" href="integrated-preview.html">← 和酒ログ</a></div><section class="hero"><div class="small">あなたの酒の記憶</div><h1>酒が生まれた土地</h1><p class="small">全国は眺めるために。地方を選ぶと、都道府県を押しやすい大きさで開きます。</p></section><main class="wrap"><section class="card"><h2>あなたが飲んだ日本</h2><p class="small">記録のある土地だけ、静かに色がつきます。</p><div class="overview"><div class="stat"><b id="prefTotal">0</b><span>出会った都道府県</span></div><div class="stat"><b id="sakeTotal">0</b><span>出会った酒</span></div><div class="stat"><b id="regionTotal">0</b><span>酒に出会った地方</span></div></div><div id="regions" class="regions"></div></section><section id="regionPanel" class="card panel"><div class="panelHead"><h2 id="regionTitle"></h2><button id="closeRegion">全国へ戻る</button></div><p class="small">都道府県を選ぶと、その土地で出会った酒を見られます。</p><div id="prefs" class="prefs"></div></section><section id="prefPanel" class="card panel"><div class="panelHead"><h2 id="prefTitle"></h2><button id="backRegion">地方へ戻る</button></div><p id="prefLead" class="small"></p><div id="sakes"></div><div id="landTaste" class="landTaste hidden"><h3>この土地を、もう少し感じる</h3><div id="foods" class="foods"></div><div id="culture" class="culture"></div><div class="sourceNote">郷土料理・酒文化は、確認できた情報から少しずつ追加します。情報がない土地では無理に表示しません。</div></div></section></main></div><script>const BASE='https://mtshsijgfmottgkbgnir.supabase.co',KEY='sb_publishable_iN9jbt45ga1sPbzt5aw-0w_iWs8eWW-';const token=localStorage.getItem('sakelog_token'),H={'apikey':localStorage.getItem('sakelog_pubkey')||KEY,'Authorization':'Bearer '+token};const $=x=>document.getElementById(x),esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));const regions={北海道:['北海道'],東北:['青森県','岩手県','宮城県','秋田県','山形県','福島県'],関東:['茨城県','栃木県','群馬県','埼玉県','千葉県','東京都','神奈川県'],中部:['新潟県','富山県','石川県','福井県','山梨県','長野県','岐阜県','静岡県','愛知県'],近畿:['三重県','滋賀県','京都府','大阪府','兵庫県','奈良県','和歌山県'],中国:['鳥取県','島根県','岡山県','広島県','山口県'],四国:['徳島県','香川県','愛媛県','高知県'],九州沖縄:['福岡県','佐賀県','長崎県','熊本県','大分県','宮崎県','鹿児島県','沖縄県']};let rows=[],currentRegion='';const landInfo={'奈良県':{foods:['柿の葉寿司','三輪そうめん','奈良漬'],culture:'古くから酒造りと深い縁を持つ土地。記録した一本から、奈良の食や酒の背景へ少しずつたどれます。'},'新潟県':{foods:['へぎそば','のっぺ','栃尾の油揚げ'],culture:'雪国の暮らしと食文化の中で酒が育ってきた土地。淡麗という一語だけでは括らず、その一本の背景を見ていきます。'},'秋田県':{foods:['きりたんぽ','いぶりがっこ','稲庭うどん'],culture:'米どころの食と発酵文化が身近にある土地。酒だけでなく、土地の食卓と一緒に感じます。'},'広島県':{foods:['牡蠣料理','あなご飯','美酒鍋'],culture:'酒造りの歴史を持つ土地の一つ。海の食や地域の料理とともに、その土地の酒をたどります。'}};const prefOf=d=>d.brewery_prefecture||d.prefecture||'';const nameOf=d=>[d.brand,d.product].filter(Boolean).join(' ')||'名称未登録';function uniqueSakes(a){const m=new Map;for(const d of a){const k=nameOf(d);if(!m.has(k))m.set(k,d)}return [...m.values()]}function renderRegions(){const used=new Set(rows.map(prefOf).filter(Boolean));let active=0;$('regions').innerHTML=Object.entries(regions).map(([r,ps])=>{const n=ps.filter(p=>used.has(p)).length;if(n)active++;return '<button class="region '+(n?'drunk':'')+'" data-region="'+r+'"><b>'+r+'</b><span>'+(n?n+'都道府県で記録':'まだ記録なし')+'</span></button>'}).join('');$('prefTotal').textContent=used.size;$('sakeTotal').textContent=uniqueSakes(rows).length;$('regionTotal').textContent=active;document.querySelectorAll('[data-region]').forEach(b=>b.onclick=()=>openRegion(b.dataset.region))}function openRegion(r){currentRegion=r;$('regionTitle').textContent=r;$('prefs').innerHTML=regions[r].map(p=>{const a=rows.filter(d=>prefOf(d)===p),n=uniqueSakes(a).length;return '<button class="pref '+(n?'drunk':'')+'" data-pref="'+p+'">'+p+'<span>'+(n?n+'銘柄':'未記録')+'</span></button>'}).join('');document.querySelectorAll('[data-pref]').forEach(b=>b.onclick=()=>openPref(b.dataset.pref));$('prefPanel').classList.remove('show');$('regionPanel').classList.add('show');$('regionPanel').scrollIntoView({behavior:'smooth',block:'start'})}function openPref(p){const a=rows.filter(d=>prefOf(d)===p),u=uniqueSakes(a);$('prefTitle').textContent=p;$('prefLead').textContent=u.length?u.length+'銘柄との出会いが残っています。':'まだこの土地の酒の記録はありません。';const info=landInfo[p];const gi={'北海道':'北海道','岩手県':'岩手','山形県':'山形','福島県':'喜多方・南会津','新潟県':'新潟','群馬県':'利根沼田','石川県':'白山','長野県':'長野・信濃大町','山梨県':'山梨','静岡県':'静岡','三重県':'三重','滋賀県':'滋賀','大阪府':'大阪','兵庫県':'灘五郷・はりま・伊丹','山口県':'萩','佐賀県':'佐賀'};const maff='https://www.maff.go.jp/j/keikaku/syokubunka/k_ryouri/search_menu/area/index.html';$('landTaste').classList.toggle('hidden',!info);if(info){$('foods').innerHTML=info.foods.slice(0,3).map(x=>'<div class="food">'+esc(x)+'</div>').join('');$('culture').innerHTML=esc(info.culture)+(gi[p]?'<br><span style="display:inline-block;margin-top:8px">国税庁の地理的表示（GI）：'+esc(gi[p])+'</span>':'')+'<br><a href="'+maff+'" target="_blank" rel="noopener" style="display:inline-block;margin-top:8px;color:#276149;font-weight:800">郷土料理の出典を見る →</a><br><a href="https://www.nta.go.jp/publication/pamph/01.htm" target="_blank" rel="noopener" style="display:inline-block;margin-top:6px;color:#276149;font-weight:800">酒の土地情報（国税庁） →</a><br><a href="https://japansake.or.jp/sake/about-sake/sake-culture/" target="_blank" rel="noopener" style="display:inline-block;margin-top:6px;color:#276149;font-weight:800">日本酒と風土（日本酒造組合中央会） →</a>'}$('sakes').innerHTML=u.length?u.map(d=>'<a class="sake" href="record-detail.html?id='+encodeURIComponent(d.id)+'"><b>'+esc(nameOf(d))+'</b><span>'+esc(d.brewery||'')+(d.rice_variety?' / '+esc(d.rice_variety):'')+'</span></a>').join(''):'<div class="empty">いつか出会った一本が、ここに加わります。</div>';$('prefPanel').classList.add('show');$('prefPanel').scrollIntoView({behavior:'smooth',block:'start'})}$('closeRegion').onclick=()=>{$('regionPanel').classList.remove('show');$('prefPanel').classList.remove('show');scrollTo({top:0,behavior:'smooth'})};$('backRegion').onclick=()=>{$('prefPanel').classList.remove('show');$('regionPanel').scrollIntoView({behavior:'smooth'})};async function load(){if(!token){$('regions').innerHTML='<div class="empty">ログインすると、飲んだ酒の土地がここに浮かびます。</div>';return}const r=await fetch(BASE+'/rest/v1/drinking_records?select=id,brand,product,brewery,brewery_prefecture,prefecture,rice_variety,drank_at&order=drank_at.desc',{headers:H});rows=await r.json().catch(()=>[]);if(!r.ok)rows=[];renderRegions()}load();</script></body></html>
