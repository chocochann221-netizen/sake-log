<!doctype html><html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>酒の地図 | 和酒ログ</title><style>*{box-sizing:border-box}body{margin:0;background:#f4f3ed;color:#1d281f;font-family:system-ui,-apple-system,"Noto Sans JP",sans-serif}.app{max-width:680px;margin:auto;min-height:100vh;background:#fbfaf6}.head{padding:15px 18px;border-bottom:1px solid #e2ded4}.head a{text-decoration:none;color:#276149;font-size:12px;font-weight:800}.hero{padding:28px 20px 22px}.hero small{color:#788078}.hero h1{font:700 30px serif;margin:5px 0 9px}.hero p{font-size:12px;line-height:1.8;color:#68716b}.map{position:relative;margin:0 16px;height:430px;border-radius:22px;overflow:hidden;background:linear-gradient(#e9eee9,#e4e8df);border:1px solid #dcded6}.sea{position:absolute;inset:0;background:radial-gradient(ellipse at 60% 45%,rgba(255,255,255,.8),rgba(255,255,255,.15))}.japan{position:absolute;left:19%;top:14%;width:62%;height:68%;transform:rotate(-14deg);border-radius:70% 30% 65% 35%;background:#d2d9cb;opacity:.75}.pin{position:absolute;width:18px;height:18px;border-radius:50% 50% 50% 0;background:#245c46;transform:translate(-50%,-50%) rotate(-45deg);border:2px solid #fff;box-shadow:0 2px 8px #0003}.pin:after{content:'';position:absolute;width:5px;height:5px;border-radius:50%;background:#fff;left:5px;top:5px}.empty{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;text-align:center;padding:35px;font-size:12px;line-height:1.9;color:#657068}.list{padding:20px 16px 50px}.item{background:#fff;border:1px solid #e1ddd4;border-radius:16px;padding:14px;margin-bottom:9px}.item b{font-family:serif}.item small{display:block;color:#778078;margin-top:4px}.note{margin-top:16px;font-size:10px;line-height:1.8;color:#7b807b}</style></head><body><div class="app"><div class="head"><a href="terroir-guide.html">← 土地と酒</a></div><section class="hero"><small>自分が出会った酒を、土地で見る</small><h1>酒の地図</h1><p>飲んだ場所の記録がある一本だけを、地図にそっと重ねます。自宅は地図には表示しません。</p></section><div id="map" class="map"><div class="sea"></div><div class="japan"></div><div id="empty" class="empty">地図に表示できる記録はまだありません。<br>お店やイベントで場所を記録すると、ここに思い出が増えていきます。</div></div><div class="list"><div id="records"></div><div class="note">※ 店名から場所を推測してピンを置くことはしません。保存された位置情報がある記録だけを表示します。</div></div></div><script src="map-record-rules.js"></script><script>const BASE='https://mtshsijgfmottgkbgnir.supabase.co',KEY='sb_publishable_iN9jbt45ga1sPbzt5aw-0w_iWs8eWW-';const token=localStorage.getItem('sakelog_token'),key=localStorage.getItem('sakelog_pubkey')||KEY,$=x=>document.getElementById(x);function pos(lat,lng){const x=14+(lng-122)/(154-122)*72,y=12+(46-lat)/(46-24)*76;return {x:Math.max(4,Math.min(96,x)),y:Math.max(4,Math.min(96,y))}}async function load(){if(!token)return;const r=await fetch(BASE+'/rest/v1/drinking_records?select=id,brand_name,product_name,drank_at,place_type,restaurant_name,latitude,longitude&order=drank_at.desc',{headers:{apikey:key,Authorization:'Bearer '+token}});if(!r.ok)return;const all=await r.json(),items=window.WASHULOG_MAP_RULES.mapRecords(all);if(items.length)$('empty').style.display='none';for(const x of items){const p=pos(x.lat,x.lng),pin=document.createElement('button');pin.className='pin';pin.style.left=p.x+'%';pin.style.top=p.y+'%';pin.title=[x.brandName,x.productName,x.label].filter(Boolean).join(' / ');pin.onclick=()=>location.href='index.html#detail?id='+encodeURIComponent(x.recordId);$('map').appendChild(pin)}$('records').innerHTML=items.map(x=>`<div class="item" onclick="location.href='index.html#detail?id=${encodeURIComponent(x.recordId)}'"><b>${[x.brandName,x.productName].filter(Boolean).join(' ')||'一本の記録'}</b><small>${x.label}${x.drankAt?' ・ '+String(x.drankAt).slice(0,10):''}</small></div>`).join('')}load();</script></body></html>
