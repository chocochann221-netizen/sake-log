<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="theme-color" content="#f8f6f1">
<title>酒蔵一覧 | 和酒ログ</title>
<link rel="stylesheet" href="assets/fonts/noto-sans-jp.css">
<link rel="stylesheet" href="assets/fonts/noto-serif-jp.css">
<style>
*{box-sizing:border-box}body{margin:0;background:#f8f6f1;color:#27231f;font-family:"Noto Sans JP",system-ui,-apple-system,sans-serif}.wrap{max-width:760px;margin:auto}header{padding:14px 20px;background:#fff;border-bottom:1px solid #e7e0d6}.back{color:#27231f;text-decoration:none;font-size:15px}.hero{padding:42px 22px 30px;border-bottom:1px solid #d9d0c4}.kicker{font-size:13px;font-weight:700;letter-spacing:.14em;color:#8a552f}.hero h1{margin:8px 0 10px;font-family:"Noto Serif JP",serif;font-size:36px;font-weight:400;letter-spacing:.035em}.hero p{margin:0;color:#625b52;font-size:15px;line-height:1.8}.body{padding:22px 22px 72px}.tools{position:sticky;top:0;z-index:2;padding:14px 0;background:rgba(248,246,241,.96)}.search{width:100%;padding:15px 16px;border:1px solid #cfc3b3;border-radius:4px;background:#fff;color:#27231f;font:16px "Noto Sans JP",system-ui,sans-serif}.search:focus{outline:2px solid #8a5a2f;outline-offset:2px}.count{margin:12px 0 4px;font-size:14px;color:#776e64}.list{margin-top:10px;border-top:1px solid #d9d0c4}.brewery{display:grid;grid-template-columns:46px minmax(0,1fr);gap:16px;padding:27px 0 26px;border-bottom:1px solid #d9d0c4}.seal{width:40px;height:40px;margin-top:2px;border:2px solid #76502e;border-radius:50%;display:grid;place-items:center;color:#654527;font-family:"Noto Serif JP",serif;font-size:13px;font-weight:700}.brewery h2{margin:0;font-family:"Noto Serif JP",serif;font-size:25px;line-height:1.4;font-weight:400;letter-spacing:.02em}.place{margin-top:10px;color:#6c6359;font-size:15px;line-height:1.5}.place::before{content:"所在地  ";font-size:12px;font-weight:700;letter-spacing:.08em;color:#927152}.brands{margin-top:8px;color:#3e342b;font-size:16px;line-height:1.55;font-weight:700}.brands::before{content:"代表銘柄  ";font-size:12px;font-weight:700;letter-spacing:.08em;color:#927152}.note{margin:10px 0 0;color:#745b45;font-size:13px;line-height:1.7}.official{display:inline-flex;align-items:center;min-height:44px;margin-top:12px;color:#8a4f29;font-size:14px;font-weight:700;text-decoration:none}.empty{padding:35px 0;color:#776e64}.source{margin-top:28px;color:#776e64;font-size:12px;line-height:1.8}.source a{color:inherit}.timber-line{height:7px;margin:0 22px;background:#cda978;border:1px solid #b58d5e;border-radius:4px;box-shadow:inset 0 1px rgba(255,255,255,.45),0 2px 5px rgba(68,45,25,.1)}
</style>
</head>
<body>
<header><div class="wrap"><a class="back" id="back" href="prefecture-guide.html">← 都道府県ページ</a></div></header>
<div class="wrap"><section class="hero"><div class="kicker">酒蔵を知る</div><h1 id="title">酒蔵一覧</h1><p>土地に根ざして酒を醸す蔵と、代表銘柄をたどります。</p></section><div class="timber-line" aria-hidden="true"></div>
<main class="body"><div class="tools"><label><span style="position:absolute;clip:rect(0 0 0 0)">酒蔵を検索</span><input class="search" id="search" type="search" placeholder="酒蔵名・銘柄・地域から検索"></label><div class="count" id="count"></div></div><div class="list" id="list"></div><div class="source" id="source"></div></main></div>
<script src="prefecture-brewery-data.js?v=1"></script>
<script src="prefecture-niigata-data.js?v=1"></script>
<script src="prefecture-nagano-data.js?v=1"></script>
<script src="prefecture-brewery-source.js?v=2"></script>
<script>
const esc=s=>String(s||"").replace(/[&<>\"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const p=new URLSearchParams(location.search);const prefecture=p.get("prefecture")||p.get("name")||"奈良県";const data=window.WASHULOG_BREWERY_SOURCE.getPrefecture(prefecture);
document.title=prefecture+"の酒蔵 | 和酒ログ";document.getElementById("title").textContent=prefecture+"の酒蔵";document.getElementById("back").href="prefecture-guide.html?name="+encodeURIComponent(prefecture)+"&ui=2";
const input=document.getElementById("search"),list=document.getElementById("list"),count=document.getElementById("count"),source=document.getElementById("source");
function render(){const term=input.value.trim().toLowerCase();const all=data?.breweries||[];const rows=all.filter(b=>[b.name,b.brands,b.place,b.note].join(" ").toLowerCase().includes(term));count.textContent=rows.length+"蔵を掲載";list.innerHTML=rows.length?rows.map((b,i)=>`<article class="brewery"><div class="seal">${String(i+1).padStart(2,"0")}</div><div><h2>${esc(b.name)}</h2><div class="place">${esc(b.place)}</div><div class="brands">${esc(b.brands)}</div>${b.note?`<p class="note">${esc(b.note)}</p>`:""}${b.url?`<a class="official" href="${esc(b.url)}" target="_blank" rel="noopener noreferrer">${esc(b.urlLabel||"公式サイトを見る →")}</a>`:""}</div></article>`).join(""):`<div class="empty">${data?"該当する酒蔵がありません。":"この地域の酒蔵情報は準備中です。"}</div>`;source.innerHTML=data?.source?`掲載情報の確認先：<a href="${esc(data.source)}" target="_blank" rel="noopener noreferrer">${esc(data.sourceLabel)}</a>`:"";}
input.addEventListener("input",render);render();
</script>
</body></html>
