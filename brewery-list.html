<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="theme-color" content="#f3efe6">
<title>酒蔵一覧 | 和酒ログ</title>
<style>
:root{--ink:#28231e;--muted:#73695f;--paper:#f7f3eb;--wood:#8b5b35;--line:#d4c7b6;--accent:#9a4b2b}*{box-sizing:border-box}html{background:#dfd6c9}body{margin:0;background:var(--paper);color:var(--ink);font-family:system-ui,-apple-system,"Noto Sans JP",sans-serif;padding-bottom:76px}.wrap{width:min(100%,760px);margin:auto}.topbar{position:sticky;top:0;z-index:20;background:rgba(247,243,235,.96);border-bottom:1px solid rgba(126,101,76,.2);backdrop-filter:blur(10px)}.topbar-inner{height:54px;display:grid;grid-template-columns:44px 1fr 44px;align-items:center;padding:0 10px}.back{display:grid;place-items:center;width:44px;height:44px;color:var(--ink);font-size:25px;text-decoration:none}.brand{text-align:center;font-family:serif;font-size:17px;letter-spacing:.08em}.brand-mark{display:inline-grid;place-items:center;width:24px;height:24px;margin-right:6px;border:1px solid #6e492c;border-radius:50%;font-size:13px}.hero{position:relative;overflow:hidden;padding:37px 24px 31px;background:linear-gradient(135deg,#eee4d3 0,#f8f4ec 56%,#e5d5bd 100%);border-bottom:1px solid var(--line)}.hero:before{content:"";position:absolute;right:-30px;top:-64px;width:210px;height:210px;border:28px double rgba(110,73,43,.075);border-radius:50%}.hero:after{content:"奈";position:absolute;right:27px;bottom:-35px;color:rgba(112,76,44,.075);font-family:serif;font-size:150px;line-height:1}.hero>*{position:relative;z-index:1}.kicker{font-size:11px;font-weight:800;letter-spacing:.18em;color:var(--accent)}.hero h1{margin:9px 0 10px;font-family:serif;font-size:35px;font-weight:500;letter-spacing:.03em}.hero p{max-width:31em;margin:0;color:#62584e;font-family:serif;font-size:14px;line-height:1.85}.wood-rule{height:8px;margin:0 20px;background:linear-gradient(90deg,#8a5b38,#c39764 18%,#97623c 52%,#c49a68 83%,#835432);border-radius:0 0 5px 5px;box-shadow:0 2px 5px rgba(72,47,28,.22)}.body{padding:16px 20px 42px}.tools{position:sticky;top:54px;z-index:10;padding:9px 0 13px;background:linear-gradient(var(--paper) 78%,rgba(247,243,235,0))}.search-wrap{position:relative}.search-wrap:before{content:"⌕";position:absolute;left:14px;top:8px;font-size:25px;color:#756657}.search{width:100%;height:49px;padding:0 14px 0 44px;border:1px solid #c8b9a6;border-radius:2px;background:rgba(255,255,255,.72);color:var(--ink);font:inherit;box-shadow:0 3px 13px rgba(76,55,35,.06)}.search:focus{outline:2px solid #8a5a2f;outline-offset:2px}.count{margin:10px 2px 0;color:var(--muted);font-size:12px;letter-spacing:.05em}.list{border-top:1px solid #bcae9d}.brewery{display:grid;grid-template-columns:46px minmax(0,1fr);gap:14px;padding:24px 1px 25px;border-bottom:1px solid var(--line)}.seal{width:40px;height:40px;margin-top:1px;border:1px solid #76502e;border-radius:50%;display:grid;place-items:center;color:#68472d;background:#eee3d3;box-shadow:inset 0 0 0 4px var(--paper);font-family:serif;font-size:12px}.brewery h2{margin:0;font-family:serif;font-size:22px;font-weight:600;letter-spacing:.02em}.brands{margin-top:5px;color:#58493b;font-size:14px;font-weight:800}.place{margin-top:8px;color:var(--muted);font-size:12px}.note{margin:9px 0 0;color:#5f574f;font-family:serif;font-size:14px;line-height:1.75}.official{display:inline-flex;align-items:center;min-height:40px;margin-top:12px;padding:0 1px;color:var(--accent);font-size:13px;font-weight:800;text-decoration:none;border-bottom:1px solid rgba(154,75,43,.45)}.official:after{content:"↗";margin-left:7px}.official:focus-visible,.back:focus-visible,.bottom-nav a:focus-visible{outline:2px solid #8a5a2f;outline-offset:3px}.empty{padding:38px 0;color:var(--muted);font-family:serif}.source{margin-top:24px;color:#887d72;font-size:10px;line-height:1.75}.source a{color:inherit}.bottom-nav{position:fixed;z-index:30;left:0;right:0;bottom:0;height:68px;background:rgba(250,248,243,.97);border-top:1px solid #d9cfc1;display:grid;grid-template-columns:repeat(3,1fr);align-items:center}.bottom-nav a{color:#302a25;text-decoration:none;text-align:center;font-family:serif;font-size:11px}.bottom-nav b{display:block;font-size:20px;line-height:1.1;margin-bottom:3px}@media(min-width:761px){body{box-shadow:0 0 40px rgba(53,41,30,.15)}.hero{padding-left:34px}.body{padding-left:32px;padding-right:32px}.brewery{grid-template-columns:54px 1fr;padding-top:28px;padding-bottom:28px}.seal{width:44px;height:44px}}
</style>
</head>
<body>
<header class="topbar"><div class="wrap topbar-inner"><a class="back" id="back" href="prefecture-guide.html" aria-label="都道府県ページへ戻る">‹</a><div class="brand"><span class="brand-mark">和</span>和酒ログ</div><span></span></div></header>
<div class="wrap"><section class="hero"><div class="kicker">酒蔵を知る</div><h1 id="title">酒蔵一覧</h1><p>土地に根ざして酒を醸す蔵と、代表銘柄をたどります。</p></section><div class="wood-rule" aria-hidden="true"></div>
<main class="body"><div class="tools"><label class="search-wrap"><span style="position:absolute;clip:rect(0 0 0 0)">酒蔵を検索</span><input class="search" id="search" type="search" placeholder="酒蔵名・銘柄・地域から検索"></label><div class="count" id="count"></div></div><div class="list" id="list"></div><div class="source" id="source"></div></main></div>
<nav class="bottom-nav" aria-label="メイン"><a href="index.html"><b>⌂</b>ホーム</a><a href="index.html#history"><b>♙</b>MY LOG</a><a href="knowledge.html"><b>▢</b>知識の蔵</a></nav>
<script src="prefecture-brewery-data.js?v=1"></script>
<script src="prefecture-niigata-data.js?v=1"></script>
<script src="prefecture-nagano-data.js?v=1"></script>
<script src="prefecture-brewery-source.js?v=2"></script>
<script>
const esc=s=>String(s||"").replace(/[&<>\"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const p=new URLSearchParams(location.search);const prefecture=p.get("prefecture")||p.get("name")||"奈良県";const data=window.WASHULOG_BREWERY_SOURCE.getPrefecture(prefecture);
document.title=prefecture+"の酒蔵 | 和酒ログ";document.getElementById("title").textContent=prefecture+"の酒蔵";document.getElementById("back").href="prefecture-guide.html?name="+encodeURIComponent(prefecture)+"&ui=3";
const input=document.getElementById("search"),list=document.getElementById("list"),count=document.getElementById("count"),source=document.getElementById("source");
function render(){const term=input.value.trim().toLowerCase();const all=data?.breweries||[];const rows=all.filter(b=>[b.name,b.brands,b.place,b.note].join(" ").toLowerCase().includes(term));count.textContent=rows.length+"蔵を掲載";list.innerHTML=rows.length?rows.map((b,i)=>`<article class="brewery"><div class="seal">${String(i+1).padStart(2,"0")}</div><div><h2>${esc(b.name)}</h2><div class="brands">${esc(b.brands)}</div><div class="place">${esc(b.place)}</div><p class="note">${esc(b.note)}</p>${b.url?`<a class="official" href="${esc(b.url)}" target="_blank" rel="noopener noreferrer">公式サイト</a>`:""}</div></article>`).join(""):`<div class="empty">${data?"該当する酒蔵がありません。":"この地域の酒蔵情報は準備中です。"}</div>`;source.innerHTML=data?.source?`掲載情報の確認先：<a href="${esc(data.source)}" target="_blank" rel="noopener noreferrer">${esc(data.sourceLabel)}</a>`:"";}
input.addEventListener("input",render);render();
</script>
</body></html>
