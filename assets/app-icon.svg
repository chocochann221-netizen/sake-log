<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" role="img" aria-labelledby="title description">
  <title id="title">和酒ログ</title>
  <desc id="description">静かな藍色の背景に、窓の灯りが映る徳利と盃</desc>
  <rect width="512" height="512" fill="#0c2238"/>

  <!-- Tokkuri: a quiet sake silhouette with generous negative space. -->
  <path
    d="M206 84h68v31c0 21 10 39 27 52 38 29 59 74 59 123v51c0 50-40 91-90 91h-60c-50 0-90-41-90-91v-51c0-49 21-94 59-123 17-13 27-31 27-52V84Z"
