  />
  <path d="M198 84c0-12 10-22 22-22h40c12 0 22 10 22 22v19h-84V84Z" fill="#f6f0e3"/>

  <!-- The four panes are the discreet LOG HOUSE signature. -->
  <g fill="#d59b4a">
    <rect x="224" y="174" width="34" height="34" rx="5"/>
    <rect x="266" y="174" width="34" height="34" rx="5"/>
    <rect x="224" y="216" width="34" height="34" rx="5"/>
    <rect x="266" y="216" width="34" height="34" rx="5"/>
  </g>
  <circle cx="310" cy="262" r="5" fill="#d59b4a"/>

  <!-- Ochoko: a low, flared sake cup with a small foot. -->
  <path
    d="M292 326h132l-13 58c-6 27-30 46-58 46h-2c-28 0-52-19-58-46l-13-58h12Z"
    fill="#f6f0e3"
    stroke="#0c2238"
    stroke-width="12"
    stroke-linejoin="round"
  />
  <path d="M292 326c0-12 10-21 22-21h76c12 0 22 9 22 21s-10 21-22 21h-76c-12 0-22-9-22-21Z" fill="#f6f0e3" stroke="#0c2238" stroke-width="12"/>
  <rect x="316" y="318" width="72" height="16" rx="8" fill="#d59b4a"/>
  <path d="M337 420h30v23h-30Z" fill="#f6f0e3"/>
</svg>
