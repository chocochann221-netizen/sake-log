<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#238464">
<title>イベントチラシを送る｜和酒ログ</title>
<style>
*{box-sizing:border-box}body{margin:0;font-family:system-ui,-apple-system,"Noto Sans JP",sans-serif;background:#f6f8f6;color:#17211c}header{position:sticky;top:0;background:#fff;border-bottom:1px solid #dfe4e0;padding:14px 18px}.brand{font-size:21px;font-weight:850}main{max-width:680px;margin:auto;padding:18px}.card{background:#fff;border:1px solid #dfe4e0;border-radius:22px;padding:18px;margin-bottom:14px}h1{font-size:25px;margin:0 0 8px}h2{font-size:18px;margin:0 0 10px}.small{font-size:12px;color:#6f7773;line-height:1.7}.btn{width:100%;padding:14px;border:0;border-radius:14px;font-weight:800;margin-top:10px;font-size:16px}.primary{background:#238464;color:#fff}.outline{background:#fff;border:1px solid #dfe4e0;color:#17211c}.hidden{display:none!important}input,textarea{width:100%;padding:13px;border:1px solid #d5dcd8;border-radius:13px;font:inherit}textarea{min-height:88px}label{display:block;font-size:13px;color:#707874;margin:12px 0 6px}.preview{width:100%;max-height:420px;object-fit:contain;border-radius:16px;background:#eef1ef;margin-top:12px}.msg{margin-top:12px;padding:12px;border-radius:12px;white-space:pre-wrap}.ok{background:#e8f7ef;color:#17683f}.err{background:#fff0ee;color:#a32c22}.info{background:#eef5ff;color:#235a90}.steps{display:grid;grid-template-columns:repeat(3,1fr);gap:7px;margin:14px 0}.step{padding:9px 6px;text-align:center;border-radius:12px;background:#f2f5f3;font-size:11px}.step.on{background:#edf5f1;color:#238464;font-weight:800}.status{padding:12px;border:1px solid #e1e7e3;border-radius:14px;margin-top:10px}.status b{display:block;margin-bottom:3px}
</style>
</head>
<body>
<header><div class="brand">🍶 和酒ログ</div></header>
<main>
<div class="card">
<a href="./" class="small">← 和酒ログへ戻る</a>
<h1 style="margin-top:12px">イベントチラシを送る</h1>
<p class="small">見つけた日本酒イベントのチラシを1枚送るだけ。和酒ログで内容を確認して、公開イベント候補として受け付けます。</p>
<div class="steps"><div class="step on">1 チラシ</div><div class="step">2 確認</div><div class="step">3 公開審査</div></div>
<div id="eligibilityMsg" class="msg info">利用資格を確認しています…</div>
<div id="formBox" class="hidden">
<label>イベントチラシ</label>
<input id="flyer" type="file" accept="image/jpeg,image/png,image/webp" capture="environment">
<img id="preview" class="preview hidden" alt="選択したイベントチラシ">
<label>補足（任意）</label>
<textarea id="note" maxlength="500" placeholder="例：酒屋さんでもらいました／大阪のイベントです"></textarea>
<button id="submitBtn" class="btn primary" disabled>このチラシを和酒ログに送る</button>
<div class="small" style="margin-top:9px">送信した時点では一般公開されません。重複・開催日・主催者情報などを確認してから掲載します。</div>
<div id="msg"></div>
</div>
</div>
<div class="card">
<h2>送ったチラシ</h2>
<div id="history" class="small">読み込み中…</div>
</div>
</main>
<script>
const BASE='https://mtshsijgfmottgkbgnir.supabase.co';
const KEY=localStorage.getItem('sakelog_pubkey')||'sb_publishable_iN9jbt45ga1sPbzt5aw-0w_iWs8eWW-';
const token=localStorage.getItem('sakelog_token')||'';
const user=(()=>{try{return JSON.parse(localStorage.getItem('sakelog_user')||'null')}catch{return null}})();
const $=id=>document.getElementById(id);
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#039;'}[c]));
const authHeaders=extra=>({apikey:KEY,Authorization:'Bearer '+token,...(extra||{})});
let selected=null;
function message(text,type='info'){ $('msg').innerHTML=text?'<div class="msg '+type+'">'+esc(text)+'</div>':''; }
async function jsonFetch(url,opt={}){const r=await fetch(url,{...opt,headers:{...authHeaders(),...(opt.headers||{})}});const d=await r.json().catch(()=>null);if(!r.ok)throw new Error(d?.message||d?.msg||d?.error||('HTTP '+r.status));return d;}
async function init(){
 if(!token||!user?.id){$('eligibilityMsg').className='msg err';$('eligibilityMsg').textContent='和酒ログにログインしてから利用してください。';$('history').textContent='';return;}
 try{
  const rows=await jsonFetch(BASE+'/rest/v1/profiles?select=plan,role&id=eq.'+encodeURIComponent(user.id)+'&limit=1');
  const p=rows?.[0]; const allowed=p&&(p.plan==='premium'||p.plan==='admin'||p.role==='admin');
  if(!allowed){$('eligibilityMsg').className='msg info';$('eligibilityMsg').textContent='イベントチラシ投稿は課金ユーザー向け機能です。';$('history').textContent='';return;}
  $('eligibilityMsg').className='msg ok';$('eligibilityMsg').textContent='✓ チラシを投稿できます';$('formBox').classList.remove('hidden'); await loadHistory();
 }catch(e){$('eligibilityMsg').className='msg err';$('eligibilityMsg').textContent='確認できませんでした：'+e.message;}
}
$('flyer').onchange=e=>{selected=e.target.files?.[0]||null;if(!selected)return;if(selected.size>10*1024*1024){message('画像は10MB以下にしてください。','err');selected=null;return;}const u=URL.createObjectURL(selected);$('preview').src=u;$('preview').classList.remove('hidden');$('submitBtn').disabled=false;message('');};
$('submitBtn').onclick=async()=>{
 if(!selected||!user?.id)return; $('submitBtn').disabled=true; message('チラシを送信しています…','info');
 try{
  const ext=(selected.type.split('/')[1]||'jpg').replace('jpeg','jpg'); const id=crypto.randomUUID(); const path=user.id+'/'+id+'.'+ext;
  const up=await fetch(BASE+'/storage/v1/object/event-flyers/'+path,{method:'POST',headers:authHeaders({'Content-Type':selected.type,'x-upsert':'false'}),body:selected});
  if(!up.ok){const d=await up.json().catch(()=>null);throw new Error(d?.message||'画像を保存できませんでした');}
  const payload={user_id:user.id,image_path:path,extracted:{submitter_note:$('note').value.trim()},submitter_edits:{},source_urls:[],status:'pending'};
  const r=await fetch(BASE+'/rest/v1/event_flyer_submissions',{method:'POST',headers:authHeaders({'Content-Type':'application/json','Prefer':'return=representation'}),body:JSON.stringify(payload)});
  const d=await r.json().catch(()=>null); if(!r.ok)throw new Error(d?.message||'受付できませんでした');
  message('✓ 受け付けました。和酒ログ側で内容と重複を確認してから掲載します。','ok'); selected=null;$('flyer').value='';$('preview').classList.add('hidden');$('note').value=''; await loadHistory();
 }catch(e){message(e.message,'err');$('submitBtn').disabled=false;}
};
async function loadHistory(){
 try{const rows=await jsonFetch(BASE+'/rest/v1/event_flyer_submissions?select=id,status,review_note,confirmed_event_id,created_at&user_id=eq.'+encodeURIComponent(user.id)+'&order=created_at.desc&limit=20');
 const labels={pending:'確認待ち',reviewing:'確認中',approved:'掲載済み',rejected:'掲載見送り',duplicate:'登録済みイベント',draft:'下書き'};
 $('history').innerHTML=rows.length?rows.map(x=>'<div class="status"><b>'+esc(labels[x.status]||x.status)+'</b>'+new Date(x.created_at).toLocaleString('ja-JP')+(x.review_note?'<br>'+esc(x.review_note):'')+'</div>').join(''):'まだ送ったチラシはありません。';
 }catch(e){$('history').textContent='履歴を読み込めませんでした。';}
}
init();
</script>
</body>
</html>
