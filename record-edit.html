<!doctype html><html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>記録を編集 | 和酒ログ</title><style>*{box-sizing:border-box}body{margin:0;background:#f5f4ee;color:#1d251f;font-family:system-ui,-apple-system,"Noto Sans JP",sans-serif}a{text-decoration:none;color:inherit}.app{max-width:430px;margin:auto;min-height:100vh;background:#fbfaf6}.head{padding:15px 18px;border-bottom:1px solid #e4e0d7}.back{font-size:12px;color:#276149;font-weight:800}.wrap{padding:26px 16px 55px}h1{font:700 27px/1.4 serif;margin:0 0 6px}.lead{font-size:12px;color:#727a74;line-height:1.8;margin-bottom:22px}.choice{display:block;background:#fff;border:1px solid #e4e0d7;border-radius:20px;padding:17px;margin-bottom:11px}.choice small{display:block;color:#718078;font-size:10px;margin-bottom:4px}.choice b{font:700 18px serif}.choice p{font-size:11px;line-height:1.75;color:#707873;margin:7px 0 0}.choice span{display:block;margin-top:10px;font-size:11px;color:#286049;font-weight:800}.warning{margin-top:22px;background:#f2f0e9;border-radius:15px;padding:13px;font-size:10px;line-height:1.8;color:#6d695f}</style></head><body><div class="app"><div class="head"><a class="back" href="record-detail.html">← 一本の記録</a></div><main class="wrap"><h1>どこを直しますか？</h1><p class="lead">酒そのものの情報と、この日に残した記録を分けて編集します。</p><a class="choice" href="sake-info-edit.html"><small>酒そのもの</small><b>この一本の情報を直す</b><p>使用米・精米歩合・特定名称・アルコール度数・日本酒度など。</p><span>編集する →</span></a><a class="choice" href="#"><small>今回飲んだ記録</small><b>この日の記録を直す</b><p>日付・飲んだ場所・温度。変更は今回の記録だけに反映します。</p><span>編集する →</span></a><a class="choice" href="#"><small>写真</small><b>写真を直す</b><p>表ラベル・裏ラベル・料理・思い出。写真の変更だけでなく、不要な写真だけを削除することもできます。</p><span>編集する →</span></a><div class="warning">「この一本の情報」は同じ銘柄の基本情報です。「この日の記録」は今回の体験だけの情報です。過去の別の日の記録は変更しません。</div></main></div></body></html>
