<!doctype html><html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>これまでの記録 | 和酒ログ</title><style>*{box-sizing:border-box}body{margin:0;background:#f5f4ee;color:#1d251f;font-family:system-ui,-apple-system,"Noto Sans JP",sans-serif}a{text-decoration:none;color:inherit}.app{max-width:430px;margin:auto;min-height:100vh;background:#fbfaf6}.head{padding:15px 18px;border-bottom:1px solid #e4e0d7}.head a{color:#276149;font-size:12px;font-weight:800}.wrap{padding:25px 16px 60px}h1{font:700 28px serif;margin:0}.lead{font-size:12px;color:#727a74;line-height:1.8;margin:7px 0 20px}.memorySummary{background:#203b32;color:#fff;border-radius:22px;padding:18px;margin-bottom:20px}.memorySummary small{font-size:10px;color:#d5e3dc}.memorySummary h2{font:700 21px serif;margin:5px 0 12px}.memoryStats{display:grid;grid-template-columns:repeat(3,1fr);gap:7px}.memoryStat{background:rgba(255,255,255,.08);border-radius:13px;padding:10px 7px}.memoryStat b{display:block;font:700 21px serif}.memoryStat span{font-size:9px;color:#dce6e1}.memoryLine{margin-top:12px;font-size:11px;line-height:1.75;color:#e2ebe6}.count{font-size:11px;color:#66716b;margin-bottom:11px}.list{display:grid;gap:10px}.record{display:grid;grid-template-columns:76px 1fr;gap:12px;background:#fff;border:1px solid #e4e0d7;border-radius:18px;padding:10px}.photo{height:100px;border-radius:12px;background:#eee9dc;display:flex;align-items:center;justify-content:center;font-size:10px;color:#817a6e;overflow:hidden}.photo img{width:100%;height:100%;object-fit:contain}.record h2{font-size:15px;margin:3px 0 4px}.meta{font-size:10px;line-height:1.65;color:#737a75}.chips{display:flex;gap:4px;flex-wrap:wrap;margin-top:6px}.chip{font-size:9px;padding:3px 6px;border-radius:999px;background:#edf3ef;color:#2c654f}.empty{padding:22px;background:#fff;border:1px solid #e4e0d7;border-radius:18px;font-size:12px;line-height:1.8;color:#6d756f}.more{width:100%;margin-top:14px;padding:13px;border:1px solid #d5ddd7;border-radius:14px;background:#fff;color:#315e4a;font-weight:800}.hidden{display:none}</style></head><body><div class="app"><div class="head"><a href="integrated-preview.html">← ホーム</a></div><main class="wrap"><h1>これまでの記録</h1><p class="lead">飲んできた一本を、日付の新しい順に。評価の一覧ではなく、自分の時間の記録です。</p><section id="memorySummary" class="memorySummary hidden"><small>あなたの日本酒の記憶</small><h2>少しずつ、景色が増えてきました。</h2><div class="memoryStats"><div class="memoryStat"><b id="uniqueSake">0</b><span>出会った酒</span></div><div class="memoryStat"><b id="prefCount">0</b><span>酒が生まれた土地</span></div><div class="memoryStat"><b id="reunionCount">0</b><span>もう一度会った酒</span></div></div><div id="memoryLine" class="memoryLine"></div></section><div id="count" class="count"></div><div id="list" class="list"><div class="empty">記録を読み込んでいます…</div></div><button id="more" class="more hidden">続きを見る</button></main></div><script>const BASE='https://mtshsijgfmottgkbgnir.supabase.co',KEY='sb_publishable_iN9jbt45ga1sPbzt5aw-0w_iWs8eWW-';const token=localStorage.getItem('sakelog_token'),H={'apikey':localStorage.getItem('sakelog_pubkey')||KEY,'Authorization':'Bearer '+token};const $=x=>document.getElementById(x),esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));let offset=0,total=0;const limit=20;function date(v){if(!v)return'';const a=String(v).slice(0,10).split('-');return a.length===3?`${+a[0]}年${+a[1]}月${+a[2]}日`:v}async function photo(path){const r=await fetch(BASE+'/storage/v1/object/sake-photos/'+encodeURI(path),{headers:H});return r.ok?URL.createObjectURL(await r.blob()):null}async function loadMemory(){if(!token)return;const r=await fetch(BASE+'/rest/v1/drinking_records?select=brand,product,brewery_prefecture,prefecture,drank_at&order=drank_at.asc',{headers:H}),rows=await r.json().catch(()=>[]);if(!r.ok||!rows.length)return;const sake=new Map(),prefs=new Set();for(const d of rows){const name=[d.brand,d.product].filter(Boolean).join(' ').trim();if(name)sake.set(name,(sake.get(name)||0)+1);const p=d.brewery_prefecture||d.prefecture;if(p)prefs.add(p)}const reunions=[...sake.values()].filter(n=>n>1).length;$('uniqueSake').textContent=sake.size;$('prefCount').textContent=prefs.size;$('reunionCount').textContent=reunions;const first=rows[0]?.drank_at?date(rows[0].drank_at):'';let line=first?'最初の記録は '+first+'。':'';if(reunions)line+=' 一度きりではなく、また会いにいった酒もあります。';else if(sake.size>1)line+=' 一本ずつ違う出会いが、ここに残っています。';else line+=' ここから、あなたの酒の記憶が育っていきます。';$('memoryLine').textContent=line;$('memorySummary').classList.remove('hidden')}async function load(reset=false){if(reset){offset=0;$('list').innerHTML=''}if(!token){$('list').innerHTML='<div class="empty">ログインすると、これまでの記録がここに並びます。</div>';return}const r=await fetch(BASE+'/rest/v1/drinking_records?select=*&order=drank_at.desc&limit='+limit+'&offset='+offset,{headers:{...H,'Prefer':'count=exact'}}),rows=await r.json().catch(()=>[]);if(!r.ok){$('list').innerHTML='<div class="empty">記録を読み込めませんでした。</div>';return}const cr=r.headers.get('content-range');if(cr&&cr.includes('/'))total=Number(cr.split('/')[1])||rows.length;$('count').textContent=total?total+'件の記録':'';if(!rows.length&&offset===0){$('list').innerHTML='<div class="empty">まだ記録がありません。最初の一本を残してみましょう。</div>';return}for(const d of rows){let master=null;if(d.sake_id){const mr=await fetch(BASE+'/rest/v1/sake_master?select=*&id=eq.'+encodeURIComponent(d.sake_id)+'&limit=1',{headers:H}),ms=mr.ok?await mr.json():[];master=ms[0]||null}let pic='<div class="photo">表ラベル</div>';const pr=await fetch(BASE+'/rest/v1/sake_photos?select=storage_path&drinking_record_id=eq.'+encodeURIComponent(d.id)+'&photo_type=eq.front&limit=1',{headers:H}),ps=pr.ok?await pr.json():[];if(ps[0]){const u=await photo(ps[0].storage_path);if(u)pic='<div class="photo"><img src="'+u+'" alt="表ラベル"></div>'}const name=[master?.brand_name||d.brand_name||d.brand,master?.product_name||d.product_name||d.product].filter(Boolean).join(' ')||'名称未登録',place=d.place_type==='home'?'自宅':d.restaurant_name||'',chips=[d.rice_variety,d.classification,d.serving_temperature].filter(Boolean);$('list').insertAdjacentHTML('beforeend',`<a class="record" href="record-detail.html?id=${encodeURIComponent(d.id)}">${pic}<div><h2>${esc(name)}</h2><div class="meta">${esc(date(d.drank_at))}${place?'<br>'+esc(place):''}${master?.brewing_prefecture||master?.prefecture||d.brewery_prefecture||d.prefecture?'<br>'+esc(master?.brewing_prefecture||master?.prefecture||d.brewery_prefecture||d.prefecture):''}</div><div class="chips">${chips.map(x=>'<span class="chip">'+esc(x)+'</span>').join('')}</div></div></a>`)}offset+=rows.length;$('more').classList.toggle('hidden',offset>=total||rows.length<limit)}$('more').onclick=()=>load();loadMemory();load(true);</script></body></html>
