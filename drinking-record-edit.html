<!doctype html><html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>この日の記録を直す | 和酒ログ</title><style>*{box-sizing:border-box}body{margin:0;background:#f5f4ee;color:#1d251f;font-family:system-ui,-apple-system,"Noto Sans JP",sans-serif}.app{max-width:430px;margin:auto;min-height:100vh;background:#fbfaf6}.head{padding:15px 18px;border-bottom:1px solid #e4e0d7}.head a{text-decoration:none;color:#276149;font-size:12px;font-weight:800}.wrap{padding:25px 18px 55px}h1{font:700 26px/1.4 serif;margin:0 0 5px}.target{font-size:12px;color:#6d756f;margin-bottom:21px}.field{margin-bottom:18px}.field label{display:block;font-size:11px;font-weight:800;margin-bottom:7px}.field input,.field select{width:100%;border:1px solid #dcd9d0;border-radius:14px;background:#fff;padding:13px;font:14px inherit}.place-types{display:grid;grid-template-columns:1fr 1fr;gap:8px}.place-types label{border:1px solid #dcd9d0;background:#fff;border-radius:13px;padding:11px;font-size:12px}.place-types input{width:auto;margin-right:5px}.hint{font-size:9px;color:#858b86;line-height:1.7;margin-top:6px}.temperature-row{display:grid;grid-template-columns:1.4fr .8fr;gap:8px}.save{width:100%;border:0;border-radius:15px;background:#173c32;color:#fff;padding:15px;margin-top:8px;font-weight:800}.notice{margin-top:17px;padding:12px;border-radius:14px;background:#f1efe8;font-size:10px;line-height:1.8;color:#6b685f}</style></head><body><div class="app"><div class="head"><a href="record-edit.html">← 編集する場所を選ぶ</a></div><main class="wrap"><h1>この日の記録を直す</h1><div class="target">今西 純米吟醸 朝日</div><div class="field"><label>飲んだ日</label><input type="date" value="2026-08-25"><div class="hint">画面には日付だけ表示します。時刻は表示しません。</div></div><div class="field"><label>飲んだ場所</label><div class="place-types"><label><input type="radio" name="place" checked>お店</label><label><input type="radio" name="place">自宅</label><label><input type="radio" name="place">イベント</label><label><input type="radio" name="place">その他</label></div></div><div class="field"><label>店名・イベント名など</label><input value="○○店" placeholder="場所を入力"><div class="hint">自宅は住所を保存しません。場所を記録しない場合は空欄でもOKです。</div></div><div class="field"><label>飲んだ温度 <span style="font-weight:400;color:#7d847f">（任意）</span></label><div class="temperature-row"><select><option>記録しない</option><option>雪冷え</option><option>花冷え</option><option>涼冷え</option><option>冷や</option><option>日向燗</option><option>人肌燗</option><option selected>ぬる燗</option><option>上燗</option><option>熱燗</option><option>飛び切り燗</option></select><input type="number" step="0.1" value="42" placeholder="℃" inputmode="decimal"></div><div class="hint">呼び名だけでもOK。温度を残したい日は℃まで入力できます。未入力なら「この日の飲み方」自体を表示しません。</div></div><button class="save" type="button">変更を保存</button><div class="notice">ここで変更するのは、この日に飲んだ記録だけです。同じ銘柄の別の日の記録や、酒そのものの基本情報は変更しません。</div></main></div></body></html>
