<!doctype html><html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>この日の記録を直す | 和酒ログ</title><style>*{box-sizing:border-box}body{margin:0;background:#f5f4ee;color:#1d251f;font-family:system-ui,-apple-system,"Noto Sans JP",sans-serif}.app{max-width:430px;margin:auto;min-height:100vh;background:#fbfaf6}.head{padding:15px 18px;border-bottom:1px solid #e4e0d7}.head a{text-decoration:none;color:#276149;font-size:12px;font-weight:800}.wrap{padding:25px 18px 55px}h1{font:700 26px/1.4 serif;margin:0 0 5px}.target{font-size:12px;color:#6d756f;margin-bottom:21px}.field{margin-bottom:18px}.field label{display:block;font-size:11px;font-weight:800;margin-bottom:7px}.field input,.field select{width:100%;border:1px solid #dcd9d0;border-radius:14px;background:#fff;padding:13px;font:14px inherit}.place-types{display:grid;grid-template-columns:1fr 1fr;gap:8px}.place-types label{border:1px solid #dcd9d0;background:#fff;border-radius:13px;padding:11px;font-size:12px}.place-types input{width:auto;margin-right:5px}.hint{font-size:9px;color:#858b86;line-height:1.7;margin-top:6px}.temperature-row{display:grid;grid-template-columns:1.4fr .8fr;gap:8px}.save{width:100%;border:0;border-radius:15px;background:#173c32;color:#fff;padding:15px;margin-top:8px;font-weight:800}.save:disabled{opacity:.45}.notice,.msg{margin-top:17px;padding:12px;border-radius:14px;font-size:10px;line-height:1.8}.notice{background:#f1efe8;color:#6b685f}.ok{background:#e8f7ef;color:#17683f}.err{background:#fff0ee;color:#a32c22}</style></head><body><div class="app"><div class="head"><a id="backLink" href="record-edit.html">← 編集する場所を選ぶ</a></div><main class="wrap"><h1>この日の記録を直す</h1><div class="target" id="target">記録を読み込んでいます…</div><div class="field"><label>飲んだ日</label><input id="drankDate" type="date"><div class="hint">画面には日付だけ表示します。時刻は表示しません。</div></div><div class="field"><label>飲んだ場所</label><div class="place-types"><label><input type="radio" name="place" value="shop">お店</label><label><input type="radio" name="place" value="home">自宅</label><label><input type="radio" name="place" value="event">イベント</label><label><input type="radio" name="place" value="other">その他</label></div></div><div class="field"><label>店名・イベント名など</label><input id="placeName" placeholder="場所を入力"><div class="hint">自宅は住所を保存しません。場所を記録しない場合は空欄でもOKです。</div></div><div class="field"><label>飲んだ温度 <span style="font-weight:400;color:#7d847f">（任意）</span></label><div class="temperature-row"><select id="tempName"><option value="">記録しない</option><option>雪冷え</option><option>花冷え</option><option>涼冷え</option><option>冷や</option><option>日向燗</option><option>人肌燗</option><option>ぬる燗</option><option>上燗</option><option>熱燗</option><option>飛び切り燗</option></select><input id="tempC" type="number" step="0.1" placeholder="℃" inputmode="decimal"></div><div class="hint">呼び名だけでもOK。温度を残したい日は℃まで入力できます。未入力なら「この日の飲み方」自体を表示しません。</div></div><button id="saveBtn" class="save" type="button" disabled>変更を保存</button><div id="msg"></div><div class="notice">ここで変更するのは、この日に飲んだ記録だけです。同じ銘柄の別の日の記録や、酒そのものの基本情報は変更しません。</div></main></div><script>const BASE='https://mtshsijgfmottgkbgnir.supabase.co';const DEFAULT_KEY='sb_publishable_iN9jbt45ga1sPbzt5aw-0w_iWs8eWW-';const $=id=>document.getElementById(id);const key=()=>localStorage.getItem('sakelog_pubkey')||DEFAULT_KEY;let token=localStorage.getItem('sakelog_token');let refreshToken=localStorage.getItem('sakelog_refresh_token');const recordId=new URLSearchParams(location.search).get('id');function showMsg(t,type='ok'){$('msg').className='msg '+type;$('msg').textContent=t}async function refreshSession(){if(!refreshToken)throw new Error('ログインの有効期限が切れました。');const r=await fetch(BASE+'/auth/v1/token?grant_type=refresh_token',{method:'POST',headers:{apikey:key(),'Content-Type':'application/json'},body:JSON.stringify({refresh_token:refreshToken})});const d=await r.json().catch(()=>({}));if(!r.ok||!d.access_token)throw new Error('ログインを更新できませんでした。');token=d.access_token;refreshToken=d.refresh_token||refreshToken;localStorage.setItem('sakelog_token',token);if(refreshToken)localStorage.setItem('sakelog_refresh_token',refreshToken)}async function authFetch(url,opt={}){const go=()=>fetch(url,{...opt,headers:{...(opt.headers||{}),apikey:key(),Authorization:'Bearer '+token}});let r=await go();if(r.status===401){await refreshSession();r=await go()}return r}function isoDate(v){return v?String(v).slice(0,10):''}async function load(){if(!recordId){showMsg('編集する記録が指定されていません。','err');return}if(!token){showMsg('ログインしてから編集してください。','err');return}$('backLink').href='record-edit.html?id='+encodeURIComponent(recordId);const q=BASE+'/rest/v1/drinking_records?id=eq.'+encodeURIComponent(recordId)+'&select=id,brand,product,drank_at,place_type,restaurant_name,serving_temperature,serving_temperature_c';const r=await authFetch(q);const rows=await r.json().catch(()=>[]);if(!r.ok||!rows.length){showMsg('記録を読み込めませんでした。自分の記録か確認してください。','err');return}const d=rows[0];$('target').textContent=[d.brand,d.product].filter(Boolean).join(' ')||'この日の記録';$('drankDate').value=isoDate(d.drank_at);const p=d.place_type||'';document.querySelectorAll('input[name=place]').forEach(x=>x.checked=x.value===p);$('placeName').value=d.restaurant_name||'';$('tempName').value=d.serving_temperature||'';$('tempC').value=d.serving_temperature_c??'';$('saveBtn').disabled=false}$('saveBtn').onclick=async()=>{try{$('saveBtn').disabled=true;const place=document.querySelector('input[name=place]:checked')?.value||null;const date=$('drankDate').value;if(!date)throw new Error('飲んだ日を入力してください。');const body={drank_at:date+'T12:00:00',place_type:place,restaurant_name:place==='home'?null:($('placeName').value.trim()||null),serving_temperature:$('tempName').value||null,serving_temperature_c:$('tempC').value===''?null:Number($('tempC').value)};const r=await authFetch(BASE+'/rest/v1/drinking_records?id=eq.'+encodeURIComponent(recordId),{method:'PATCH',headers:{'Content-Type':'application/json','Prefer':'return=minimal'},body:JSON.stringify(body)});if(!r.ok)throw new Error('保存に失敗しました。');showMsg('変更を保存しました。一本の記録へ戻ります。');setTimeout(()=>location.href='record-detail.html?id='+encodeURIComponent(recordId),500)}catch(e){showMsg(e.message||'保存に失敗しました。','err')}finally{$('saveBtn').disabled=false}};load().catch(e=>showMsg(e.message||'読み込みに失敗しました。','err'));</script></body></html>
