<!doctype html><html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>この一本の情報を直す | 和酒ログ</title><style>*{box-sizing:border-box}body{margin:0;background:#f5f4ee;color:#1d251f;font-family:system-ui,-apple-system,"Noto Sans JP",sans-serif}.app{max-width:430px;margin:auto;min-height:100vh;background:#fbfaf6}.head{padding:15px 18px;border-bottom:1px solid #e4e0d7}.head a{text-decoration:none;color:#276149;font-size:12px;font-weight:800}.wrap{padding:25px 18px 55px}h1{font:700 26px/1.4 serif;margin:0 0 5px}.target{font-size:12px;color:#6d756f;margin-bottom:20px}.field{margin:0 0 15px}.field label{display:block;font-size:11px;font-weight:800;margin-bottom:6px}.field input{width:100%;border:1px solid #dcd9d0;border-radius:14px;background:#fff;padding:13px;font:14px inherit}.hint{font-size:9px;color:#858b86;line-height:1.6;margin-top:5px}.save{width:100%;border:0;border-radius:15px;background:#173c32;color:#fff;padding:15px;margin-top:9px;font-weight:800}.msg{margin-top:12px;padding:11px;border-radius:12px;font-size:12px}.ok{background:#e8f7ef;color:#17683f}.err{background:#fff0ee;color:#a32c22}.notice{margin-top:17px;padding:12px;border-radius:14px;background:#f1efe8;font-size:10px;line-height:1.8;color:#6b685f}</style></head><body><div class="app"><div class="head"><a id="back" href="record-edit.html">← 編集する場所を選ぶ</a></div><main class="wrap"><h1>この一本の情報を直す</h1><div id="target" class="target">読み込み中…</div><div class="field"><label>使用米・原料米</label><input id="riceVariety"></div><div class="field"><label>原材料名</label><input id="rice"></div><div class="field"><label>精米歩合</label><input id="polishing"></div><div class="field"><label>特定名称・酒類区分</label><input id="classification"></div><div class="field"><label>アルコール度数</label><input id="alcohol"></div><button id="save" class="save" type="button">変更を保存</button><div id="msg"></div><div class="notice">この画面では、選んだ一本の酒情報を修正します。まず今回の記録へ確実に反映し、同じ銘柄の基本情報としても学習できる形にします。</div></main></div><script>
const BASE='https://mtshsijgfmottgkbgnir.supabase.co',KEY='sb_publishable_iN9jbt45ga1sPbzt5aw-0w_iWs8eWW-';const q=new URLSearchParams(location.search),id=q.get('id');const token=localStorage.getItem('sakelog_token');const H={'apikey':localStorage.getItem('sakelog_pubkey')||KEY,'Authorization':'Bearer '+token,'Content-Type':'application/json'};const $=x=>document.getElementById(x);$('back').href='record-edit.html?id='+encodeURIComponent(id||'');function message(t,c){$('msg').innerHTML='<div class="msg '+c+'">'+t+'</div>'}async function load(){if(!id){message('記録IDがありません','err');return}const r=await fetch(BASE+'/rest/v1/drinking_records?select=*&id=eq.'+encodeURIComponent(id)+'&limit=1',{headers:H}),d=await r.json();if(!r.ok||!d[0]){message('記録を読み込めませんでした','err');return}const x=d[0];$('target').textContent=[x.brand_name,x.product_name].filter(Boolean).join(' ')||'名称未登録';$('riceVariety').value=x.rice_variety||'';$('rice').value=x.rice||'';$('polishing').value=x.polishing_ratio||'';$('classification').value=x.classification||'';$('alcohol').value=x.alcohol||''} $('save').onclick=async()=>{try{$('save').disabled=true;message('保存中…','');const body={rice_variety:$('riceVariety').value.trim()||null,rice:$('rice').value.trim()||null,polishing_ratio:$('polishing').value.trim()||null,classification:$('classification').value.trim()||null,alcohol:$('alcohol').value.trim()||null};const r=await fetch(BASE+'/rest/v1/drinking_records?id=eq.'+encodeURIComponent(id),{method:'PATCH',headers:{...H,'Prefer':'return=minimal'},body:JSON.stringify(body)});if(!r.ok)throw new Error((await r.json().catch(()=>({}))).message||'保存できませんでした');message('✓ 更新しました','ok');setTimeout(()=>location.href='index.html#detail?id='+encodeURIComponent(id),500)}catch(e){message(e.message,'err')}finally{$('save').disabled=false}};load();
</script></body></html>
