<!doctype html><html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>この一本の情報を直す | 和酒ログ</title><style>*{box-sizing:border-box}body{margin:0;background:#f5f4ee;color:#1d251f;font-family:system-ui,-apple-system,"Noto Sans JP",sans-serif}.app{max-width:430px;margin:auto;min-height:100vh;background:#fbfaf6}.head{padding:15px 18px;border-bottom:1px solid #e4e0d7}.head a{text-decoration:none;color:#276149;font-size:12px;font-weight:800}.wrap{padding:25px 18px 55px}h1{font:700 26px/1.4 serif;margin:0 0 5px}.target{font-size:12px;color:#6d756f;margin-bottom:20px}.field{margin:0 0 15px}.field label{display:block;font-size:11px;font-weight:800;margin-bottom:6px}.field input{width:100%;border:1px solid #dcd9d0;border-radius:14px;background:#fff;padding:13px;font:14px inherit}.hint{font-size:9px;color:#858b86;line-height:1.6;margin-top:5px}.optional{font-weight:400;color:#7d847f}.save{width:100%;border:0;border-radius:15px;background:#173c32;color:#fff;padding:15px;margin-top:9px;font-weight:800}.notice{margin-top:17px;padding:12px;border-radius:14px;background:#f1efe8;font-size:10px;line-height:1.8;color:#6b685f}.source{margin-top:12px;font-size:10px;line-height:1.75;color:#747b76}</style></head><body><div class="app"><div class="head"><a href="record-edit.html">← 編集する場所を選ぶ</a></div><main class="wrap"><h1>この一本の情報を直す</h1><div class="target">今西 純米吟醸 朝日</div><div class="field"><label>使用米</label><input value="朝日米"><div class="hint">分かる範囲で。空欄なら画面には表示しません。</div></div><div class="field"><label>精米歩合</label><input type="number" min="1" max="100" value="60" inputmode="decimal"><div class="hint">％の数字だけ入力します。</div></div><div class="field"><label>特定名称</label><input value="純米吟醸"></div><div class="field"><label>アルコール度数</label><input type="number" step="0.1" min="0" max="100" value="14" inputmode="decimal"><div class="hint">度数の数字だけ入力します。</div></div><div class="field"><label>日本酒度 <span class="optional">（分かる場合だけ）</span></label><inpu
