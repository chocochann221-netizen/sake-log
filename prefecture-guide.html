<!doctype html><html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#238464"><title>土地から日本酒を知る | 和酒ログ</title><style>*{box-sizing:border-box}body{margin:0;background:#f6f8f6;color:#17211c;font-family:system-ui,-apple-system,"Noto Sans JP",sans-serif}.wrap{max-width:680px;margin:auto}header{padding:14px 18px;background:#fff;border-bottom:1px solid #dfe4e0}.back{color:#238464;text-decoration:none;font-weight:800}.hero{padding:34px 20px;background:#203b32;color:#fff}.hero small{opacity:.75}.hero h1{font-family:serif;font-size:35px;margin:7px 0}.hero p{line-height:1.8;color:#e4ebe7;margin:0}.body{padding:20px 18px 48px}.card{background:#fff;border:1px solid #dfe4e0;border-radius:19px;padding:18px;margin-bottom:12px}.card h2{font-family:serif;font-size:21px;margin:0 0 9px}.card p{margin:0;color:#53605a;line-height:1.85}.note{background:#edf5f0;border-left:4px solid #238464}.link{display:block;text-decoration:none;text-align:center;padding:14px;border:1px solid #bcd9ce;border-radius:14px;color:#238464;background:#fff;font-weight:800;margin-top:12px}</style></head><body><header><div class="wrap"><a class="back" href="terroir-guide.html">← 土地と酒</a></div></header><section class="hero"><div class="wrap"><small>飲んだ一本から土地へ</small><h1 id="title">土地の酒</h1><p id="intro"></p></div></section><main class="wrap body" id="body"></main><script src="prefecture-data.js?v=1"></script><script>const guides=window.WASHULOG_PREFECTURES||{};const q=new URLSearchParams(location.search).get("name")||"高知県";const g=guides[q]||{intro:"一本の酒を入口に、その土地の背景を見てみよう。",culture:"日本酒は土地の暮らしや人と関わりながら造られてきました。",food:"その土地の料理と酒の関係にも目を向けてみよう。",sake:"県名だけで味を決めず、蔵と一本ごとの違いを楽しもう。"};document.title=q+"の酒を知る | 和酒ログ";document.getElementById("title").textContent=q;document.getElementById("intro").textContent=g.intro;document.getElementById("body").innerHTML=`<section class="card"><h2>酒と人</h2><p>${g.culture}</p></section><section class="card"><h2>酒と食</h2><p>${g.food}</p><a class="link" href="pairing-guide.html">料理との合わせ方 →</a></section><section class="card"><h2>この土地の酒を見るとき</h2><p>${g.sake}</p></section><section class="card note"><h2>県名は、答えではなく入口。</h2><p>同じ県でも蔵、米、酵母、造り、商品によって酒は違います。和酒ログでは「この県だからこの味」と決めつけず、自分が飲んだ一本から土地へ興味が広がることを大切にします。</p></section>`;</script></body></html>
