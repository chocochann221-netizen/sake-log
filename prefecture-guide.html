<!doctype html><html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#238464"><title>土地から日本酒を知る | 和酒ログ</title><style>*{box-sizing:border-box}body{margin:0;background:#f6f8f6;color:#17211c;font-family:system-ui,-apple-system,"Noto Sans JP",sans-serif}.wrap{max-width:680px;margin:auto}header{padding:14px 18px;background:#fff;border-bottom:1px solid #dfe4e0}.back{color:#238464;text-decoration:none;font-weight:800}.hero{padding:34px 20px;background:#203b32;color:#fff}.hero small{opacity:.75}.hero h1{font-family:serif;font-size:35px;margin:7px 0}.hero p{line-height:1.8;color:#e4ebe7;margin:0}.body{padding:20px 18px 48px}.card{background:#fff;border:1px solid #dfe4e0;border-radius:19px;padding:18px;margin-bottom:12px}.card h2{font-family:serif;font-size:21px;margin:0 0 9px}.card p{margin:0;color:#53605a;line-height:1.85}.note{background:#edf5f0;border-left:4px solid #238464}.link{display:block;text-decoration:none;text-align:center;padding:14px;border:1px solid #bcd9ce;border-radius:14px;color:#238464;background:#fff;font-weight:800;margin-top:12px}</style></head><body><header><div class="wrap"><a class="back" href="terroir-guide.html">← 土地と酒</a></div></header><section class="hero"><div class="wrap"><small>飲んだ一本から土地へ</small><h1 id="title">土地の酒</h1><p id="intro"></p></div></section><main class="wrap body" id="body"></main><script>const guides={"高知県":{intro:"酒だけでなく、食や宴席の文化まで見ると、高知の一杯が少し違って見えてきます。",culture:"高知では酒が人の集まりや食文化と深く結びついてきました。宴席の文化も知られ、酒を介した交流そのものが土地の魅力の一部です。",food:"海の幸に恵まれ、かつおをはじめとする魚介や土地の料理と酒を一緒に楽しむ文化があります。料理との関係から一本を見るのも面白い入口です。",sake:"高知の酒は「淡麗辛口」などと紹介されることがありますが、県内のすべての酒が同じ味ではありません。蔵や銘柄、造りによる違いを楽しむ前提で、その土地らしい背景を知ってみよう。"},"新潟県":{intro:"米どころとして知られる新潟。雪国の気候や食文化、酒造りの歴史までたどってみよう。",culture:"新潟は全国的にも日本酒の産地として広く知られています。米、水、気候だけで単純化せず、多くの蔵が積み重ねてきた技術や地域ごとの違いにも目を向けたい土地です。",food:"米や魚介など地域の食と一緒に酒が親しまれてきました。日常の食卓との関係を見ると、銘柄だけでは分からない土地の酒文化が見えてきます。",sake:"「新潟＝淡麗辛口」というイメージは有名ですが、現代の新潟酒にはさまざまな個性があります。イメージを答えにせず、一本ごとの違いを楽しもう。"},"兵庫県":{intro:"灘をはじめ、日本酒の歴史を語るうえで欠かせない兵庫。米と水、流通の歴史にも注目です。",culture:"兵庫には日本有数の酒どころである灘五郷があります。酒造りだけでなく、都市や港との関係、酒を届けてきた歴史も土地を知る手がかりになります。",food:"瀬戸内海や日本海、山間部まで地域が広く、食文化も一つではありません。どの地域の蔵なのかまで見ると楽しみが広がります。",sake:"酒米の代表格として知られる山田錦とも深い関係があります。ただし兵庫の蔵がすべて山田錦を使うわけではなく、米の選択も一本ごとの物語です。"},"岡山県":{intro:"雄町の故郷として知られる岡山。米を入口に土地と日本酒をつないでみよう。",culture:"岡山は酒米・雄町と深い関係を持つ土地です。米の歴史をたどることで、県内だけでなく全国の酒蔵とのつながりも見えてきます。",food:"瀬戸内の魚介や地域の食文化など、酒と合わせて楽しめる土地の味があります。酒だけでなく、その土地で何と飲まれているかにも注目です。",sake:"雄町を使った酒にも多様な造りがあります。「雄町だからこの味」と決めず、同じ米が蔵によってどう変わるのかを比べるのも和酒ログならではの楽しみ方です。"}};const q=new URLSearchParams(location.search).get("name")||"高知県";const g=guides[q]||{intro:"一本の酒を入口に、その土地の背景を見てみよう。",culture:"日本酒は土地の暮らしや人と関わりながら造られてきました。",food:"その土地の料理と酒の関係にも目を向けてみよう。",sake:"県名だけで味を決めず、蔵と一本ごとの違いを楽しもう。"};document.title=q+"の酒を知る | 和酒ログ";document.getElementById("title").textContent=q;document.getElementById("intro").textContent=g.intro;document.getElementById("body").innerHTML=`<section class="card"><h2>酒と人</h2><p>${g.culture}</p></section><section class="card"><h2>酒と食</h2><p>${g.food}</p><a class="link" href="pairing-guide.html">料理との合わせ方 →</a></section><section class="card"><h2>この土地の酒を見るとき</h2><p>${g.sake}</p></section><section class="card note"><h2>県名は、答えではなく入口。</h2><p>同じ県でも蔵、米、酵母、造り、商品によって酒は違います。和酒ログでは「この県だからこの味」と決めつけず、自分が飲んだ一本から土地へ興味が広がることを大切にします。</p></section>`;</script></body></html>
