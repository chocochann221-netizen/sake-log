<!doctype html><html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#f8f6f1"><title>土地から日本酒を知る | 和酒ログ</title><style>*{box-sizing:border-box}body{margin:0;background:#f8f6f1;color:#27231f;font-family:system-ui,-apple-system,"Noto Sans JP",sans-serif}.wrap{max-width:760px;margin:auto}header{padding:13px 18px;background:#fff;border-bottom:1px solid #e7e0d6}.back{color:#27231f;text-decoration:none;font-size:14px}.hero{min-height:260px;padding:34px 22px;display:flex;align-items:flex-end;background:#3d3a34;color:#fff;background-size:cover;background-position:center}.hero .wrap{width:100%}.hero small{display:none}.hero h1{font-family:serif;font-size:38px;font-weight:500;margin:0 0 8px}.hero p{font-family:serif;font-size:16px;line-height:1.7;margin:0;max-width:30em;color:#fff}.visual-label{display:none}.body{padding:28px 20px 56px}.card{background:transparent;border:0;border-bottom:1px solid #d9d0c4;border-radius:0;padding:22px 0;margin:0}.card h2{font-family:serif;font-size:22px;font-weight:500;margin:0 0 9px}.card p{margin:0;color:#625b52;line-height:1.85;font-size:16px}.link{display:inline-block;text-decoration:none;padding:10px 0;color:#a64d25;font-size:14px;font-weight:700;margin-top:5px}.link:focus-visible{outline:2px solid #a64d25;outline-offset:3px}.section-kicker{font-size:12px;font-weight:700;letter-spacing:.12em;color:#a64d25;margin-bottom:5px}.brewery-intro{margin-bottom:8px}.brewery-list{display:grid;gap:0;margin-top:12px}.brewery{padding:20px 0;border:0;border-top:1px solid #e0d8cd;background:transparent}.brewery strong{display:block;font-family:serif;font-size:20px;font-weight:500;margin-bottom:4px}.brewery .brandline{font-size:14px;font-weight:700;color:#544b42;margin-bottom:7px}.brewery p{font-size:15px;line-height:1.75}.place{font-size:13px;color:#776e64;margin-top:7px}.story{background:transparent}.food-list{display:flex;flex-wrap:wrap;gap:7px;margin-top:10px}.food{padding:6px 9px;background:#eee8de;color:#554e46;font-size:13px}.region-index{font-family:serif;color:#a64d25;font-size:12px;letter-spacing:.08em;margin-bottom:8px}@media(min-width:681px){.hero{min-height:340px}.body{padding-left:28px;padding-right:28px}.brewery{display:grid;grid-template-columns:190px 1fr;column-gap:28px}}</style></head><body><header><div class="wrap"><a class="back" href="terroir-guide.html">← 土地と酒</a></div></header><section class="hero"><div class="wrap"><h1 id="title">土地の酒</h1><p id="intro"></p></div></section><main class="wrap body" id="body"></main><script src="prefecture-data.js?v=2"></script><script src="prefecture-north-data.js?v=1"></script><script>
const guides=window.WASHULOG_PREFECTURES||{};const north=window.WASHULOG_NORTH_GUIDES||{};const q=new URLSearchParams(location.search).get("name")||"高知県";const g=guides[q]||{intro:"",culture:"",food:"",sake:""};document.title=q+" | 和酒ログ";document.getElementById("title").textContent=q;document.getElementById("intro").textContent=g.intro;
const esc=s=>String(s||"").replace(/[&<>\"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));const ng=north[q];
const featured={
"奈良県":{storyTitle:"奈良の酒の歴史",story:"三輪をはじめ、古代から続く酒造りの歩みと、信仰や寺社との深いつながりがあります。",breweries:[{name:"今西酒造",brands:"みむろ杉・三諸杉",place:"桜井市・三輪",note:"三輪山の麓で、土地の水と歴史に向き合いながら酒を醸す蔵。",url:"https://imanishisyuzou.com/"},{name:"今西清兵衛商店",brands:"春鹿",place:"奈良市・福智院町",note:"奈良町で酒造りを続け、南都諸白の伝統を現在へつなぐ蔵。",url:"https://www.harushika.com/"},{name:"千代酒造",brands:"篠峯・櫛羅",place:"御所市・櫛羅",note:"葛城山の麓で、米と水の個性を丁寧に引き出す酒造りを続ける。",url:"https://chiyoshuzo.co.jp/"},{name:"油長酒造",brands:"風の森・水端",place:"御所市",note:"奈良に受け継がれた酒造りを見つめ直し、現代の一杯へつなぐ蔵。",url:"https://yucho-sake.jp/"},{name:"美吉野醸造",brands:"花巴",place:"吉野郡吉野町・六田",note:"吉野の山あいで、土地の気候や微生物と向き合いながら酒を醸す。",url:"https://www.hanatomoe.com/"},{name:"梅乃宿酒造",brands:"梅乃宿",place:"葛城市",note:"1893年創醸。大和の地で、日本酒と果実酒の新しい楽しみ方を届ける。",url:"https://www.umenoyado.com/"}],source:"https://yamato-umazake.com/brewery-introduction/",sourceLabel:"奈良県酒造組合"},
"東京都":{storyTitle:"都市と山のあいだの酒造り",story:"23区の中心部から西多摩の山あいまで、景色の大きく異なる土地で東京の酒が造られています。",breweries:[{name:"小澤酒造",brands:"澤乃井",place:"青梅市",note:"多摩川上流の山あいで、地域の水とともに酒造りを続ける蔵。",url:"https://www.sawanoi-sake.com/"},{name:"石川酒造",brands:"多満自慢",place:"福生市",note:"福生で日本酒とビールを醸し、酒蔵のある風景をひらく蔵。",url:"https://www.tamajiman.co.jp/"},{name:"田村酒造場",brands:"嘉泉",place:"福生市",note:"江戸後期から福生の地で酒を醸し、敷地の井戸水を仕込みに用いる。",url:"https://www.seishu-kasen.com/"},{name:"豊島屋酒造",brands:"金婚・屋守",place:"東村山市",note:"江戸の酒文化を受け継ぎながら、東村山で酒造りを続ける蔵。",url:"https://www.toshimayasyuzou.co.jp/"},{name:"野口酒造店",brands:"國府鶴",place:"府中市",note:"武蔵国の国府が置かれた府中で、地名の記憶を銘柄に残す蔵。",url:"https://www.noguchi-brewery.co.jp/"},{name:"東京港醸造",brands:"江戸開城",place:"港区・芝",note:"都心の小さな醸造所で、年間を通して東京の酒を造る。",url:"https://tokyoportbrewery.wkmty.com/"}],source:"https://www.tokyosake.or.jp/brewery/",sourceLabel:"東京都酒造組合"},\n"石川県":{storyTitle:"加賀から能登へ、手仕事が息づく土地",story:"金沢の工芸、白山の水、能登の暮らし。手で受け継がれてきた文化のそばで、石川の酒造りも続いています。",breweries:[{name:"福光屋",brands:"福正宗・加賀鳶",place:"金沢市",note:"金沢で長く酒造りを続け、米と水だけで醸す純米蔵として土地の酒を届ける。",url:"https://www.fukumitsuya.co.jp/"},{name:"菊姫",brands:"菊姫",place:"白山市・鶴来",note:"白山の麓、鶴来で米と熟成に向き合い、力強い酒を醸す蔵。",url:"https://www.kikuhime.co.jp/"},{name:"車多酒造",brands:"天狗舞",place:"白山市",note:"白山の伏流水を背景に、山廃仕込を大切にしながら酒を醸す。",url:"https://www.tengumai.co.jp/"},{name:"吉田酒造店",brands:"手取川・吉田蔵u",place:"白山市・安吉町",note:"手取川扇状地の水と地域の米を軸に、次の世代へ続く酒造りを探る。",url:"https://tedorigawa.com/"},{name:"宗玄酒造",brands:"宗玄",place:"珠洲市・宝立町",note:"奥能登・珠洲で酒造りを続け、地域の米と能登杜氏の技をつなぐ。",url:"https://www.sogen-shuzou.com/"},{name:"数馬酒造",brands:"竹葉",place:"鳳珠郡能登町",note:"能登の米と水、人のつながりを大切に、地域とともに酒を醸す。",url:"https://chikuha.co.jp/"}],source:"https://www.ishikawa-sake.jp/",sourceLabel:"石川県酒造組合連合会"}};
const breweryMarkup=b=>`<article class="brewery"><div><strong>${esc(b.name)}</strong><div class="brandline">${esc(b.brands)}</div></div><div><p>${esc(b.note)}</p><div class="place">${esc(b.place)}</div>${b.url?`<a class="link" href="${esc(b.url)}" target="_blank" rel="noopener noreferrer">公式サイトを見る →</a>`:""}</div></article>`;
const ngExtra=ng?`<section class="card story"><div class="section-kicker">物語</div><h2>${esc(ng.storyTitle)}</h2><p>${esc(ng.story)}</p></section><section class="card"><div class="section-kicker">食</div><h2>土地の食</h2><div class="food-list">${ng.foods.map(x=>`<span class="food">${esc(x)}</span>`).join("")}</div></section><section class="card"><div class="section-kicker">酒蔵</div><h2>${esc(q.replace("県",""))}の酒蔵</h2><div class="brewery-list">${ng.breweries.map(breweryMarkup).join("")}</div></section>`:"";
const fg=featured[q];const featuredExtra=fg?`<section class="card story"><div class="section-kicker">物語</div><h2>${esc(fg.storyTitle)}</h2><p>${esc(fg.story)}</p></section><section class="card"><div class="section-kicker">酒蔵</div><h2>${esc(q.replace("県",""))}の主な酒蔵</h2><div class="brewery-list">${fg.breweries.map(breweryMarkup).join("")}</div><a class="link" href="${esc(fg.source)}" target="_blank" rel="noopener noreferrer">掲載情報：${esc(fg.sourceLabel)} →</a></section>`:"";
document.getElementById("body").innerHTML=`<div class="region-index">01　土地</div><section class="card"><h2>${esc(q.replace("県",""))}</h2><p>${esc(g.culture)}</p></section><div class="region-index" style="margin-top:28px">02　食</div><section class="card"><h2>食と暮らし</h2><p>${esc(g.food)}</p></section>${ngExtra}${featuredExtra}<div class="region-index" style="margin-top:28px">03　酒</div><section class="card"><h2>この土地の酒</h2><p>${esc(g.sake)}</p></section>`;
</script><script src="prefecture-hero-final.js?v=1"></script><script src="prefecture-hero-images.js?v=2"></script><script src="prefecture-hero-render.js?v=2"></script></body></html>
