<!doctype html><html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#f8f6f1"><title>土地から日本酒を知る | 和酒ログ</title><style>*{box-sizing:border-box}body{margin:0;background:#f8f6f1;color:#27231f;font-family:system-ui,-apple-system,"Noto Sans JP",sans-serif}.wrap{max-width:760px;margin:auto}header{padding:13px 18px;background:#fff;border-bottom:1px solid #e7e0d6}.back{color:#27231f;text-decoration:none;font-size:14px}.hero{min-height:260px;padding:34px 22px;display:flex;align-items:flex-end;background:#3d3a34;color:#fff;background-size:cover;background-position:center}.hero .wrap{width:100%}.hero small{display:none}.hero h1{font-family:serif;font-size:38px;font-weight:500;margin:0 0 8px}.hero p{font-family:serif;font-size:16px;line-height:1.7;margin:0;max-width:30em;color:#fff}.visual-label{display:none}.body{padding:28px 20px 56px}.card{background:transparent;border:0;border-bottom:1px solid #d9d0c4;border-radius:0;padding:22px 0;margin:0}.card h2{font-family:serif;font-size:22px;font-weight:500;margin:0 0 9px}.card p{margin:0;color:#625b52;line-height:1.85;font-size:16px}.link{display:inline-block;text-decoration:none;padding:10px 0;color:#a64d25;font-size:14px;font-weight:700;margin-top:5px}.link:focus-visible{outline:2px solid #a64d25;outline-offset:3px}.section-kicker{font-size:12px;font-weight:700;letter-spacing:.12em;color:#a64d25;margin-bottom:5px}.brewery-intro{margin-bottom:8px}.brewery-list{display:grid;gap:0;margin-top:12px}.brewery{padding:20px 0;border:0;border-top:1px solid #e0d8cd;background:transparent}.brewery strong{display:block;font-family:serif;font-size:20px;font-weight:500;margin-bottom:4px}.brewery .brandline{font-size:14px;font-weight:700;color:#544b42;margin-bottom:7px}.brewery p{font-size:15px;line-height:1.75}.place{font-size:13px;color:#776e64;margin-top:7px}.story{background:transparent}.food-list{display:flex;flex-wrap:wrap;gap:7px;margin-top:10px}.food{padding:6px 9px;background:#eee8de;color:#554e46;font-size:13px}.food-visual{margin:16px 0 4px}.food-visual img{display:block;width:100%;aspect-ratio:3/2;object-fit:cover;background:#e5ded4}.food-visual figcaption{padding-top:8px;color:#776e64;font-size:11px;line-height:1.6}.food-visual a{color:inherit;text-decoration:none}.food-visual a:focus-visible{outline:2px solid #a64d25;outline-offset:3px}.food-visual-title{font-family:serif;font-size:20px;color:#27231f;margin:12px 0 5px}.region-index{font-family:serif;color:#a64d25;font-size:12px;letter-spacing:.08em;margin-bottom:8px}.brewery-heading-link{display:flex;align-items:center;justify-content:space-between;gap:16px;padding:3px 0 10px;color:inherit;text-decoration:none}.brewery-heading-link h2{margin:0}.brewery-heading-link .arrow{font-size:26px;line-height:1;color:#654527;transition:transform .18s ease}.brewery-heading-link:hover .arrow{transform:translateX(4px)}.brewery-heading-link:focus-visible{outline:2px solid #8a5a2f;outline-offset:5px}.featured-brewery-list{display:grid;gap:9px;margin-top:12px}.timber-brewery{display:grid;grid-template-columns:38px minmax(0,1fr) 22px;align-items:center;gap:13px;padding:16px;background:#cda978;border:1px solid #b58d5e;border-radius:7px;color:#251d16;text-decoration:none;box-shadow:inset 0 1px rgba(255,255,255,.42),inset 0 -2px rgba(86,54,27,.14),0 3px 9px rgba(68,45,25,.13)}.timber-brewery:focus-visible{outline:2px solid #654527;outline-offset:3px}.timber-seal{width:34px;height:34px;border:2px solid #654527;border-radius:50%;display:grid;place-items:center;font-family:serif;font-size:13px;font-weight:700}.timber-main{min-width:0}.timber-main strong{display:block;font-family:serif;font-size:19px;font-weight:600}.timber-meta{margin-top:3px;font-size:12px;font-weight:700;color:#503923}.timber-note{margin-top:5px;font-size:13px;line-height:1.55;color:#4a392a}.timber-arrow{font-size:21px;color:#654527}@media(min-width:681px){.hero{min-height:340px}.body{padding-left:28px;padding-right:28px}.brewery{display:grid;grid-template-columns:190px 1fr;column-gap:28px}}</style></head><body><header><div class="wrap"><a class="back" href="terroir-guide.html">← 土地と酒</a></div></header><section class="hero"><div class="wrap"><h1 id="title">土地の酒</h1><p id="intro"></p></div></section><main class="wrap body" id="body"></main><script src="prefecture-data.js?v=2"></script><script src="prefecture-north-data.js?v=1"></script><script src="prefecture-food-images.js?v=1"></script><script src="prefecture-brewery-data.js?v=1"></script><script>
const guides=window.WASHULOG_PREFECTURES||{};const north=window.WASHULOG_NORTH_GUIDES||{};const foodImages=window.WASHULOG_PREFECTURE_FOOD_IMAGES||{};const q=new URLSearchParams(location.search).get("name")||"高知県";const g=guides[q]||{intro:"",culture:"",food:"",sake:""};document.title=q+" | 和酒ログ";document.getElementById("title").textContent=q;document.getElementById("intro").textContent=g.intro;
const esc=s=>String(s||"").replace(/[&<>\"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));const ng=north[q];const fi=foodImages[q];const foodVisual=fi?`<figure class="food-visual"><a href="${esc(fi.sourcePage)}" target="_blank" rel="noopener noreferrer"><img src="${esc(fi.src)}" alt="${esc(fi.heading)}" style="object-position:${esc(fi.position||"50% center")}" loading="lazy"><div class="food-visual-title">${esc(fi.heading)}</div><p>${esc(fi.caption)}</p><figcaption>${esc(fi.credit)}</figcaption></a></figure>`:"";
const featured=window.WASHULOG_PREFECTURE_BREWERIES||{};
const breweryMarkup=b=>`<article class="brewery"><div><strong>${esc(b.name)}</strong><div class="brandline">${esc(b.brands)}</div></div><div><p>${esc(b.note)}</p><div class="place">${esc(b.place)}</div>${b.url?`<a class="link" href="${esc(b.url)}" target="_blank" rel="noopener noreferrer">公式サイトを見る →</a>`:""}</div></article>`;
const ngExtra=ng?`<section class="card story"><div class="section-kicker">物語</div><h2>${esc(ng.storyTitle)}</h2><p>${esc(ng.story)}</p></section><section class="card"><div class="section-kicker">食</div><h2>土地の食</h2><div class="food-list">${ng.foods.map(x=>`<span class="food">${esc(x)}</span>`).join("")}</div></section><section class="card"><div class="section-kicker">酒蔵</div><h2>${esc(q.replace("県",""))}の酒蔵</h2><div class="brewery-list">${ng.breweries.map(breweryMarkup).join("")}</div></section>`:"";
const timberMarkup=(b,i)=>`<a class="timber-brewery" href="${esc(b.url||("brewery-list.html?prefecture="+encodeURIComponent(q)))}" ${b.url?'target="_blank" rel="noopener noreferrer"':""}><span class="timber-seal">${String(i+1).padStart(2,"0")}</span><span class="timber-main"><strong>${esc(b.name)}</strong><span class="timber-meta">${esc(b.brands)}　｜　${esc(b.place)}</span><span class="timber-note">${esc(b.note)}</span></span><span class="timber-arrow">→</span></a>`;const fg=featured[q];const featuredExtra=fg?`<section class="card story"><div class="section-kicker">物語</div><h2>${esc(fg.storyTitle)}</h2><p>${esc(fg.story)}</p></section><section class="card"><div class="section-kicker">酒蔵</div><a class="brewery-heading-link" href="brewery-list.html?prefecture=${encodeURIComponent(q)}" aria-label="${esc(q.replace("県",""))}の酒蔵一覧を見る"><h2>${esc(q.replace("県",""))}の酒蔵</h2><span class="arrow">→</span></a><p class="brewery-intro">土地に根ざす代表的な蔵から、その土地の酒を知る。</p><div class="featured-brewery-list">${fg.breweries.slice(0,2).map(timberMarkup).join("")}</div></section>`:"";
document.getElementById("body").innerHTML=`<div class="region-index">01　土地</div><section class="card"><h2>${esc(q.replace("県",""))}</h2><p>${esc(g.culture)}</p></section><div class="region-index" style="margin-top:28px">02　食</div><section class="card"><h2>食と暮らし</h2><p>${esc(g.food)}</p>${foodVisual}</section>${ngExtra}${featuredExtra}<div class="region-index" style="margin-top:28px">03　酒</div><section class="card"><h2>この土地の酒</h2><p>${esc(g.sake)}</p></section>`;
</script><script src="prefecture-hero-final.js?v=1"></script><script src="prefecture-hero-images.js?v=2"></script><script src="prefecture-hero-render.js?v=2"></script></body></html>
