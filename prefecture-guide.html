<!doctype html><html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#238464"><title>土地から日本酒を知る | 和酒ログ</title><style>*{box-sizing:border-box}body{margin:0;background:#f6f8f6;color:#17211c;font-family:system-ui,-apple-system,"Noto Sans JP",sans-serif}.wrap{max-width:680px;margin:auto}header{padding:14px 18px;background:#fff;border-bottom:1px solid #dfe4e0}.back{color:#238464;text-decoration:none;font-weight:800}.hero{padding:34px 20px;background:#203b32;color:#fff}.hero small{opacity:.75}.hero h1{font-family:serif;font-size:35px;margin:7px 0}.hero p{line-height:1.8;color:#e4ebe7;margin:0}.body{padding:20px 18px 48px}.card{background:#fff;border:1px solid #dfe4e0;border-radius:19px;padding:18px;margin-bottom:12px}.card h2{font-family:serif;font-size:21px;margin:0 0 9px}.card p{margin:0;color:#53605a;line-height:1.85}.note{background:#edf5f0;border-left:4px solid #238464}.link{display:block;text-decoration:none;text-align:center;padding:14px;border:1px solid #bcd9ce;border-radius:14px;color:#238464;background:#fff;font-weight:800;margin-top:12px}</style></head><body><header><div class="wrap"><a class="back" href="terroir-guide.html">← 土地と酒</a></div></header><section class="hero"><div class="wrap"><small>飲んだ一本から土地へ</small><h1 id="title">土地の酒</h1><p id="intro"></p></div></section><main class="wrap body" id="body"></main><script>const guides={
"高知県":{intro:"酒だけでなく、食や宴席の文化まで見ると、高知の一杯が少し違って見えてきます。",culture:"高知では酒が人の集まりや食文化と深く結びついてきました。宴席の文化も知られ、酒を介した交流そのものが土地の魅力の一部です。",food:"海の幸に恵まれ、かつおをはじめとする魚介や土地の料理と酒を一緒に楽しむ文化があります。料理との関係から一本を見るのも面白い入口です。",sake:"高知の酒は「淡麗辛口」などと紹介されることがありますが、県内のすべての酒が同じ味ではありません。蔵や銘柄、造りによる違いを楽しむ前提で、その土地らしい背景を知ってみよう。"},
"新潟県":{intro:"米どころとして知られる新潟。雪国の気候や食文化、酒造りの歴史までたどってみよう。",culture:"新潟は全国的にも日本酒の産地として広く知られています。米、水、気候だけで単純化せず、多くの蔵が積み重ねてきた技術や地域ごとの違いにも目を向けたい土地です。",food:"米や魚介など地域の食と一緒に酒が親しまれてきました。日常の食卓との関係を見ると、銘柄だけでは分からない土地の酒文化が見えてきます。",sake:"「新潟＝淡麗辛口」というイメージは有名ですが、現代の新潟酒にはさまざまな個性があります。イメージを答えにせず、一本ごとの違いを楽しもう。"},
"兵庫県":{intro:"灘をはじめ、日本酒の歴史を語るうえで欠かせない兵庫。米と水、流通の歴史にも注目です。",culture:"兵庫には日本有数の酒どころである灘五郷があります。酒造りだけでなく、都市や港との関係、酒を届けてきた歴史も土地を知る手がかりになります。",food:"瀬戸内海や日本海、山間部まで地域が広く、食文化も一つではありません。どの地域の蔵なのかまで見ると楽しみが広がります。",sake:"酒米の代表格として知られる山田錦とも深い関係があります。ただし兵庫の蔵がすべて山田錦を使うわけではなく、米の選択も一本ごとの物語です。"},
"岡山県":{intro:"雄町の故郷として知られる岡山。米を入口に土地と日本酒をつないでみよう。",culture:"岡山は酒米・雄町と深い関係を持つ土地です。米の歴史をたどることで、県内だけでなく全国の酒蔵とのつながりも見えてきます。",food:"瀬戸内の魚介や地域の食文化など、酒と合わせて楽しめる土地の味があります。酒だけでなく、その土地で何と飲まれているかにも注目です。",sake:"雄町を使った酒にも多様な造りがあります。「雄町だからこの味」と決めず、同じ米が蔵によってどう変わるのかを比べるのも和酒ログならではの楽しみ方です。"},
"秋田県":{intro:"雪国の暮らしと米どころの風景。その中で育ってきた秋田の酒をたどります。",culture:"秋田では寒い冬の気候のもとで酒造りが発展してきました。酒米や酵母の開発にも取り組み、伝統を受け継ぐ蔵と新しい表現に挑む蔵の両方があります。",food:"きりたんぽや鍋、山菜、発酵食品など、寒い土地の暮らしに根ざした食があります。土地の料理と一緒に酒を見ると、飲み方の背景も見えてきます。",sake:"秋田県内でも蔵ごとの方向性はさまざまです。米や酵母、造りの違いに注目しながら一本ずつ見てみよう。"},
"山形県":{intro:"山と雪、盆地、日本海。地域ごとの表情とともに山形の酒を見てみよう。",culture:"山形には県内各地に酒蔵があり、地域の酒造りを磨きながら日本酒文化を育ててきました。酒米や酵母など地域での研究・開発も土地を知る入口になります。",food:"日本海の魚介、山菜、そば、芋煮など、地域によって多彩な食文化があります。どの地域で造られた一本なのかまで見ると景色が変わります。",sake:"同じ山形県でも庄内、置賜、村山、最上など土地の環境は異なります。県名だけでまとめず、蔵の場所までたどってみよう。"},
"福島県":{intro:"広い県土に会津・中通り・浜通り。それぞれの土地から生まれる酒があります。",culture:"福島は地域ごとに気候や暮らしが異なり、多くの蔵がそれぞれの土地で酒造りを続けています。技術を磨き合う文化も福島の酒を知る大切な背景です。",food:"会津の郷土料理から海沿いの魚介まで、県内の食は一つではありません。酒蔵の所在地と土地の食を一緒にたどるのがおすすめです。",sake:"「福島の酒」という大きなくくりの中にも幅広い個性があります。会津・中通り・浜通り、さらに市町村へと近づいて一本を見てみよう。"},
"長野県":{intro:"高い山々と盆地に囲まれた信州。標高や地域の違いまで酒の背景をたどります。",culture:"長野は広い県内に多くの酒蔵が点在しています。山に囲まれた土地、水、寒冷な気候とともに、それぞれの地域で酒造りが続いてきました。",food:"そば、山菜、きのこ、野沢菜など山国ならではの食文化があります。地域の料理と地元の一本を合わせて土地を感じるのも楽しみ方の一つです。",sake:"県内でも北信・東信・中信・南信など環境はさまざま。長野という県名の先にある蔵の町まで見てみよう。"},
"京都府":{intro:"伏見の酒どころと京都の食文化。長い歴史の中で酒がどう親しまれてきたかを見てみよう。",culture:"京都では伏見が代表的な酒どころとして知られています。都市の歴史や流通、食文化と酒造りが重なりながら発展してきました。",food:"京料理だけでなく、日々の惣菜や漬物など幅広い食文化があります。繊細な料理との関係だけに決めつけず、実際の一本との組み合わせを楽しもう。",sake:"伏見のイメージだけで京都の酒すべてを語ることはできません。蔵ごとの歴史や現在の造りにも目を向けてみよう。"},
"広島県":{intro:"瀬戸内の土地と酒造りの技術。広島の一杯を歴史からたどります。",culture:"広島は酒造りの技術史でも知られる土地で、西条は代表的な酒どころの一つです。地域の水と向き合いながら磨かれてきた造りの工夫にも注目です。",food:"瀬戸内の魚介や牡蠣など、海とつながる食文化があります。酒と料理を一緒に味わうことで土地の輪郭が見えてきます。",sake:"広島の酒にも多様な個性があります。西条だけでなく県内各地の蔵へ目を向け、一本ごとの違いを楽しもう。"},
"佐賀県":{intro:"米どころ佐賀の暮らしとともに育ってきた酒。九州の日本酒文化をのぞいてみよう。",culture:"焼酎の印象が強い九州の中で、佐賀には日本酒を造り続ける蔵が各地にあります。米づくりと酒造りのつながりも土地を知る手がかりです。",food:"有明海や玄界灘の海の幸、佐賀牛など土地の食材は多彩です。実際にその土地で何と飲まれているかにも目を向けてみよう。",sake:"佐賀の酒を一つの味の型にはめず、米や造り、蔵ごとの考え方を比べると九州の日本酒の面白さが広がります。"},
"石川県":{intro:"日本海の食と加賀・能登の文化。暮らしの中にある石川の酒をたどります。",culture:"石川には加賀から能登まで酒蔵があり、地域の食や祭り、暮らしとともに酒が親しまれてきました。能登杜氏の存在も日本酒文化を知る大切な入口です。",food:"日本海の魚介、発酵食品、加賀料理など地域ごとに豊かな食文化があります。酒と食を一緒にたどると土地とのつながりが見えてきます。",sake:"加賀と能登でも土地の表情は異なります。県名だけで味を決めず、蔵がある町と造り手の背景まで見てみよう。"}
};const q=new URLSearchParams(location.search).get("name")||"高知県";const g=guides[q]||{intro:"一本の酒を入口に、その土地の背景を見てみよう。",culture:"日本酒は土地の暮らしや人と関わりながら造られてきました。",food:"その土地の料理と酒の関係にも目を向けてみよう。",sake:"県名だけで味を決めず、蔵と一本ごとの違いを楽しもう。"};document.title=q+"の酒を知る | 和酒ログ";document.getElementById("title").textContent=q;document.getElementById("intro").textContent=g.intro;document.getElementById("body").innerHTML=`<section class="card"><h2>酒と人</h2><p>${g.culture}</p></section><section class="card"><h2>酒と食</h2><p>${g.food}</p><a class="link" href="pairing-guide.html">料理との合わせ方 →</a></section><section class="card"><h2>この土地の酒を見るとき</h2><p>${g.sake}</p></section><section class="card note"><h2>県名は、答えではなく入口。</h2><p>同じ県でも蔵、米、酵母、造り、商品によって酒は違います。和酒ログでは「この県だからこの味」と決めつけず、自分が飲んだ一本から土地へ興味が広がることを大切にします。</p></section>`;</script></body></html>
