<!doctype html><html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#f8f6f1"><title>土地から日本酒を知る | 和酒ログ</title><style>*{box-sizing:border-box}body{margin:0;background:#f8f6f1;color:#27231f;font-family:system-ui,-apple-system,"Noto Sans JP",sans-serif}.wrap{max-width:760px;margin:auto}header{padding:13px 18px;background:#fff;border-bottom:1px solid #e7e0d6}.back{color:#27231f;text-decoration:none;font-size:13px}.hero{min-height:260px;padding:34px 22px;display:flex;align-items:flex-end;background:#3d3a34;color:#fff;background-size:cover;background-position:center}.hero .wrap{width:100%}.hero small{display:none}.hero h1{font-family:serif;font-size:38px;font-weight:500;margin:0 0 8px}.hero p{font-family:serif;font-size:16px;line-height:1.7;margin:0;max-width:30em;color:#fff}.visual-label{display:none}.body{padding:28px 20px 56px}.card{background:transparent;border:0;border-bottom:1px solid #d9d0c4;border-radius:0;padding:22px 0;margin:0}.card h2{font-family:serif;font-size:22px;font-weight:500;margin:0 0 9px}.card p{margin:0;color:#625b52;line-height:1.85;font-size:13px}.note{display:none}.link{display:inline-block;text-decoration:none;padding:10px 0;color:#a64d25;font-size:12px;font-weight:700;margin-top:8px}.section-kicker{font-size:9px;font-weight:700;letter-spacing:.12em;color:#a64d25;margin-bottom:5px}.brewery-list{display:grid;gap:0;margin-top:12px}.brewery{padding:15px 0;border:0;border-top:1px solid #e0d8cd;background:transparent}.brewery strong{display:block;font-family:serif;font-size:18px;font-weight:500;margin-bottom:3px}.brewery .brandline{font-size:12px;font-weight:700;color:#544b42;margin-bottom:5px}.brewery p{font-size:12px;line-height:1.7}.place{font-size:10px;color:#8b8175;margin-top:5px}.story{background:transparent}.story b{color:#6f513c}.food-list{display:flex;flex-wrap:wrap;gap:7px;margin-top:10px}.food{padding:5px 8px;background:#eee8de;color:#554e46;font-size:11px}.region-index{font-family:serif;color:#a64d25;font-size:11px;letter-spacing:.08em;margin-bottom:8px}@media(min-width:681px){.hero{min-height:340px}.body{padding-left:28px;padding-right:28px}.brewery{display:grid;grid-template-columns:180px 1fr;column-gap:20px}}</style></head><body><header><div class="wrap"><a class="back" href="terroir-guide.html">← 土地と酒</a></div></header><section class="hero"><div class="wrap"><small></small><h1 id="title">土地の酒</h1><p id="intro"></p><div class="visual-label" id="visual"></div></div></section><main class="wrap body" id="body"></main><script src="prefecture-data.js?v=2"></script><script src="prefecture-north-data.js?v=1"></script><script>
const guides=window.WASHULOG_PREFECTURES||{};const north=window.WASHULOG_NORTH_GUIDES||{};const q=new URLSearchParams(location.search).get("name")||"高知県";const g=guides[q]||{intro:"",culture:"",food:"",sake:""};document.title=q+" | 和酒ログ";document.getElementById("title").textContent=q;document.getElementById("intro").textContent=g.intro;
const esc=s=>String(s||"").replace(/[&<>\"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));const ng=north[q];
const northExtra=ng?`<section class="card story"><div class="section-kicker">物語</div><h2>${esc(ng.storyTitle)}</h2><p>${esc(ng.story)}</p></section><section class="card"><div class="section-kicker">食</div><h2>土地の食</h2><div class="food-list">${ng.foods.map(x=>`<span class="food">${esc(x)}</span>`).join("")}</div></section><section class="card"><div class="section-kicker">酒蔵</div><h2>${esc(q.replace("県",""))}の酒蔵</h2><div class="brewery-list">${ng.breweries.map(b=>`<div class="brewery"><div><strong>${esc(b.name)}</strong><div class="brandline">${esc(b.brands)}</div></div><div><p>${esc(b.note)}</p><div class="place">${esc(b.place)}</div></div></div>`).join("")}</div></section>`:"";
const nara=q==="奈良県"?`<section class="card story"><div class="section-kicker">物語</div><h2>奈良の酒の歴史</h2><p>三輪の地をはじめ、古代から続く酒造りの歩みと、信仰・寺社との深いつながりがあります。</p></section><section class="card"><div class="section-kicker">酒蔵</div><h2>奈良の酒蔵</h2><div class="brewery-list"><div class="brewery"><div><strong>今西酒造</strong><div class="brandline">みむろ杉・三諸杉</div></div><div><p>三輪山の麓で酒を醸す蔵。</p><div class="place">桜井市・三輪</div></div></div><div class="brewery"><div><strong>今西清兵衛商店</strong><div class="brandline">春鹿</div></div><div><p>奈良町で酒造りを続ける蔵。</p><div class="place">奈良市・福智院町</div></div></div><div class="brewery"><div><strong>千代酒造</strong><div class="brandline">櫛羅・篠峯</div></div><div><p>葛城山麓の米と水を生かす蔵。</p><div class="place">御所市・櫛羅</div></div></div><div class="brewery"><div><strong>油長酒造</strong><div class="brandline">風の森・水端</div></div><div><p>奈良の酒造りを現代につなぐ蔵。</p><div class="place">御所市</div></div></div><div class="brewery"><div><strong>美吉野醸造</strong><div class="brandline">花巴</div></div><div><p>吉野の風土とともに酒を醸す蔵。</p><div class="place">吉野郡吉野町・六田</div></div></div><div class="brewery"><div><strong>梅乃宿酒造</strong><div class="brandline">梅乃宿</div></div><div><p>葛城山の麓で1893年創業。</p><div class="place">葛城市</div></div></div></div></section>`:"";
document.getElementById("body").innerHTML=`<div class="region-index">01　土地</div><section class="card"><h2>${esc(q.replace("県",""))}</h2><p>${esc(g.culture)}</p></section><div class="region-index" style="margin-top:28px">02　物語</div><section class="card"><h2>食と暮らし</h2><p>${esc(g.food)}</p></section>${northExtra}${nara}<div class="region-index" style="margin-top:28px">03　酒蔵</div><section class="card"><h2>この土地の酒</h2><p>${esc(g.sake)}</p></section>`;
</script><script src="prefecture-hero-final.js?v=1"></script><script src="prefecture-hero-images.js?v=2"></script><script src="prefecture-hero-render.js?v=2"></script></body></html>
