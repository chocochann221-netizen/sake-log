on:none}.editorial-breweries{padding:25px 22px 6px;background:#faf9f5}.editorial-breweries h2{margin:0;font-family:serif;font-size:30px;font-weight:500}.editorial-breweries>p{margin:4px 0 14px;color:#625b52;font-family:serif;font-size:14px}.editorial-all{display:block;width:max-content;margin:17px auto 0;color:#27231f;font-family:serif;font-size:14px;text-decoration:none;border-bottom:1px solid #776e64;padding-bottom:3px}.editorial-body .featured-brewery-list{margin-top:12px}.editorial-body .timber-brewery{background-color:#d9b27e;background-blend-mode:soft-light;background-image:url("https://commons.wikimedia.org/wiki/Special:Redirect/file/Wood%20planks%20diff%208k%20%28Amal%20Kumar%20via%20Poly%20Haven%29.png?width=1280");background-size:720px auto;background-position:center;border-radius:5px;grid-template-columns:52px minmax(0,1fr) 28px;min-height:105px;padding:13px 17px 13px 13px;border:1px solid #9b6f43;box-shadow:0 5px 8px rgba(66,42,22,.25),inset 0 0 0 999px rgba(202,155,99,.22)}.editorial-body .timber-brewery:nth-child(odd){margin:0 5px 0 0}.editorial-body .timber-brewery:nth-child(even){margin:0 0 0 5px;background-position:bottom center}.editorial-body .timber-brewery:before,.editorial-body .timber-brewery:after{display:none}.editorial-body .timber-seal{width:47px;height:47px;background:rgba(218,180,132,.55);border-color:#4f321e}.editorial-body .timber-main{display:grid;grid-template-columns:minmax(150px,.8fr) 1fr;align-items:center}.editorial-body .timber-detail{border-left:1px solid rgba(57,36,20,.55);padding-left:20px}.editorial-body .timber-detail b{display:block;font-family:serif;font-size:13px;margin-bottom:3px}.editorial-body .timber-main strong{font-size:21px}.editorial-body .timber-meta{font-size:12px;border-left:1px solid rgba(57,36,20,.55);padding-left:20px}.editorial-body .timber-note{grid-column:2;border-left:1px solid rgba(57,36,20,.55);padding-left:20px;margin-top:1px}.editorial-body .timber-arrow{border-left:1px solid rgba(57,36,20,.55);height:56px;display:grid;place-items:center}.bottom-nav{position:fixed;z-index:20;left:0;right:0;bottom:0;height:68px;background:rgba(250,249,245,.97);border-top:1px solid #ddd3c6;display:none;grid-template-columns:repeat(3,1fr);align-items:center}.bottom-nav a{color:#2d2925;text-decoration:none;text-align:center;font-family:serif;font-size:11px}.bottom-nav b{display:block;font-size:20px;line-height:1.1;margin-bottom:3px}.editorial-body+.bottom-nav{display:grid}@media(min-width:681px){.hero{min-height:340px}.body{padding-left:28px;padding-right:28px}.brewery{display:grid;grid-template-columns:190px 1fr;column-gap:28px}}</style></head><body><header><div class="wrap"><a class="back" href="terroir-guide.html">← 土地と酒</a></div></header><section class="hero"><div class="hero-brand"><span class="hero-brand-mark">和</span>和酒ログ</div><div class="wrap"><h1 id="title">土地の酒</h1><p id="intro"></p></div></section><main class="wrap body" id="body"></main><script src="prefecture-data.js?v=2"></script><script src="prefecture-north-data.js?v=1"></script><script src="prefecture-food-images.js?v=3"></script><script src="prefecture-brewery-data.js?v=1"></script><script>
const guides=window.WASHULOG_PREFECTURES||{};const north=window.WASHULOG_NORTH_GUIDES||{};const foodImages=window.WASHULOG_PREFECTURE_FOOD_IMAGES||{};const q=new URLSearchParams(location.search).get("name")||"高知県";const g=guides[q]||{intro:"",culture:"",food:"",sake:""};document.title=q+" | 和酒ログ";document.getElementById("title").textContent=q;document.getElementById("intro").textContent=g.intro;
const esc=s=>String(s||"").replace(/[&<>\"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));const ng=north[q];const fi=foodImages[q];const foodVisual=fi?`<figure class="food-visual"><a href="${esc(fi.sourcePage)}" target="_blank" rel="noopener noreferrer"><img src="${esc(fi.src)}" alt="${esc(fi.heading)}" style="object-position:${esc(fi.position||"50% center")}" loading="lazy"><div class="food-visual-title">${esc(fi.heading)}</div><p>${esc(fi.caption)}</p><figcaption>${esc(fi.credit)}</figcaption></a></figure>`:"";

const breweryMarkup=b=>`<article class="brewery"><div><strong>${esc(b.name)}</strong><div class="brandline">${esc(b.brands)}</div></div><div><p>${esc(b.note)}</p><div class="place">${esc(b.place)}</div>${b.url?`<a class="link" href="${esc(b.url)}" target="_blank" rel="noopener noreferrer">公式サイトを見る →</a>`:""}</div></article>`;
const ngExtra=ng?`<section class="card story"><div class="section-kicker">物語</div><h2>${esc(ng.storyTitle)}</h2><p>${esc(ng.story)}</p></section><section class="card"><div class="section-kicker">食</div><h2>土地の食</h2><div class="food-list">${ng.foods.map(x=>`<span class="food">${esc(x)}</span>`).join("")}</div></section><section class="card"><div class="section-kicker">酒蔵</div><h2>${esc(q.replace(/[都道府県]$/,""))}の酒蔵</h2><div class="brewery-list">${ng.breweries.map(breweryMarkup).join("")}</div></section>`:"";
const editorialTimberMarkup=(b,i)=>`<a class="timber-brewery" href="${esc(b.url||("brewery-list.html?prefecture="+encodeURIComponent(q)))}" ${b.url?'target="_blank" rel="noopener noreferrer"':""}><span class="timber-seal">${["一","二"][i]||String(i+1)}</span><span class="timber-main"><span><strong>${esc(b.name)}</strong><span class="timber-meta" style="border:0;padding:0">${esc(b.brands)}</span></span><span class="timber-detail"><b>${esc(b.place)}</b><span class="timber-note" style="border:0;padding:0">${esc(b.note)}</span></span></span><span class="timber-arrow">→</span></a>`;const timberMarkup=(b,i)=>`<a class="timber-brewery" href="${esc(b.url||("brewery-list.html?prefecture="+encodeURIComponent(q)))}" ${b.url?'target="_blank" rel="noopener noreferrer"':""}><span class="timber-seal">${String(i+1).padStart(2,"0")}</span><span class="timber-main"><strong>${esc(b.name)}</strong><span class="timber-meta">${esc(b.brands)}　｜　${esc(b.place)}</span><span class="timber-note">${esc(b.note)}</span></span><span class="timber-arrow">→</span></a>`;const fg=featured[q];const featuredExtra=fg?`<section class="card story"><div class="section-kicker">物語</div><h2>${esc(fg.storyTitle)}</h2><p>${esc(fg.story)}</p></section><section class="card"><div class="section-kicker">酒蔵</div><a class="brewery-heading-link" href="brewery-list.html?prefecture=${encodeURIComponent(q)}" aria-label="${esc(q.replace(/[都道府県]$/,""))}の酒蔵一覧を見る"><h2>${esc(q.replace(/[都道府県]$/,""))}の酒蔵</h2><span class="arrow">→</span></a><p class="brewery-intro">土地に根ざす代表的な蔵から、その土地の酒を知る。</p><div class="featured-brewery-list">${fg.breweries.slice(0,2).map(timberMarkup).join("")}</div></section>`:"";
const er=editorialRegions[q];if(er&&fg&&fi){document.getElementById("intro").style.display="none";document.getElementById("body").className="wrap editorial-body";document.getElementById("body").innerHTML=`<section class="editorial-intro">悠久の時が息づく奈良で、<br>酒に出会う。</section><figure class="editorial-figure"><a href="${esc(er.href)}" target="_blank" rel="noopener noreferrer"><img src="${esc(er.src)}" alt="${esc(er.heading)}"></a><figcaption class="editorial-caption"><h2>${esc(er.heading)}</h2><p>${esc(er.caption)}</p><a class="editorial-credit" href="${esc(er.href)}" target="_blank" rel="noopener noreferrer">${esc(er.credit)}</a></figcaption></figure><figure class="editorial-figure"><a href="${esc(fi.sourcePage)}" target="_blank" rel="noopener noreferrer"><img src="${esc(fi.src)}" alt="${esc(fi.heading)}" style="object-position:${esc(fi.position||"50% center")}"></a><figcaption class="editorial-caption"><h2>${esc(fi.heading)}</h2><p>${esc(fi.caption)}</p><a class="editorial-credit" href="${esc(fi.sourcePage)}" target="_blank" rel="noopener noreferrer">${esc(fi.credit)}</a></figcaption></figure><section class="editorial-breweries"><h2>奈良の酒蔵</h2><p>風土が育む、個性豊かな酒蔵たち。</p><div class="featured-brewery-list">${fg.breweries.slice(0,2).map(editorialTimberMarkup).join("")}</div><a class="editorial-all" href="brewery-list.html?prefecture=${encodeURIComponent(q)}">すべての酒蔵　→</a></section>`;}else{document.getElementById("body").innerHTML=`<div class="region-index">01　土地</div><section class="card"><h2>${esc(q.replace(/[都道府県]$/,""))}</h2><p>${esc(g.culture)}</p></section><div class="region-index" style="margin-top:28px">02　食</div><section class="card"><h2>食と暮らし</h2><p>${esc(g.food)}</p>${foodVisual}</section>${ngExtra}${featuredExtra}<div class="region-index" style="margin-top:28px">03　酒</div><section class="card"><h2>この土地の酒</h2><p>${esc(g.sake)}</p></section>`;}
</script><nav class="bottom-nav" aria-label="メイン"><a href="index.html"><b>⌂</b>ホーム</a><a href="index.html#history"><b>♙</b>MY LOG</a><a href="knowledge.html"><b>▢</b>知識の蔵</a></nav><script src="prefecture-hero-final.js?v=1"></script><script src="prefecture-hero-images.js?v=3"></script><script src="prefecture-hero-render.js?v=2"></script></body></html>
