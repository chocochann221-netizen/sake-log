<!doctype html><html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#238464"><title>土地から日本酒を知る | 和酒ログ</title><style>*{box-sizing:border-box}body{margin:0;background:#f6f8f6;color:#17211c;font-family:system-ui,-apple-system,"Noto Sans JP",sans-serif}.wrap{max-width:680px;margin:auto}header{padding:14px 18px;background:#fff;border-bottom:1px solid #dfe4e0}.back{color:#238464;text-decoration:none;font-weight:800}.hero{padding:34px 20px;background:#203b32;color:#fff}.hero small{opacity:.75}.hero h1{font-family:serif;font-size:35px;margin:7px 0}.hero p{line-height:1.8;color:#e4ebe7;margin:0}.visual-label{margin-top:14px;font-size:12px;color:#cfe1d9}.body{padding:20px 18px 48px}.card{background:#fff;border:1px solid #dfe4e0;border-radius:19px;padding:18px;margin-bottom:12px}.card h2{font-family:serif;font-size:21px;margin:0 0 9px}.card p{margin:0;color:#53605a;line-height:1.85}.note{background:#edf5f0;border-left:4px solid #238464}.link{display:block;text-decoration:none;text-align:center;padding:14px;border:1px solid #bcd9ce;border-radius:14px;color:#238464;background:#fff;font-weight:800;margin-top:12px}.section-kicker{font-size:11px;font-weight:800;letter-spacing:.1em;color:#238464;margin-bottom:5px}.brewery-list{display:grid;gap:10px;margin-top:12px}.brewery{padding:15px;border:1px solid #e2e7e4;border-radius:15px;background:#fbfcfb}.brewery strong{display:block;font-family:serif;font-size:18px;margin-bottom:3px}.brewery .brandline{font-size:12px;font-weight:800;color:#238464;margin-bottom:7px}.brewery p{font-size:13px;line-height:1.75}.place{font-size:11px;color:#7a847f;margin-top:7px}.story{background:#fffaf1;border-color:#eadfc9}.story b{color:#76543a}.food-list{display:flex;flex-wrap:wrap;gap:8px;margin-top:12px}.food{padding:7px 10px;border-radius:999px;background:#f2f6f3;color:#355247;font-size:12px;font-weight:700}</style></head><body><header><div class="wrap"><a class="back" href="terroir-guide.html">← 土地と酒</a></div></header><section class="hero"><div class="wrap"><small>飲んだ一本から土地へ</small><h1 id="title">土地の酒</h1><p id="intro"></p><div class="visual-label" id="visual"></div></div></section><main class="wrap body" id="body"></main><script src="prefecture-data.js?v=2"></script><script src="prefecture-north-data.js?v=1"></script><script>
const guides=window.WASHULOG_PREFECTURES||{};const north=window.WASHULOG_NORTH_GUIDES||{};const q=new URLSearchParams(location.search).get("name")||"高知県";const g=guides[q]||{intro:"一本の酒を入口に、その土地の背景を見てみよう。",culture:"日本酒は土地の暮らしや人と関わりながら造られてきました。",food:"その土地の料理と酒の関係にも目を向けてみよう。",sake:"県名だけで味を決めず、蔵と一本ごとの違いを楽しもう。"};document.title=q+"の酒を知る | 和酒ログ";document.getElementById("title").textContent=q;document.getElementById("intro").textContent=g.intro;
const esc=s=>String(s||"").replace(/[&<>\"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const ng=north[q];if(ng)document.getElementById("visual").textContent="TOP IMAGE｜"+ng.visual;
const northExtra=ng?`<section class="card story"><div class="section-kicker">${esc(q.replace("県",""))} SAKE STORY</div><h2>${esc(ng.storyTitle)}</h2><p>${esc(ng.story)}</p></section><section class="card"><div class="section-kicker">LOCAL FOOD</div><h2>この土地で、何と飲む？</h2><p>酒だけでなく、その土地の食卓も一緒に見てみよう。</p><div class="food-list">${ng.foods.map(x=>`<span class="food">${esc(x)}</span>`).join("")}</div></section><section class="card"><div class="section-kicker">BREWERIES</div><h2>${esc(q.replace("県",""))}の酒蔵を訪ねる</h2><p>順位ではなく、この土地の酒文化を知る入口として紹介します。</p><div class="brewery-list">${ng.breweries.map(b=>`<div class="brewery"><strong>${esc(b.name)}</strong><div class="brandline">${esc(b.brands)}</div><p>${esc(b.note)}</p><div class="place">${esc(b.place)}</div></div>`).join("")}</div></section>`:"";
const nara=q==="奈良県"?`<section class="card story"><div class="section-kicker">NARA SAKE STORY</div><h2>奈良は、酒造りの歴史をたどる土地。</h2><p>古い酒造りの文化が息づく奈良では、寺院醸造の歴史を見つめ直す蔵、土地の米や水を前面に出す蔵、現代の技術で新しい表現に挑む蔵が同じ県内にあります。「奈良の酒はこの味」とひとつに括るより、一本ごとに造り手と土地をたどると面白さが広がります。</p></section><section class="card"><div class="section-kicker">BREWERIES</div><h2>奈良の酒蔵を訪ねる</h2><p>まず知ってほしい蔵を、代表銘柄と土地の物語から。順位ではなく、奈良の酒文化を知る入口として紹介します。</p><div class="brewery-list"><div class="brewery"><strong>今西酒造</strong><div class="brandline">みむろ杉・三諸杉</div><p>三輪の地で酒を醸す蔵。酒そのものから三輪という土地へ興味を広げてみたい一本です。</p><div class="place">桜井市・三輪</div></div><div class="brewery"><strong>今西清兵衛商店</strong><div class="brandline">春鹿</div><p>奈良市・福智院町で酒を醸す蔵。奈良の町を歩くことと、地酒を知ることが自然につながります。</p><div class="place">奈良市・福智院町</div></div><div class="brewery"><strong>千代酒造</strong><div class="brandline">櫛羅・篠峯</div><p><b>「櫛羅」は地名。</b> 蔵の周りの自社田で育てた山田錦と、葛城山麓の土地で汲む水を組み合わせ、「櫛羅の味」を醸すことを大切にしています。</p><div class="place">御所市・櫛羅</div></div><div class="brewery"><strong>油長酒造</strong><div class="brandline">風の森・水端</div><p>「風の森」は御所市の風の森峠に由来。地元の秋津穂から始まった酒と、奈良の古い酒造りを探求する酒の両方から、伝統と現代を見られます。</p><div class="place">御所市</div></div><div class="brewery"><strong>美吉野醸造</strong><div class="brandline">花巴</div><p>吉野川を臨む六田の蔵。地元の米や蔵につく微生物を生かし、吉野の風土と結びついた酒造りを続けています。</p><div class="place">吉野郡吉野町・六田</div></div><div class="brewery"><strong>梅乃宿酒造</strong><div class="brandline">梅乃宿</div><p>葛城山の麓で1893年から酒造りを続ける蔵。日本酒を軸にしながら、新しい酒文化や体験にも取り組んでいます。</p><div class="place">葛城市</div></div></div></section>`:"";
document.getElementById("body").innerHTML=`<section class="card"><h2>酒と人</h2><p>${g.culture}</p></section><section class="card"><h2>酒と食</h2><p>${g.food}</p><a class="link" href="pairing-guide.html">料理との合わせ方 →</a></section>${northExtra}${nara}<section class="card"><h2>この土地の酒を見るとき</h2><p>${g.sake}</p></section><section class="card note"><h2>県名は、答えではなく入口。</h2><p>同じ県でも蔵、米、酵母、造り、商品によって酒は違います。和酒ログでは「この県だからこの味」と決めつけず、自分が飲んだ一本から土地へ興味が広がることを大切にします。</p></section>`;
</script></body></html>
