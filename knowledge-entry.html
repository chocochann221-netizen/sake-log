<!doctype html>
<html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#238464"><title>この一本を、もっと知る | 和酒ログ</title><style>*{box-sizing:border-box}body{margin:0;font-family:system-ui,-apple-system,"Noto Sans JP",sans-serif;background:#f6f8f6;color:#17211c}header{background:#fff;border-bottom:1px solid #dfe4e0;padding:14px 18px}.head{max-width:680px;margin:auto;display:flex;align-items:center;gap:12px}.back{border:1px solid #dfe4e0;background:#fff;border-radius:12px;padding:9px 12px;font-weight:700;text-decoration:none;color:#238464}.brand{font-size:19px;font-weight:850}main{max-width:680px;margin:auto;padding:18px 18px 44px}.hero{background:linear-gradient(135deg,#eaf7f1,#fff);border:1px solid #cfe2d9;border-radius:24px;padding:22px;margin-bottom:16px}.eyebrow{font-size:12px;color:#238464;font-weight:800;margin-bottom:7px;letter-spacing:.04em}.hero h1{font-size:26px;margin:0 0 7px}.hero p{margin:0;color:#66716b;line-height:1.7}.facts{display:flex;gap:7px;flex-wrap:wrap;margin-top:13px}.pill{font-size:11px;padding:5px 9px;background:#fff;border:1px solid #dbe5df;border-radius:999px}.lead{font-size:13px;color:#66716b;line-height:1.7;margin:18px 2px 12px}.cards{display:grid;gap:11px}.card{display:block;background:#fff;border:1px solid #dfe4e0;border-radius:18px;padding:16px;text-decoration:none;color:inherit;box-shadow:0 4px 16px rgba(35,70,55,.04)}.card strong{display:block;font-size:16px;margin-bottom:5px}.card span{display:block;font-size:12px;line-height:1.65;color:#6b756f}.arrow{float:right;color:#238464}.why{margin-top:18px;padding:16px;border-radius:18px;background:#203b32;color:#fff;line-height:1.75;font-size:13px}.why b{color:#d7f4e8}.all{display:block;text-align:center;margin-top:16px;color:#238464;font-weight:800;text-decoration:none;padding:12px}</style></head><body><header><div class="head"><a class="back" href="index.html">← 戻る</a><div class="brand">和酒ログ</div></div></header><main><section class="hero"><div class="eyebrow">この一本から、もう少し奥へ。</div><h1 id="title">この一本を、もっと知る</h1><p>難しい勉強ではなく、いま飲んだ酒に関係するところだけ。気になった扉をひとつ開いてみてください。</p><div class="facts" id="facts"></div></section><div class="lead">この酒の記録から、関係しそうな「知識の蔵」を選びました。</div><section class="cards" id="cards"></section><div class="why"><b>いつか蔵元にも聞いてみたい。</b><br>「なぜこの米なのか？」「なぜこの造りなのか？」スペックの答えではなく、その一本を造った理由まで残せる和酒ログを目指します。</div><a class="all" href="knowledge.html">知識の蔵を全部見る →</a></main><script>
const p=new URLSearchParams(location.search);const brand=p.get('brand')||'';const product=p.get('product')||'';const ingredients=p.get('rice')||'';const riceVariety=p.get('riceVariety')||'';const polishing=p.get('polishing')||'';const classification=p.get('classification')||'';const esc=s=>String(s||'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#039;'}[c]));const name=[brand,product].filter(Boolean).join(' ');if(name)document.getElementById('title').textContent=name+'を、もっと知る';const facts=[riceVariety&&('使用米 '+riceVariety),ingredients&&('原材料 '+ingredients),polishing&&('精米歩合 '+polishing),classification&&classification].filter(Boolean);document.getElementById('facts').innerHTML=facts.map(x=>`<span class="pill">${esc(x)}</span>`).join('');const text=(brand+' '+product+' '+ingredients+' '+riceVariety+' '+classification).toLowerCase();const cards=[];if(riceVariety){const normalized=riceVariety.replace(/\s|100%|１００％/g,'');const riceUrl=/朝日米|^朝日$/.test(normalized)?'rice-asahi.html':'knowledge.html#rice-guide';cards.push([riceVariety+'を知る','この一本に使われた米。どんな特徴があり、なぜ造り手がこの米を選んだのか、その背景へ。',riceUrl]);}else if(ingredients){cards.push(['日本酒の米を知る','酒米だけでなく、食用米から生まれる日本酒もあります。米と酒の関係を見てみる。','knowledge.html#rice-guide']);}if(polishing)cards.push(['精米歩合って？','「60%」なら何を60%残したのか。ラベルの数字を読み解く。','knowledge.html#label-guide']);if(/生酛|きもと|山廃/.test(text))cards.push(['生酛・山廃って？','酒母の造り方を知ると、この言葉の見え方が変わります。','brewing.html#shubo']);if(/生酒|生原酒|生詰|生貯蔵/.test(text))cards.push(['火入れって？','「生」の意味を、火入れ工程から見てみる。','brewing.html#hiire']);if(/吟醸|大吟醸/.test(text))cards.push(['吟醸造りをたどる','米を磨き、麹をつくり、低温で発酵させる。その背景へ。','brewing.html']);cards.push(['この酒はどう造られた？','精米から蒸米、麹、酒母、醪、搾り、火入れまで一本の流れを歩く。','brewing.html']);document.getElementById('cards').innerHTML=cards.map(c=>`<a class="card" href="${c[2]}"><span class="arrow">→</span><strong>${esc(c[0])}</strong><span>${esc(c[1])}</span></a>`).join('');
</script></body></html>
