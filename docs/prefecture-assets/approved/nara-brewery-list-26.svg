      .name{font-size:25px;font-weight:700}.brand{font-size:17px;fill:#6c6254}.num{font-size:14px;letter-spacing:1px;fill:#805738}.place{font-size:15px;fill:#6f5b44}.arrow{font-size:27px;fill:#806044}
    </style>
