<!doctype html><html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>一本の記録 | 和酒ログ</title><style>*{box-sizing:border-box}body{margin:0;background:#f5f4ee;color:#1d251f;font-family:system-ui,-apple-system,"Noto Sans JP",sans-serif}a{text-decoration:none;color:inherit}.app{max-width:430px;margin:auto;min-height:100vh;background:#fbfaf6}.head{padding:15px 18px;border-bottom:1px solid #e4e0d7}.back{font-size:12px;color:#276149;font-weight:800}.hero{padding:20px 18px}.bottle{height:250px;background:#ece7da;border-radius:22px;display:flex;align-items:center;justify-content:center;color:#827b6e;font:15px serif;overflow:hidden}.bottle img{width:100%;height:100%;object-fit:contain}.backlabel{display:none;text-align:center;font-size:11px;color:#376653;font-weight:800;margin-top:9px}.hero h1{font:700 27px/1.35 serif;margin:17px 0 4px}.brew{font-size:12px;color:#6e756f;line-height:1.7}.reunion{margin-top:12px;font:italic 13px serif;color:#66736b}.wrap{padding:0 16px 55px}.card{background:#fff;border:1px solid #e4e0d7;border-radius:20px;padding:17px;margin-bottom:12px}.card h2{font:700 19px serif;margin:0 0 12px}.facts{display:grid;grid-template-columns:1fr 1fr;gap:8px}.fact{background:#f5f6f2;border-radius:13px;padding:10px}.fact small{display:block;color:#838984;font-size:9px}.fact b{font-size:13px}.temperature{display:flex;align-items:center;justify-content:space-between;background:#eef3ef;border-radius:14px;padding:12px}.temperature b{font:700 18px serif}.temperature span{font-size:11px;color:#667069}.photos{display:grid;grid-template-columns:1fr 1fr;gap:8px}.memory{height:112px;background:#eee9dc;border-radius:14px;display:flex;align-items:center;justify-content:center;font-size:11px;color:#817a6e;overflow:hidden}.memory img{width:100%;height:100%;object-fit:cover}.note{font-size:13px;line-height:1.85;color:#4f5751}.history a{display:block;padding:13px 2px;border-bottom:1px solid #ece9e1}.history b{font-size:13px}.history span{display:block;margin-top:4px;font-size:10px;color:#737b75}.journey{display:grid;gap:8px}.journey a{display:block;border:1px solid #e3e5df;border-radius:14px;padding:13px}.journey b{font-size:14px}.journey span{display:block;font-size:10px;color:#747b76;margin-top:3px}.primaryJourney{background:#edf3ef;border-color:#cadbd1!important}.message{display:block;margin-top:10px;border:1px solid #d9e2dc;border-radius:14px;padding:13px}.official{display:none;margin-top:9px;border:1px solid #d9e2dc;border-radius:14px;padding:13px}.official b{font-size:13px}.official span{display:block;font-size:10px;color:#747b76;margin-top:3px}.edit{float:right;font-size:11px;color:#376653}.hidden{display:none!important}.status{padding:24px 18px;font-size:12px;color:#6e756f}</style></head><body><div class="app"><div class="head"><a class="back" href="integrated-preview.html">← 最近の記録</a></div><div id="status" class="status">一本の記録を読み込んでいます…</div><div id="content" class="hidden"><section class="hero"><div id="front" class="bottle">表ラベル写真なし</div><a id="backlabel" class="backlabel" href="#">裏ラベルを見る →</a><h1 id="title"></h1><div id="brew" class="brew"></div><div id="reunion" class="reunion hidden"></div></section><main class="wrap"><section class="card"><a id="edit" class="edit" href="record-edit.html">編集</a><h2>この一本</h2><div id="facts" class="facts"></div><div id="extra" class="note"></div></section><section id="drinkCard" class="card hidden"><h2>この日の飲み方</h2><div class="temperature"><div><small>飲んだ温度</small><br><b id="temp"></b></div><span id="tempC"></span></div></section><section id="memoryCard" class="card hidden"><h2>この日の記憶</h2><div id="photos" class="photos"></div></section><section class="card"><h2>飲んだ記録</h2><p id="drank" class="note"></p></section><section id="historyCard" class="card hidden"><h2 id="historyTitle"></h2><div id="history" class="history"></div></section><section class="card"><h2>もう少し、この一本を知る</h2><div class="journey"><a id="knowledge" class="primaryJourney" href="knowledge-entry.html"><b>この一本から、知識の蔵へ</b><span>この酒に関係する米・造り・言葉だけを選んで見る</span></a><a id="land" href="land-and-sake.html"><b>酒が生まれた土地へ</b><span>その土地の酒文化や食へ</span></a><a href="drinking-guide.html"><b>温度を歩く</b><span>飲み方の言葉を、もう少し知る</span></a></div></section><section class="card"><h2>造り手を知る</h2><p class="note">最後は、造り手自身の言葉へ。和酒ログが代わりに語りすぎず、確認できる公式情報につなぎます。</p><a id="official" class="official" target="_blank" rel="noopener"><b>蔵元の公式サイトへ</b><span>造り手自身の情報を見る →</span></a><a id="message" class="message" href="maker-message.html"><b>造り手へ、ひとこと</b><span>ひとこと預ける →</span></a></section></main></div></div><script>const BASE='https://mtshsijgfmottgkbgnir.supabase.co',KEY='sb_publishable_iN9jbt45ga1sPbzt5aw-0w_iWs8eWW-';const id=new URLSearchParams(location.search).get('id'),token=localStorage.getItem('sakelog_token'),H={'apikey':localStorage.getItem('sakelog_pubkey')||KEY,'Authorization':'Bearer '+token};const $=x=>document.getElementById(x);const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));function date(v){if(!v)return'';const d=String(v).slice(0,10).split('-');return d.length===3?`${+d[0]}年${+d[1]}月${+d[2]}日`:v}async function photoUrl(p){const r=await fetch(BASE+'/storage/v1/object/sake-photos/'+encodeURI(p),{headers:H});return r.ok?URL.createObjectURL(await r.blob()):null}async function load(){if(!id)throw Error('記録が指定されていません。');const r=await fetch(BASE+'/rest/v1/drinking_records?select=*&id=eq.'+encodeURIComponent(id)+'&limit=1',{headers:H}),rows=await r.json();if(!r.ok||!rows[0])throw Error('この記録を読み込めませんでした。');const d=rows[0];let master=null;if(d.sake_id){const mr=await fetch(BASE+'/rest/v1/sake_master?select=*&id=eq.'+encodeURIComponent(d.sake_id)+'&limit=1',{headers:H});const ms=mr.ok?await mr.json():[];master=ms[0]||null}const pick=(m,r)=>m??r;$('title').textContent=[d.brand,d.product].filter(Boolean).join(' ')||'名称未登録';$('brew').innerHTML=[d.brewery,d.brewery_prefecture||d.prefecture].filter(Boolean).map(esc).join('<br>');$('edit').href='record-edit.html?id='+encodeURIComponent(id);const fact=[['使用米',d.rice_variety],['精米歩合',d.polishing_ratio],['特定名称',d.classification],['アルコール度数',d.alcohol],['日本酒度',d.sake_meter_value],['酸度',d.acidity]].filter(x=>x[1]!==null&&x[1]!==undefined&&String(x[1]).trim()!=='');$('facts').innerHTML=fact.map(x=>`<div class="fact"><small>${esc(x[0])}</small><b>${esc(x[1])}</b></div>`).join('');$('extra').innerHTML=d.rice?'<br><b>原材料</b><br>'+esc(d.rice):'';if(d.serving_temperature||d.serving_temperature_c!==null&&d.serving_temperature_c!==undefined){$('drinkCard').classList.remove('hidden');$('temp').textContent=d.serving_temperature||'温度記録';$('tempC').textContent=d.serving_temperature_c!==null&&d.serving_temperature_c!==undefined?d.serving_temperature_c+'℃':''}const place=d.place_type==='home'?'自宅':(d.restaurant_name||'');$('drank').innerHTML=esc(date(d.drank_at))+(place?'<br>'+esc(place):'');const pr=await fetch(BASE+'/rest/v1/sake_photos?select=*&drinking_record_id=eq.'+encodeURIComponent(id),{headers:H}),photos=pr.ok?await pr.json():[];const front=photos.find(p=>p.photo_type==='front'),back=photos.find(p=>p.photo_type==='back');if(front){const u=await photoUrl(front.storage_path);if(u)$('front').innerHTML='<img src="'+u+'" alt="表ラベル">'}if(back){const u=await photoUrl(back.storage_path);if(u){$('backlabel').style.display='block';$('backlabel').onclick=e=>{e.preventDefault();$('front').innerHTML='<img src="'+u+'" alt="裏ラベル">';$('backlabel').style.display='none'}}const memories=photos.filter(p=>p.photo_type==='food'||p.photo_type==='memory');if(memories.length){$('memoryCard').classList.remove('hidden');for(const p of memories){const u=await photoUrl(p.storage_path);$('photos').insertAdjacentHTML('beforeend','<div class="memory">'+(u?'<img src="'+u+'">':esc(p.photo_type==='food'?'料理':'思い出'))+'</div>')}}const same=await fetch(BASE+'/rest/v1/drinking_records?select=id,drank_at,restaurant_name,place_type,serving_temperature&brand=eq.'+encodeURIComponent(d.brand||'')+'&product=eq.'+encodeURIComponent(d.product||'')+'&order=drank_at.desc',{headers:H}),hist=same.ok?await same.json():[];if(hist.length>1){$('reunion').classList.remove('hidden');$('reunion').textContent='この一本とは、'+hist.length+'回目の出会い。';$('historyCard').classList.remove('hidden');$('historyTitle').textContent='これまでの記録　'+hist.length+'回';$('history').innerHTML=hist.map(x=>`<a href="record-detail.html?id=${encodeURIComponent(x.id)}"><b>${esc(date(x.drank_at))}${x.place_type==='home'?'　自宅':x.restaurant_name?'　'+esc(x.restaurant_name):''}</b>${x.serving_temperature?'<span>'+esc(x.serving_temperature)+'</span>':''}</a>`).join('')}const official=master?.product_official_url||master?.brewery_official_url||master?.official_url||d.brewery_url||d.official_url||d.source_url||'';if(official&&/^https?:\/\//i.test(official)){$('official').href=official;$('official').style.display='block'}const k=new URLSearchParams({brand:d.brand||'',product:d.product||'',riceVariety:d.rice_variety||'',polishing:d.polishing_ratio||'',classification:d.classification||''});$('knowledge').href='knowledge-entry.html?'+k;$('message').href='maker-message.html?recordId='+encodeURIComponent(id);$('status').classList.add('hidden');$('content').classList.remove('hidden')}load().catch(e=>{$('status').textContent=e.message||'読み込みに失敗しました。'});</script></body></html>
