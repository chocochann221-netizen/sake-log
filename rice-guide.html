<!doctype html><html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#238464"><title>米を知る | 和酒ログ</title><style>*{box-sizing:border-box}body{margin:0;background:#f5f6f2;color:#20251f;font-family:system-ui,-apple-system,"Noto Sans JP",sans-serif}header{background:#fff;border-bottom:1px solid #dedfd9;padding:14px 18px}.head,main{max-width:680px;margin:auto}.back{color:#236c55;text-decoration:none;font-weight:700}.hero{padding:34px 22px 28px;background:#203b32;color:#fff}.hero small{opacity:.72;letter-spacing:.08em}.hero h1{font-family:serif;font-size:38px;margin:10px 0 8px}.hero p{line-height:1.85;margin:0;color:#e4ebe7}.body{padding:22px 18px 48px}.section{background:#fff;border:1px solid #e1e2dc;border-radius:20px;padding:20px;margin-bottom:14px}.section h2{font-family:serif;font-size:21px;margin:0 0 10px}.section p{line-height:1.9;margin:0;color:#4d554f}.question{background:#edf5f0;border-left:4px solid #238464}.question h2{color:#1d604b}.note{font-size:12px;color:#717a74;line-height:1.75;margin-top:18px}.source{font-size:12px;margin-top:12px}.source a{color:#236c55}</style></head><body><header><div class="head"><a class="back" href="knowledge.html">← 知識の蔵</a></div></header><div class="hero"><div class="head"><small>米を知る</small><h1 id="name">米</h1><p id="lead"></p></div></div><main class="body"><div id="content"></div></main><script>
const data={

'五百万石':{lead:'新潟を代表する酒造好適米のひとつ。',origin:'「菊水」と「新200号」を両親として新潟県で育成された酒造好適米です。',brew:'新潟の酒造りを支えてきた代表的な原料米の一つです。',place:'新潟県を中心に広く栽培されてきました。',source:'https://www.pref.niigata.lg.jp/sec/jozo/annai.html',label:'新潟県醸造試験場'},

};
const aliases={'朝日米':'朝日米','朝日':'朝日米','山田錦':'山田錦','雄町':'雄町','備前雄町':'雄町','五百万石':'五百万石','美山錦':'美山錦','出羽燦々':'出羽燦々','越淡麗':'越淡麗','吟風':'吟風','彗星':'彗星','きたしずく':'きたしずく','北雫':'きたしずく'};
const raw=new URLSearchParams(location.search).get('name')||'';const key=Object.keys(aliases).sort((a,b)=>b.length-a.length).find(k=>raw.includes(k));const name=aliases[key]||raw;const d=data[name];const esc=s=>String(s||'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#039;'}[c]));

if(d){document.title=name+'を知る | 和酒ログ';document.getElementById('lead').textContent=d.lead;document.getElementById('content').innerHTML=`<section class="section"><h2>どんな米？</h2><p>${esc(d.origin)}</p></section><section class="section"><h2>酒造りとの関係</h2><p>${esc(d.brew)}</p></section><section class="section"><h2>どこで育つ？</h2><p>${esc(d.place)}</p></section><section class="section question"><h2>なぜ、この米なのか？</h2><p>同じ米でも、蔵・水・麹・酵母・精米・発酵の設計で酒は変わります。だから和酒ログでは「この米ならこの味」と決めつけません。次に知りたいのは、造り手がこの一本にこの米を選んだ理由です。</p></section><div class="note">品種の特徴は酒の味を一意に決めるものではありません。和酒ログでは公的資料などをもとに、確認できた事実と造り手の考えを分けて紹介します。</div><div class="source">参考：<a href="${d.source}" target="_blank" rel="noopener">${esc(d.label)} ↗</a></div>`}else{document.getElementById('lead').textContent='この米の個別ページは、まだ仕込み中です。';document.getElementById('content').innerHTML='<section class="section"><h2>これから育てます</h2><p>記録された米を集めながら、確認できる資料をもとに個別ページを増やしていきます。</p></section>'}
