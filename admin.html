<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>和酒ログ｜管理ダッシュボード</title>

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI",
        "Noto Sans JP", sans-serif;
      background: #f5f3ee;
      color: #292722;
    }

    header {
      background: #24211c;
      color: white;
      padding: 22px 18px;
    }

    header h1 {
      margin: 0;
      font-size: 22px;
    }

    header p {
      margin: 7px 0 0;
      color: #cfc9bd;
      font-size: 13px;
    }

    main {
      max-width: 900px;
      margin: auto;
      padding: 20px 16px 50px;
    }

    .status {
      background: #fff;
      border-radius: 14px;
      padding: 15px;
      margin-bottom: 18px;
      box-shadow: 0 2px 10px #0000000d;
    }

    .status-title {
      font-weight: bold;
    }

    .status-text {
      margin-top: 5px;
      color: #777;
      font-size: 13px;
    }

    .grid {
      display: grid;
      grid-template-columns: repeat(2, 1fr);
      gap: 12px;
    }

    .card {
      background: white;
      border-radius: 16px;
      padding: 18px;
      min-height: 125px;
      box-shadow: 0 2px 10px #0000000d;
    }

    .icon {
      font-size: 24px;
    }

    .label {
      margin-top: 10px;
      color: #777;
      font-size: 13px;
    }

    .number {
      margin-top: 4px;
      font-size: 29px;
      font-weight: 700;
    }

    h2 {
      margin-top: 30px;
      font-size: 18px;
    }

    .menu {
      background: white;
      border-radius: 16px;
      overflow: hidden;
      box-shadow: 0 2px 10px #0000000d;
    }

    .menu-item {
  width: 100%;
  display: block;
  padding: 17px;
  border: 0;
  border-bottom: 1px solid #eee;
  background: white;
  color: #292722;
  text-align: left;
  font: inherit;
  font-size: 16px;
  cursor: pointer;
}

.menu-item:last-child {
  border-bottom: none;
}

.menu-item:active {
  background: #f5f3ee;
}

    footer {
      text-align: center;
      color: #999;
      font-size: 12px;
      margin-top: 35px;
    }

    @media (min-width: 700px) {
      .grid {
        grid-template-columns: repeat(4, 1fr);
      }
    }
  </style>
</head>

<body>

<header>
  <h1>🍶 和酒ログ 管理</h1>
  <p>Administration Dashboard</p>
</header>

<main>

  <div class="status">
    <div class="status-title">🔐 管理者モード</div>
    <div class="status-text">
      管理者認証を確認してデータを表示します
    </div>
  </div>

  <div class="grid">

    <div class="card">
      <div class="icon">👥</div>
      <div class="label">登録ユーザー</div>
      <div class="number" id="users">—</div>
    </div>

    <div class="card">
      <div class="icon">🍶</div>
      <div class="label">飲酒記録</div>
      <div class="number" id="drinking">—</div>
    </div>

    <div class="card">
      <div class="icon">📷</div>
      <div class="label">保存写真</div>
      <div class="number" id="photos">—</div>
    </div>

    <div class="card">
      <div class="icon">🔍</div>
      <div class="label">AI認識</div>
      <div class="number" id="recognition">—</div>
    </div>

    <div class="card">
      <div class="icon">✏️</div>
      <div class="label">認識修正</div>
      <div class="number" id="corrections">—</div>
    </div>

    <div class="card">
      <div class="icon">🧠</div>
      <div class="label">学習辞書</div>
      <div class="number" id="dictionary">—</div>
    </div>

    <div class="card">
  <div class="icon">⚠️</div>
  <div class="label">重複候補</div>
  <div class="number" id="duplicates">—</div>
</div>

    <div class="card">
      <div class="icon">📚</div>
      <div class="label">日本酒マスター</div>
      <div class="number" id="master">—</div>
    </div>

  </div>

  <h2>管理メニュー</h2>

<div class="menu">
  <button class="menu-item" onclick="showUsers()">👥 ユーザー管理</button>
  <button class="menu-item" onclick="showRecognition()">🔍 AI認識結果</button>
  <button class="menu-item" onclick="showCorrections()">✏️ 誤認識・修正データ</button>
  <button class="menu-item" onclick="showSakeMaster()">🍶 日本酒マスター管理</button>
  <button class="menu-item" onclick="showDictionary()">🧠 学習辞書管理</button>
</div>
  
  <footer>
    和酒ログ Administrator
  </footer>

</main>

  <script>
  const BASE = "https://mtshsijgfmottgkbgnir.supabase.co";

  const cfgKey = () =>
  localStorage.getItem("sakelog_pubkey") || "";

  const token =
    localStorage.getItem("sakelog_token") ||
    localStorage.getItem("sakelog_access_token");

  async function loadAdminDashboard() {
    const statusText = document.querySelector(".status-text");

    try {
      if (!token) {
        statusText.textContent =
          "ログイン情報がありません。和酒ログへログインしてください。";
        return;
      }

      const key = cfgKey();

      if (!key) {
        statusText.textContent =
          "Supabase接続情報が見つかりません。";
        return;
      }

      const response = await fetch(
        BASE + "/rest/v1/rpc/admin_dashboard_stats",
        {
          method: "POST",
          headers: {
            "apikey": key,
            "Authorization": "Bearer " + token,
            "Content-Type": "application/json"
          },
          body: "{}"
        }
      );

      if (!response.ok) {
        const text = await response.text();
        throw new Error(text);
      }

      const data = await response.json();

      if (!data) {
        statusText.textContent =
          "管理者権限がありません。";
        return;
      }

      document.getElementById("users").textContent =
        data.users ?? 0;

      document.getElementById("drinking").textContent =
        data.drinking_records ?? 0;

      document.getElementById("photos").textContent =
        data.sake_photos ?? 0;

      document.getElementById("recognition").textContent =
        data.recognition_results ?? 0;

      document.getElementById("corrections").textContent =
        data.corrections ?? 0;

      document.getElementById("dictionary").textContent =
        data.sake_dictionary ?? 0;

      document.getElementById("master").textContent =
        data.sake_master ?? 0;

      statusText.textContent =
        "管理者認証済み・Supabase接続中";
    } catch (error) {
  console.error(error);

  statusText.textContent =
         "管理データ取得エラー：" + error.message;
    }
  }
function showAdminPanel(title, html) {
  let panel = document.getElementById("adminDetailPanel");

  if (!panel) {
    panel = document.createElement("div");
    panel.id = "adminDetailPanel";
    panel.style.cssText = `
      margin-top:20px;
      background:white;
      border-radius:16px;
      padding:18px;
      box-shadow:0 2px 10px #0000000d;
    `;

    const menu = document.querySelector(".menu");
    menu.insertAdjacentElement("afterend", panel);
  }

  panel.innerHTML = `
    <h2 style="margin-top:0">${title}</h2>
    ${html}
  `;

  panel.scrollIntoView({
    behavior: "smooth",
    block: "start"
  });
}


async function showUsers() {

  showAdminPanel(
    "👥 ユーザー管理",
    "<p>ユーザーデータを読み込んでいます...</p>"
  );

  try {

    const key = cfgKey();

    const r = await fetch(
      BASE + "/rest/v1/rpc/admin_list_users",
      {
        method: "POST",
        headers: {
          "apikey": key,
          "Authorization": "Bearer " + token,
          "Content-Type": "application/json"
        },
        body: "{}"
      }
    );

    const text = await r.text();

    if (!r.ok) {
      throw new Error(text);
    }

    const users = JSON.parse(text);

    const rows = users.map(user => `
      <div style="
        padding:14px 0;
        border-bottom:1px solid #eee;
      ">
        <strong>${user.display_name || "名前未設定"}</strong><br>
        <span style="font-size:13px;color:#777">
          ${user.email || ""}<br>
          権限：${user.role || "user"}
          ／ プラン：${user.plan || "free"}
          ／ 記録：${user.record_count ?? 0}件
        </span>
      </div>
    `).join("");

    showAdminPanel(
      "👥 ユーザー管理",
      rows || "<p>ユーザーはいません。</p>"
    );

  } catch (error) {

    console.error(error);

    showAdminPanel(
      "👥 ユーザー管理",
      "<p>取得エラー：" + error.message + "</p>"
    );
  }
}
  async function showRecognition() {

  showAdminPanel(
    "🔍 AI認識結果",
    "<p>AI認識データを読み込んでいます...</p>"
  );

  try {

    const key = cfgKey();

    const r = await fetch(
      BASE + "/rest/v1/recognition_results?select=id,predicted_brand,predicted_product,predicted_brewery,confidence,processing_ms,model_name,created_at&order=created_at.desc&limit=50",
      {
        headers: {
          "apikey": key,
          "Authorization": "Bearer " + token
        }
      }
    );

    const text = await r.text();

    if (!r.ok) {
      throw new Error(text);
    }

    const items = JSON.parse(text);

    const rows = items.map(item => `
      <div style="
        padding:14px 0;
        border-bottom:1px solid #eee;
      ">
        <strong>
          ${item.predicted_brand || "銘柄不明"}
          ${item.predicted_product ? " " + item.predicted_product : ""}
        </strong><br>

        <span style="font-size:13px;color:#777">
          蔵元：${item.predicted_brewery || "未取得"}<br>
          信頼度：${item.confidence ?? "—"}<br>
          処理時間：${item.processing_ms ?? "—"} ms<br>
          モデル：${item.model_name || "—"}<br>
          日時：${item.created_at
            ? new Date(item.created_at).toLocaleString("ja-JP")
            : "—"}
        </span>
      </div>
    `).join("");

    showAdminPanel(
      "🔍 AI認識結果",
      rows || "<p>AI認識データはありません。</p>"
    );

  } catch (error) {

    console.error(error);

    showAdminPanel(
      "🔍 AI認識結果",
      "<p>取得エラー：" + error.message + "</p>"
    );
  }
}
async function showCorrections() {

  showAdminPanel(
    "✏️ 誤認識・修正データ",
    "<p>修正データを読み込んでいます...</p>"
  );

  try {

    const key = cfgKey();

    const r = await fetch(
      BASE + "/rest/v1/corrections?select=id,predicted_brand,predicted_product,correct_brand,correct_product,correct_brewery,reason,created_at&order=created_at.desc&limit=50",
      {
        headers: {
          "apikey": key,
          "Authorization": "Bearer " + token
        }
      }
    );

    const text = await r.text();

    if (!r.ok) {
      throw new Error(text);
    }

    const items = JSON.parse(text);

    const rows = items.map(item => `
      <div style="
        padding:14px 0;
        border-bottom:1px solid #eee;
      ">

        <div style="font-size:13px;color:#999;margin-bottom:6px;">
          AI判定
        </div>

        <strong>
          ${item.predicted_brand || "不明"}
          ${item.predicted_product ? " " + item.predicted_product : ""}
        </strong>

        <div style="
          margin:10px 0;
          font-size:20px;
        ">
          ↓
        </div>

        <div style="font-size:13px;color:#999;margin-bottom:6px;">
          正しい情報
        </div>

        <strong>
          ${item.correct_brand || "未設定"}
          ${item.correct_product ? " " + item.correct_product : ""}
        </strong><br>

        <span style="font-size:13px;color:#777">
          蔵元：${item.correct_brewery || "未設定"}<br>
          修正理由：${item.reason || "—"}<br>
          日時：${item.created_at
            ? new Date(item.created_at).toLocaleString("ja-JP")
            : "—"}
        </span>

      </div>
    `).join("");

    showAdminPanel(
      "✏️ 誤認識・修正データ",
      rows || "<p>修正データはありません。</p>"
    );

  } catch (error) {

    console.error(error);

    showAdminPanel(
      "✏️ 誤認識・修正データ",
      "<p>取得エラー：" + error.message + "</p>"
    );
  }
}
    async function showSakeMaster() {

  showAdminPanel(
    "🍶 日本酒マスター管理",
    "<p>日本酒マスターを読み込んでいます...</p>"
  );

  try {

    const key = cfgKey();

    const r = await fetch(
      BASE + "/rest/v1/sake_master?select=id,brand_name,product_name,brewery_name,prefecture,sake_type,rice,polishing_ratio,alcohol,verified,created_at&order=created_at.desc&limit=100",
      {

          "apikey": key,
          "Authorization": "Bearer " + token
        }
      }
    );

    const text = await r.text();

    if (!r.ok) {
      throw new Error(text);
    }

    const items = JSON.parse(text);

    const rows = items.map(item => `
      <div style="
        padding:14px 0;
        border-bottom:1px solid #eee;
      ">

        <strong style="font-size:17px;">
          ${item.brand_name || "銘柄未設定"}
          ${item.product_name ? " " + item.product_name : ""}
        </strong><br>

        <span style="font-size:13px;color:#777">

async function showDictionary() {

  showAdminPanel(
    "🧠 学習辞書管理",
    "<p>学習辞書を読み込んでいます...</p>"
  );

  try {

    const key = cfgKey();

    const r = await fetch(
      BASE + "/rest/v1/sake_dictionary_signatures?select=id,brand_name,product_name,brewery_name,prefecture,classification,rice_variety,polishing_ratio,alcohol,volume,confirmed_count,created_at&order=created_at.desc&limit=100",
      {
        headers: {
          "apikey": key,
          "Authorization": "Bearer " + token
        }
      }
    );

    const text = await r.text();

    if (!r.ok) {
      throw new Error(text);
    }

    const items = JSON.parse(text);

    const rows = items.map(item => `
  <div style="
    padding:14px 0;
    border-bottom:1px solid #eee;
  ">

    <strong style="font-size:17px;">
      ${item.brand_name || "銘柄未設定"}
      ${item.product_name ? " " + item.product_name : ""}
    </strong><br>

    <span style="font-size:13px;color:#777">
      蔵元：${item.brewery_name || "未設定"}<br>
      都道府県：${item.prefecture || "未設定"}<br>

      酒米：${item.rice_variety || "未設定"}<br>

        item.created_at
          ? new Date(item.created_at).toLocaleString("ja-JP")

      }
    </span>

    <br><br>
<button
  onclick="promoteToMaster('${item.id}')"
  style="
    padding:10px 14px;
    border:0;
    border-radius:10px;
    background:#292722;
    color:white;

    cursor:pointer;
  "

  🍶 日本酒マスターへ登録
</button>

<br><br>

<button

async function promoteToMaster(dictionaryId) {

  const ok = confirm(
    "この日本酒を日本酒マスターへ登録しますか？"
  );

  if (!ok) return;

  try {

    const key = cfgKey();

    const r = await fetch(
      BASE + "/rest/v1/rpc/admin_promote_dictionary_to_master",
      {
        method: "POST",
        headers: {
          "apikey": key,
          "Authorization": "Bearer " + token,
          "Content-Type": "application/json"
        },
        body: JSON.stringify({
          p_dictionary_id: dictionaryId
        })
      }
    );

    const text = await r.text();

    if (!r.ok) {
      throw new Error(text);
    }

    const result = JSON.parse(text);

    if (result.status === "duplicate") {
      alert("⚠️ すでに同じ銘柄・商品名が日本酒マスターにあります。");
      return;
    }

    if (result.status === "created") {
      alert("🍶 日本酒マスターへ登録しました！");
      await loadAdminDashboard();
      await showDictionary();
      return;
    }

    alert("処理結果：" + text);

  } catch (error) {

    console.error(error);

    alert(
      "マスター登録に失敗しました。\n\n" +
      error.message
    );
  }
}

let mergeTarget = null;

async function selectMergeTarget(id, brand, product) {

  if (!mergeTarget) {
    mergeTarget = { id, brand, product };

    alert(
      "1件目を選びました。\n\n" +
      brand + " " + product +
      "\n\n統合したいもう1件を押してください。"
    );

    return;
  }

  if (mergeTarget.id === id) {
    alert("同じデータは選べません。");
    return;
  }

  const same =
    mergeTarget.brand === brand &&
    mergeTarget.product === product;

  if (!same) {
    alert(
      "⚠️ 銘柄・商品名が一致しません。\n\n" +
      "統合を中止します。"
    );

    mergeTarget = null;
    return;
  }

  const ok = confirm(
    "この2件を1件に統合しますか？\n\n" +
    brand + " " + product
  );

  if (!ok) {
    mergeTarget = null;
    return;
  }

  try {

    const key = cfgKey();

    const r = await fetch(
      BASE + "/rest/v1/rpc/admin_merge_dictionary_duplicates",
      {
        method: "POST",
        headers: {
          "apikey": key,
          "Authorization": "Bearer " + token,
          "Content-Type": "application/json"
        },
        body: JSON.stringify({
          p_keep_id: mergeTarget.id,
          p_delete_id: id
        })
      }
    );

    const text = await r.text();

    if (!r.ok) {
      throw new Error(text);
    }

    const result = JSON.parse(text);

    alert(
      "🔗 統合しました！\n\n" +
      "確認回数：" + result.confirmed_count + "回"
    );

    mergeTarget = null;

    await loadAdminDashboard();
    await showDictionary();

  } catch (error) {

    console.error(error);

    alert(
      "統合に失敗しました。\n\n" +
      error.message
    );

    mergeTarget = null;
  }
}

async function loadDuplicateCount() {
  try {
    const key = cfgKey();

    const r = await fetch(
      BASE + "/rest/v1/rpc/admin_dictionary_duplicate_groups",
      {
        method: "POST",
        headers: {
          "apikey": key,
          "Authorization": "Bearer " + token,
          "Content-Type": "application/json"
        },
        body: "{}"
      }
    );

    const text = await r.text();

    if (!r.ok) {
      throw new Error(text);
    }

    const duplicates = JSON.parse(text);

    return duplicates.length;

  } catch (error) {
    console.error("重複候補取得エラー:", error);
    return null;
  }
}
    
    loadAdminDashboard();

loadDuplicateCount().then(count => {
  if (count !== null) {
    const el = document.getElementById("duplicates");
    if (el) el.textContent = count;
  }
});
    
</script>
</body>
</html>
