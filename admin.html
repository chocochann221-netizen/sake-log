<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>和酒ログ｜管理ダッシュボード</title>

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI",
        "Noto Sans JP", sans-serif;
      background: #f5f3ee;
      color: #292722;
    }

    header {
      background: #24211c;
      color: white;
      padding: 22px 18px;
    }

    header h1 {
      margin: 0;
      font-size: 22px;
    }

    header p {
      margin: 7px 0 0;
      color: #cfc9bd;
      font-size: 13px;
    }

    main {
      max-width: 900px;
      margin: auto;
      padding: 20px 16px 50px;
    }

    .status {
      background: #fff;
      border-radius: 14px;
      padding: 15px;
      margin-bottom: 18px;
      box-shadow: 0 2px 10px #0000000d;
    }

    .status-title {
      font-weight: bold;
    }

    .status-text {
      margin-top: 5px;
      color: #777;
      font-size: 13px;
    }

    .grid {
      display: grid;
      grid-template-columns: repeat(2, 1fr);
      gap: 12px;
    }

    .card {
      background: white;
      border-radius: 16px;
      padding: 18px;
      min-height: 125px;
      box-shadow: 0 2px 10px #0000000d;
    }

    .icon {
      font-size: 24px;
    }

    .label {
      margin-top: 10px;
      color: #777;
      font-size: 13px;
    }

    .number {
      margin-top: 4px;
      font-size: 29px;
      font-weight: 700;
    }

    h2 {
      margin-top: 30px;
      font-size: 18px;
    }

    .menu {
      background: white;
      border-radius: 16px;
      overflow: hidden;
      box-shadow: 0 2px 10px #0000000d;
    }

    .menu div {
      padding: 17px;
      border-bottom: 1px solid #eee;
    }

    .menu div:last-child {
      border-bottom: none;
    }

    footer {
      text-align: center;
      color: #999;
      font-size: 12px;
      margin-top: 35px;
    }

    @media (min-width: 700px) {
      .grid {
        grid-template-columns: repeat(4, 1fr);
      }
    }
  </style>
</head>

<body>

<header>
  <h1>🍶 和酒ログ 管理</h1>
  <p>Administration Dashboard</p>
</header>

<main>

  <div class="status">
    <div class="status-title">🔐 管理者モード</div>
    <div class="status-text">
      管理者認証を確認してデータを表示します
    </div>
  </div>

  <div class="grid">

    <div class="card">
      <div class="icon">👥</div>
      <div class="label">登録ユーザー</div>
      <div class="number" id="users">—</div>
    </div>

    <div class="card">
      <div class="icon">🍶</div>
      <div class="label">飲酒記録</div>
      <div class="number" id="drinking">—</div>
    </div>

    <div class="card">
      <div class="icon">📷</div>
      <div class="label">保存写真</div>
      <div class="number" id="photos">—</div>
    </div>

    <div class="card">
      <div class="icon">🔍</div>
      <div class="label">AI認識</div>
      <div class="number" id="recognition">—</div>
    </div>

    <div class="card">
      <div class="icon">✏️</div>
      <div class="label">認識修正</div>
      <div class="number" id="corrections">—</div>
    </div>

    <div class="card">
      <div class="icon">🧠</div>
      <div class="label">学習辞書</div>
      <div class="number" id="dictionary">—</div>
    </div>

    <div class="card">
      <div class="icon">📚</div>
      <div class="label">日本酒マスター</div>
      <div class="number" id="master">—</div>
    </div>

  </div>

  <h2>管理メニュー</h2>

  <div class="menu">
    <div>👥 ユーザー管理</div>
    <div>🔍 AI認識結果</div>
    <div>✏️ 誤認識・修正データ</div>
    <div>🍶 日本酒マスター管理</div>
    <div>🧠 学習辞書管理</div>
  </div>

  <footer>
    和酒ログ Administrator
  </footer>

</main>

</body>
</html>
