  async function loadAdminDashboard() {
    const statusText = document.querySelector(".status-text");
    const protectedContent = document.querySelectorAll(".grid, .menu, main > h2");
    protectedContent.forEach(el => el.style.display = "none");

    try {
      if (!token) {
        statusText.textContent =
          "ログイン情報がありません。和酒ログへログインしてください。";
        return;
      }

      const key = cfgKey();

      if (!key) {
        statusText.textContent =
          "Supabase接続情報が見つかりません。";
        return;
      }

      const userResponse = await fetch(BASE + "/auth/v1/user", {
        headers: {"apikey": key, "Authorization": "Bearer " + token}
      });
      if (!userResponse.ok) {
        localStorage.removeItem("sakelog_token");
        statusText.textContent = "ログインの有効期限が切れています。和酒ログから再ログインしてください。";
        return;
      }

      const adminResponse = await fetch(BASE + "/rest/v1/rpc/is_admin", {
        method: "POST",
        headers: {"apikey": key, "Authorization": "Bearer " + token, "Content-Type": "application/json"},
        body: "{}"
      });
      const isAdmin = adminResponse.ok && await adminResponse.json();
      if (!isAdmin) {
        statusText.textContent = "管理者権限がありません。";
        return;
      }
      protectedContent.forEach(el => el.style.display = "");

      const response = await fetch(
        BASE + "/rest/v1/rpc/admin_dashboard_stats",
        {
          method: "POST",
          headers: {
            "apikey": key,
            "Authorization": "Bearer " + token,
            "Content-Type": "application/json"
          },
          body: "{}"
        }
      );

      if (!response.ok) {
        const text = await response.text();
        throw new Error(text);
      }

      const data = await response.json();

      if (!data) {
        statusText.textContent =
          "管理者権限がありません。";
        return;
      }

const autoPromotionCount = await loadAutoPromotionCount();
const promotionReviewCount = await loadPromotionReviewCount();
const dataHealth = await loadDataHealth();
const masterCandidateCount = await loadSakeMasterCandidateCount();
      
      document.getElementById("users").textContent =
        data.users ?? 0;

      document.getElementById("drinking").textContent =
        data.drinking_records ?? 0;

        data.sake_photos ?? 0;

      document.getElementById("recognition").textContent =
        data.recognition_results ?? 0;

      document.getElementById("corrections").textContent =
        data.corrections ?? 0;

        data.sake_dictionary ?? 0;

document.getElementById("duplicates").textContent =
  await loadDuplicateCount() ?? "—";

document.getElementById("autoPromotion").textContent =

document.getElementById("dataHealth").textContent =

const masterCandidatesEl = document.getElementById("masterCandidates");
if (masterCandidatesEl) masterCandidatesEl.textContent = masterCandidateCount ?? "—";
      
      statusText.textContent =
        "管理者認証済み・Supabase接続中";
    } catch (error) {
  console.error(error);

  statusText.textContent =
         "管理データ取得エラー：" + error.message;
    }
  }
function showAdminPanel(title, html) {

    panel.style.cssText = `

}

function correctionFieldLabels(reason){
  const map={
    brand:"銘柄",product:"商品名",brewery:"蔵元",
    polishing:"精米歩合",alcohol:"度数",volume:"容量",
    prefecture:"都道府県",classification:"分類"
  };
  const raw=String(reason||"");
  if(!raw.startsWith("user_corrected:"))return [];
  return raw.slice("user_corrected:".length).split(",")
    .map(x=>x.trim()).filter(Boolean).map(x=>map[x]||x);
}



async function enqueueRecognitionImprovement(targetType, payload){
  try{
    const key=cfgKey();
    const r=await fetch(BASE+"/rest/v1/rpc/admin_enqueue_recognition_improvement",{
      method:"POST",
      headers:{
        "apikey":key,
        "Authorization":"Bearer "+token,
        "Content-Type":"application/json"
      },
      body:JSON.stringify({
        p_target_type:targetType,
        p_predicted_brand:payload.predictedBrand||null,
        p_predicted_product:payload.predictedProduct||null,
        p_correct_brand:payload.correctBrand,
        p_correct_product:payload.correctProduct||null,
        p_correct_brewery:payload.correctBrewery||null,
        p_occurrence_count:payload.count||1,
        p_correction_fields:payload.fields||[]
      })
    });
    const text=await r.text();
    if(!r.ok)throw new Error(text);
    alert(targetType==="dictionary"
      ?"🧠 辞書改善候補へ送りました。"
      :"🍶 マスター確認候補へ送りました。");
  }catch(error){
    console.error(error);
    alert("改善候補への登録に失敗しました。\n\n"+error.message);
  }
}


async function processRecognitionImprovement(queueId,action){
  const labels={
    apply_dictionary:"辞書へ反映",
    apply_master:"マスターへ反映",
    dismiss:"却下"
  };
  const note=prompt((labels[action]||"処理")+"のメモ（任意）","");
  if(note===null)return;
  const ok=confirm((labels[action]||"この処理")+"を実行しますか？");
  if(!ok)return;

  try{
    const key=cfgKey();
    const r=await fetch(BASE+"/rest/v1/rpc/admin_process_recognition_improvement",{
      method:"POST",
      headers:{
        "apikey":key,
        "Authorization":"Bearer "+token,
        "Content-Type":"application/json"
      },
      body:JSON.stringify({
        p_queue_id:queueId,
        p_action:action,
        p_review_note:note.trim()||null
      })
    });
    const text=await r.text();
    if(!r.ok)throw new Error(text);
    const result=JSON.parse(text);

    if(action==="apply_dictionary"){
      alert("🧠 辞書へ反映しました。更新："+(result.updated_rows||0)+"件");
    }else if(action==="apply_master"){
      alert("🍶 マスターへ反映しました。");
    }else{
      alert("候補を却下しました。");
    }
    await showRecognitionImprovementQueue();
  }catch(error){
    console.error(error);
    const msgText=String(error.message||error);
    if(/matching dictionary signature not found/i.test(msgText)){
      alert("対応する辞書データが見つかりませんでした。\nこの候補はマスター確認側で扱うか、元の辞書データを確認してください。");
    }else{
      alert("改善候補の処理に失敗しました。\n\n"+msgText);
    }
  }
}

async function showRecognitionImprovementCandidates(){
  showAdminPanel("🛠 要改善候補","<p>繰り返し起きている誤認識を探しています...</p>");
  try{
    const key=cfgKey();
    const r=await fetch(
      BASE+"/rest/v1/corrections?select=id,predicted_brand,predicted_product,correct_brand,correct_product,correct_brewery,reason,created_at&order=created_at.desc&limit=1000",
      {headers:{"apikey":key,"Authorization":"Bearer "+token}}
    );
    const text=await r.text();
    if(!r.ok)throw new Error(text);
    const items=JSON.parse(text);

    const groups={};
    for(const x of items){
      const reason=String(x.reason||"");
      if(!reason.startsWith("user_corrected:"))continue;

      const from=[x.predicted_brand,x.predicted_product].filter(Boolean).join(" ").trim()||"不明";
      const to=[x.correct_brand,x.correct_product].filter(Boolean).join(" ").trim()||"未設定";
      if(from===to)continue;

      const fields=correctionFieldLabels(reason);
      const keyName=from+"|||"+to;
      if(!groups[keyName])groups[keyName]={
        from,to,count:0,last:null,fields:{},brewery:x.correct_brewery||""
      };
      const g=groups[keyName];
      g.count++;
      const t=new Date(x.created_at).getTime();
      if(!g.last||t>g.last)g.last=t;
      fields.forEach(f=>g.fields[f]=(g.fields[f]||0)+1);
    }

    const scored=Object.values(groups).map(g=>{
      const daysSince=g.last?Math.max(0,(Date.now()-g.last)/86400000):999;
      const recency=daysSince<=7?2:daysSince<=30?1:0;
      const severity=g.count>=5?3:g.count>=3?2:g.count>=2?1:0;
      const fieldSpread=Object.keys(g.fields).length>=2?1:0;
      return {...g,score:severity+recency+fieldSpread,daysSince};
    }).filter(g=>g.count>=2)
      .sort((a,b)=>b.score-a.score||b.count-a.count||a.daysSince-b.daysSince);

    if(!scored.length){
      showAdminPanel(
        "🛠 要改善候補",

async function showCorrectionAnalytics(){
  showAdminPanel("📊 認識ズレ分析","<p>修正履歴を集計しています...</p>");
  try{
    const key=cfgKey();
    const r=await fetch(
      BASE+"/rest/v1/corrections?select=id,predicted_brand,predicted_product,correct_brand,correct_product,correct_brewery,reason,created_at&order=created_at.desc&limit=500",
      {headers:{"apikey":key,"Authorization":"Bearer "+token}}
    );
    const text=await r.text();
    if(!r.ok)throw new Error(text);
    const items=JSON.parse(text);

    const corrected=items.filter(x=>String(x.reason||"").startsWith("user_corrected:"));
    const legacy=items.filter(x=>!String(x.reason||"").startsWith("user_corrected:"));
    const fieldCounts={};
    corrected.forEach(x=>correctionFieldLabels(x.reason).forEach(k=>fieldCounts[k]=(fieldCounts[k]||0)+1));

    const pairCounts={};
    corrected.forEach(x=>{
      const from=[x.predicted_brand,x.predicted_product].filter(Boolean).join(" ")||"不明";
      const to=[x.correct_brand,x.correct_product].filter(Boolean).join(" ")||"未設定";
      if(from===to)return;
      const k=from+" → "+to;
      pairCounts[k]=(pairCounts[k]||0)+1;
    });

    const recent7=corrected.filter(x=>Date.now()-new Date(x.created_at).getTime()<=7*86400000).length;
    const recent30=corrected.filter(x=>Date.now()-new Date(x.created_at).getTime()<=30*86400000).length;

    const fields=Object.entries(fieldCounts).sort((a,b)=>b[1]-a[1]);
    const maxField=fields[0]?.[1]||1;
    const pairs=Object.entries(pairCounts).sort((a,b)=>b[1]-a[1]).slice(0,10);

    const summary=`
      <div style="display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px;margin-bottom:18px">
        <div style="background:#f7f5ef;border-radius:12px;padding:14px"><div style="font-size:12px;color:#777">項目付き修正</div><strong style="font-size:25px">${corrected.length}</strong></div>
        <div style="background:#f7f5ef;border-radius:12px;padding:14px"><div style="font-size:12px;color:#777">直近7日</div><strong style="font-size:25px">${recent7}</strong></div>
        <div style="background:#f7f5ef;border-radius:12px;padding:14px"><div style="font-size:12px;color:#777">直近30日</div><strong style="font-size:25px">${recent30}</strong></div>
        <div style="background:#f7f5ef;border-radius:12px;padding:14px"><div style="font-size:12px;color:#777">旧形式の修正履歴</div><strong style="font-size:25px">${legacy.length}</strong></div>
      </div>`;

    const fieldHtml=fields.length?fields.map(([name,n])=>`
      <div style="margin:12px 0">
        <div style="display:flex;justify-content:space-between;font-size:13px"><b>${esc(name)}</b><span>${n}件</span></div>
        <div style="height:8px;background:#eee;border-radius:999px;margin-top:5px;overflow:hidden">
          <div style="height:100%;width:${Math.max(4,Math.round(n/maxField*100))}%;background:#8a6b3d"></div>
        </div>
      </div>`).join(""):"<p style='color:#777'>項目別データはこれから蓄積されます。</p>";

    const pairHtml=pairs.length?pairs.map(([name,n])=>`
      <div style="padding:10px 0;border-bottom:1px solid #eee">
        <strong>${esc(name)}</strong><br><span style="font-size:12px;color:#777">${n}件</span>
      </div>`).join(""):"<p style='color:#777'>繰り返し発生している銘柄違いはまだありません。</p>";

    showAdminPanel("📊 認識ズレ分析",
      summary+
      "<h3 style='margin-top:22px'>どの項目が外れやすい？</h3>"+fieldHtml+
      "<h3 style='margin-top:26px'>繰り返し起きている認識違い</h3>"+pairHtml+
      "<p style='font-size:12px;color:#888;margin-top:18px'>※ 保存時にユーザーがラベル読取結果から大きく修正した項目を集計しています。過去の旧形式データは総数には残りますが、項目別集計には含めません。</p>"
    );
  }catch(error){
    console.error(error);
    showAdminPanel("📊 認識ズレ分析","<p>取得エラー："+esc(error.message)+"</p>");
  }
}

async function promoteToMaster(dictionaryId) {

  const ok = confirm(
    "この日本酒を日本酒マスターへ登録しますか？"
  );

  if (!ok) return;

  try {

    const key = cfgKey();

    const r = await fetch(
      BASE + "/rest/v1/rpc/admin_promote_dictionary_to_master",
      {
        method: "POST",
        headers: {
          "apikey": key,
          "Authorization": "Bearer " + token,
          "Content-Type": "application/json"
        },
        body: JSON.stringify({
          p_dictionary_id: dictionaryId
        })
      }
    );

    const text = await r.text();

    if (!r.ok) {
      throw new Error(text);
    }

    const result = JSON.parse(text);

    if (result.status === "duplicate") {
      alert("⚠️ すでに同じ銘柄・商品名が日本酒マスターにあります。");
      return;
    }

    if (result.status === "created") {
      alert("🍶 日本酒マスターへ登録しました！");
      await loadAdminDashboard();
      await showDictionary();
      return;
    }

    alert("処理結果：" + text);

  } catch (error) {

    console.error(error);

    alert(
      "マスター登録に失敗しました。\n\n" +
      error.message
    );
  }
}

let mergeTarget = null;

async function selectMergeTarget(id, brand, product) {

  if (!mergeTarget) {
    mergeTarget = { id, brand, product };

    alert(
      "1件目を選びました。\n\n" +
      brand + " " + product +
      "\n\n統合したいもう1件を押してください。"
    );

    return;
  }

  if (mergeTarget.id === id) {
    alert("同じデータは選べません。");
    return;
  }

  const same =
    mergeTarget.brand === brand &&
    mergeTarget.product === product;

  if (!same) {
    alert(
      "⚠️ 銘柄・商品名が一致しません。\n\n" +
      "統合を中止します。"
    );

    mergeTarget = null;
    return;
  }

  const ok = confirm(
    "この2件を1件に統合しますか？\n\n" +
    brand + " " + product
  );

  if (!ok) {
    mergeTarget = null;
    return;
  }

  try {

    const key = cfgKey();

    const r = await fetch(
      BASE + "/rest/v1/rpc/admin_merge_dictionary_duplicates",
      {
        method: "POST",
        headers: {
          "apikey": key,
          "Authorization": "Bearer " + token,
          "Content-Type": "application/json"
        },
        body: JSON.stringify({
          p_keep_id: mergeTarget.id,
          p_delete_id: id
        })
      }
    );

    const text = await r.text();

    if (!r.ok) {
      throw new Error(text);
    }

    const result = JSON.parse(text);

    alert(
      "🔗 統合しました！\n\n" +
      "確認回数：" + result.confirmed_count + "回"
    );

    mergeTarget = null;

    await loadAdminDashboard();
    await showDictionary();

  } catch (error) {

    console.error(error);

    alert(
      "統合に失敗しました。\n\n" +
      error.message
    );

    mergeTarget = null;
  }
}

async function adminSignedEventPhotoUrl(path){
  if(!path)return null;
  try{
    const r=await fetch(
      BASE + "/storage/v1/object/sign/event-photos/" + encodeURI(path),
      {
        method:"POST",
        headers:{
          "apikey":cfgKey(),
          "Authorization":"Bearer " + token,
          "Content-Type":"application/json"
        },
        body:JSON.stringify({expiresIn:1800})
      }
    );
    if(!r.ok) throw new Error(await r.text());
    const d=await r.json();
    const signed=d.signedURL||d.signedUrl||d.signed_url;
    return signed ? (/^https?:\/\//i.test(signed)?signed:BASE+"/storage/v1"+signed) : null;
  }catch(error){
    console.error("イベント写真URL取得エラー:",error);
    return null;
  }
}

async function adminUnpublishEventPhoto(photoId){
  if(!confirm("この写真を一般公開から外しますか？\n写真自体は参加者内に残します。"))return;
  try{
    const r=await fetch(BASE+"/rest/v1/rpc/admin_unpublish_event_photo",{
      method:"POST",
      headers:{"apikey":cfgKey(),"Authorization":"Bearer "+token,"Content-Type":"application/json"},
      body:JSON.stringify({p_photo_id:photoId})
    });
    if(!r.ok)throw new Error(await r.text());
    await showEventPhotoModeration();
  }catch(e){alert("非公開化に失敗しました。\n\n"+e.message)}
}

async function adminDeleteEventPhoto(photoId){
  if(!confirm("この写真を完全に削除しますか？\nこの操作は元に戻せません。"))return;
  try{
    const meta=await fetch(
      BASE+"/rest/v1/event_photos?select=storage_path&id=eq."+encodeURIComponent(photoId)+"&limit=1",
      {headers:{"apikey":cfgKey(),"Authorization":"Bearer "+token}}
    );
    if(!meta.ok)throw new Error(await meta.text());
    const rows=await meta.json();
    const path=rows?.[0]?.storage_path;
    if(!path)throw new Error("写真ファイルの場所を取得できませんでした");

    const d=await fetch(BASE+"/storage/v1/object/event-photos/"+encodeURI(path),{
      method:"DELETE",
      headers:{"apikey":cfgKey(),"Authorization":"Bearer "+token}
    });
    if(!d.ok && d.status!==404)throw new Error("Storage削除に失敗しました: "+await d.text());

    const r=await fetch(BASE+"/rest/v1/rpc/admin_delete_event_photo_record",{
      method:"POST",
      headers:{"apikey":cfgKey(),"Authorization":"Bearer "+token,"Content-Type":"application/json"},
      body:JSON.stringify({p_photo_id:photoId})
    });
    if(!r.ok)throw new Error(await r.text());

    await showEventPhotoModeration();
  }catch(e){alert("削除に失敗しました。\n\n"+e.message)}
}

async function showEventPhotoModeration(){
  showAdminPanel("📷 イベント写真の公開確認","<p>確認待ちの写真を読み込んでいます...</p>");
  try{
    const r=await fetch(
      BASE + "/rest/v1/event_photos?select=id,event_id,user_id,storage_path,caption,moderation_status,face_review_status,is_public,audience,created_at,deletion_requested_at,deletion_request_reason&or=(moderation_status.in.(pending,hold),deletion_requested_at.not.is.null)&order=created_at.asc&limit=100",
      {
        headers:{
          "apikey":cfgKey(),
          "Authorization":"Bearer " + token
        }
      }
    );
    if(!r.ok) throw new Error(await r.text());
    const items=await r.json();

    if(!items.length){
      showAdminPanel("📷 イベント写真の公開確認","<p>現在、確認待ちの写真はありません ✅</p>");
      return;
    }

    const blocks=[];
    for(const item of items){
      const url=await adminSignedEventPhotoUrl(item.storage_path);
      const face=item.face_review_status||"not_checked";
      const publicReady=["no_face","processed"].includes(face);

      blocks.push(`
        <div style="padding:16px 0;border-bottom:1px solid #eee;">
          ${url?`<img src="${esc(url)}" alt="イベント写真" style="width:100%;max-width:360px;max-height:280px;object-fit:contain;border-radius:12px;background:#f5f5f5">`:"<div>画像を表示できません</div>"}
          <div style="font-size:13px;line-height:1.7;margin-top:8px;color:#666">
            コメント：${esc(item.caption||"なし")}<br>
            公開状態：${esc(item.moderation_status)} ／ 顔確認：${esc(face)}<br>
            現在：${item.is_public?"一般公開":"一般非公開"} ／ ${esc(item.audience||"event_members")}
            ${item.deletion_requested_at?`<br><b style="color:#a22">⚠ 削除依頼あり</b>${item.deletion_request_reason?"："+esc(item.deletion_request_reason):""}`:""}
          </div>
          <div style="margin-top:10px;display:flex;gap:8px;flex-wrap:wrap;">
            <button onclick="moderateEventPhoto('${item.id}','mark_no_face')" style="padding:9px 11px;border:1px solid #aaa;border-radius:9px;background:white;cursor:pointer">🙂 顔なし確認</button>
            <button onclick="moderateEventPhoto('${item.id}','mark_face_detected')" style="padding:9px 11px;border:1px solid #aaa;border-radius:9px;background:white;cursor:pointer">👤 顔あり</button>
            <button onclick="moderateEventPhoto('${item.id}','mark_processed')" style="padding:9px 11px;border:1px solid #aaa;border-radius:9px;background:white;cursor:pointer">🛡 顔処理済み</button>
          </div>
          <div style="margin-top:8px;display:flex;gap:8px;flex-wrap:wrap;">
            <button
              onclick="${publicReady?`moderateEventPhoto('${item.id}','approve_public','${face}')`:`alert('一般公開するには「顔なし確認」または「顔処理済み」が必要です。')`}"
              style="padding:10px 12px;border:0;border-radius:9px;background:${publicReady?"#2f6f52":"#aaa"};color:white;cursor:pointer"
            >🌐 一般公開を承認</button>
            <button onclick="moderateEventPhoto('${item.id}','keep_members','${face}')" style="padding:10px 12px;border:0;border-radius:9px;background:#6c5d4c;color:white;cursor:pointer">👥 参加者内のみ承認</button>
            <button onclick="moderateEventPhoto('${item.id}','hold','${face}')" style="padding:10px 12px;border:1px solid #c9a66b;border-radius:9px;background:white;cursor:pointer">⏸ 保留</button>
            <button onclick="moderateEventPhoto('${item.id}','reject','${face}')" style="padding:10px 12px;border:1px solid #c66;border-radius:9px;background:white;color:#a22;cursor:pointer">✖ 非承認</button>
            ${item.is_public?`<button onclick="adminUnpublishEventPhoto('${item.id}')" style="padding:10px 12px;border:1px solid #777;border-radius:9px;background:white;cursor:pointer">🔒 公開を取り下げる</button>`:""}
            ${item.deletion_requested_at?`<button onclick="adminDeleteEventPhoto('${item.id}')" style="padding:10px 12px;border:1px solid #a22;border-radius:9px;background:#fff;color:#a22;cursor:pointer">🗑 削除依頼を処理</button>`:""}
          </div>
        </div>
      `);
    }

    showAdminPanel(
      "📷 イベント写真の公開確認",
      "<p style='font-size:13px;color:#666'>一般公開は、顔なし確認または顔処理済みの写真だけ許可されます。</p>"+blocks.join("")
    );
  }catch(error){
    console.error(error);
    showAdminPanel("📷 イベント写真の公開確認","<p>取得エラー："+esc(error.message)+"</p>");
  }
}

async function loadSakeMasterCandidateCount() {
  try {
    const r = await fetch(
      BASE + "/rest/v1/sake_master_candidates?select=id&candidate_status=eq.pending",
      {
        headers: {
          "apikey": cfgKey(),
          "Authorization": "Bearer " + token,
          "Prefer": "count=exact"
        }
      }
    );
    if (!r.ok) throw new Error(await r.text());
    const range = r.headers.get("content-range") || "";
    const total = range.includes("/") ? Number(range.split("/").pop()) : (await r.json()).length;
    return Number.isFinite(total) ? total : null;
  } catch (error) {
    console.error("商品マスター候補件数取得エラー:", error);
    return null;
  }
}

async function showSakeMasterCandidates() {
  showAdminPanel(
    "🌱 商品マスター候補",
    "<p>候補を読み込んでいます...</p>"
  );

  try {
    const r = await fetch(
      BASE + "/rest/v1/sake_master_candidates?select=id,event_id,brand_name,product_name,brewery_name,source_url,source_name,source_type,candidate_status,review_note,created_at&candidate_status=in.(pending,needs_research)&order=brewery_name.asc,created_at.asc&limit=200",
      {
        headers: {
          "apikey": cfgKey(),
          "Authorization": "Bearer " + token
        }
      }
    );
    if (!r.ok) throw new Error(await r.text());

    const items = await r.json();

    if (!items.length) {
      showAdminPanel(
        "🌱 商品マスター候補",
        "<p>現在、確認待ちの候補はありません ✅</p>"
      );
      return;
    }

    const breweryGroups = {};
    items.forEach(item => {
      const key = item.brewery_name || "蔵元未設定";
      if (!breweryGroups[key]) breweryGroups[key] = {
        brewery_name: key,
        event_id: item.event_id,
        source_url: item.source_url,
        count: 0
      };
      breweryGroups[key].count += 1;
    });

    const groupButtons = Object.values(breweryGroups).map(group => `
      <div style="padding:12px 0;border-bottom:1px solid #eee;">
        <strong>${esc(group.brewery_name)}</strong>
        <span style="font-size:13px;color:#777;"> ／ ${group.count}件</span><br>
        <button
          onclick='promoteCandidateBrewery(${JSON.stringify(group.event_id)}, ${JSON.stringify(group.brewery_name)}, ${JSON.stringify(group.source_url || "")}, ${group.count})'
          style="margin-top:8px;padding:9px 12px;border:0;border-radius:10px;background:#5b4737;color:white;font-size:13px;cursor:pointer;"
        >🏭 この蔵を公式確認して一括昇格</button>
      </div>
    `).join("");

    const rows = items.map(item => {
      const sourceLink = /^https?:\/\//i.test(item.source_url || "")
        ? `<a href="${esc(item.source_url)}" target="_blank" rel="noopener noreferrer" style="font-size:13px;">公式情報を確認 ↗</a>`
        : "<span style=\"font-size:13px;color:#999\">公式URL未登録</span>";

      return `
        <div style="padding:16px 0;border-bottom:1px solid #eee;">
          <strong style="font-size:17px;">
            ${esc(item.brand_name || "銘柄未設定")}
            ${item.product_name ? " " + esc(item.product_name) : ""}
          </strong><br>
          <span style="font-size:13px;color:#777;line-height:1.7">
            蔵元：${esc(item.brewery_name || "未設定")}<br>
            情報源：${esc(item.source_name || item.source_type || "未設定")}<br>
            状態：${esc(item.candidate_status || "pending")}
          </span>
          <div style="margin-top:8px;">${sourceLink}</div>
          <div style="display:flex;gap:8px;flex-wrap:wrap;margin-top:10px;">
            <button
              onclick="promoteMasterCandidate('${item.id}')"
              style="padding:10px 14px;border:0;border-radius:10px;background:#292722;color:white;font-size:14px;cursor:pointer;"
            >✅ 公式確認済み・masterへ昇格</button>
            <button
              onclick="markMasterCandidateResearch('${item.id}')"
              style="padding:10px 14px;border:1px solid #aaa;border-radius:10px;background:white;color:#292722;font-size:14px;cursor:pointer;"
            >🔎 要調査にする</button>
          </div>
        </div>
      `;
    }).join("");

    showAdminPanel(
      "🌱 商品マスター候補",
      `<p style="font-size:13px;color:#777">公式情報を確認してから昇格してください。曖昧一致では自動登録しません。</p>
      <div style="margin:12px 0 20px;padding:14px;background:#f7f3ec;border-radius:12px;">
        <b>蔵単位でまとめて確認</b>
        <div style="font-size:12px;color:#777;margin:4px 0 8px;">公式イベントページで1蔵分をまとめて確認できた場合だけ使います。</div>
        ${groupButtons}
      </div>${rows}`
    );
  } catch (error) {
    console.error(error);
    showAdminPanel(
      "🌱 商品マスター候補",
      "<p>取得エラー：" + esc(error.message) + "</p>"
    );
  }
}


async function promoteCandidateBrewery(eventId, breweryName, sourceUrl, count) {
  const openSource = /^https?:\/\//i.test(sourceUrl || "");
  if (openSource) window.open(sourceUrl, "_blank", "noopener,noreferrer");

  const ok = confirm(
    breweryName + " の候補 " + count + "件を一括で昇格します。\n\n" +
    "公式イベント情報で、この蔵の掲載商品をまとめて確認済みの場合だけ続けてください。"
  );
  if (!ok) return;

  try {
    const r = await fetch(
      BASE + "/rest/v1/rpc/promote_sake_candidates_by_brewery",
      {
        method: "POST",
        headers: {
          "apikey": cfgKey(),
          "Authorization": "Bearer " + token,
          "Content-Type": "application/json"
        },
        body: JSON.stringify({
          p_event_id: eventId,
          p_brewery_name: breweryName,
          p_review_note: "管理画面で公式イベント情報を蔵単位確認して一括昇格"
        })
      }
    );
    if (!r.ok) throw new Error(await r.text());
    const payload = await r.json();
    const result = Array.isArray(payload) ? payload[0] : payload;

    alert(
      "一括昇格が完了しました。\n\n" +
      "処理：" + (result?.processed ?? 0) + "件\n" +
      "新規master：" + (result?.created_master ?? 0) + "件\n" +
      "既存masterへ接続：" + (result?.matched_existing ?? 0) + "件\n" +
      "保留：" + (result?.skipped ?? 0) + "件"
    );

    await loadAdminDashboard();
    await showSakeMasterCandidates();
  } catch (error) {
    console.error(error);
    alert("一括昇格に失敗しました。\n\n" + error.message);
  }
}

async function promoteMasterCandidate(candidateId) {
  const ok = confirm(
    "公式情報で、銘柄・商品名・蔵元を確認しましたか？\n\n確認済みなら正式masterへ昇格します。"
  );
  if (!ok) return;

  try {
    const r = await fetch(
      BASE + "/rest/v1/rpc/promote_sake_master_candidate",
      {
        method: "POST",
        headers: {
          "apikey": cfgKey(),
          "Authorization": "Bearer " + token,
          "Content-Type": "application/json"
        },
        body: JSON.stringify({
          p_candidate_id: candidateId,
          p_review_note: "管理画面で公式情報を確認して昇格"
        })
      }
    );
    if (!r.ok) throw new Error(await r.text());

    const payload = await r.json();
    const result = Array.isArray(payload) ? payload[0] : payload;

    if (result?.action === "matched_existing") {
      alert("🔗 既存の日本酒masterへ紐付けました。");
    } else if (result?.action === "created_master") {
      alert("🍶 正式な日本酒masterへ昇格しました！");
    } else {
      alert("処理完了：" + (result?.action || "OK"));
    }

    await loadAdminDashboard();
    await showSakeMasterCandidates();
  } catch (error) {
    console.error(error);
    alert("昇格に失敗しました。\n\n" + error.message);
  }
}

async function markMasterCandidateResearch(candidateId) {
  try {
    const r = await fetch(
      BASE + "/rest/v1/sake_master_candidates?id=eq." + encodeURIComponent(candidateId),
      {
        method: "PATCH",
        headers: {
          "apikey": cfgKey(),
          "Authorization": "Bearer " + token,
          "Content-Type": "application/json",
          "Prefer": "return=minimal"
        },
        body: JSON.stringify({
          candidate_status: "needs_research",
          review_note: "公式情報の追加確認が必要"
        })
      }
    );
    if (!r.ok) throw new Error(await r.text());
    await loadAdminDashboard();
    await showSakeMasterCandidates();
  } catch (error) {
    console.error(error);
    alert("状態更新に失敗しました。\n\n" + error.message);
  }
}

async function runAutoPromotion() {
  const ok = confirm("安全条件を満たした候補を1件、日本酒マスターへ自動昇格しますか？");
  if (!ok) return;

  try {
    const key = cfgKey();

    const r = await fetch(
      BASE + "/rest/v1/rpc/admin_run_auto_promotion",
      {
        method: "POST",
        headers: {
          "apikey": key,
          "Authorization": "Bearer " + token,
          "Content-Type": "application/json"
        },
        body: "{}"
      }
    );

    const text = await r.text();

    if (!r.ok) {
      throw new Error(text);
    }

    const result = JSON.parse(text);

    if (result.status === "no_candidate") {
      alert("🤖 自動昇格候補はありません");
    } else if (result.status === "created") {
      alert(
        "🍶 日本酒マスターへ自動昇格しました！\n\n" +
        result.brand_name + "\n" +
        result.product_name + "\n" +
        "確認回数：" + result.confirmed_count + "回"
      );
    } else if (result.status === "duplicate") {
      alert("⚠️ すでに日本酒マスターへ登録されています");
    } else {
      alert("自動昇格処理が完了しました");
    }

    await loadAdminDashboard();

  } catch (error) {
    console.error(error);

    alert(
      "自動昇格に失敗しました。\n\n" +
      error.message
    );
  }
}
