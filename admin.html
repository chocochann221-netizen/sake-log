<!DOCTYPE html>
<html lang="ja">
<head>

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI",
        "Noto Sans JP", sans-serif;
      background: #f5f3ee;
      color: #292722;
    }

    header {
      background: #24211c;
      color: white;
      padding: 22px 18px;
    }

    header h1 {
      margin: 0;
      font-size: 22px;
    }

    header p {
      margin: 7px 0 0;
      color: #cfc9bd;
      font-size: 13px;
    }

    main {
      max-width: 900px;
      margin: auto;
      padding: 20px 16px 50px;
    }

    .status {
      background: #fff;
      border-radius: 14px;
      padding: 15px;
      margin-bottom: 18px;
      box-shadow: 0 2px 10px #0000000d;
    }

    .status-title {
      font-weight: bold;
    }

    .status-text {
      margin-top: 5px;
      color: #777;
      font-size: 13px;
    }

    .grid {
      display: grid;
      grid-template-columns: repeat(2, 1fr);
      gap: 12px;
    }

    .card {
      background: white;
      border-radius: 16px;
      padding: 18px;
      min-height: 125px;
      box-shadow: 0 2px 10px #0000000d;
    }

    .icon {
      font-size: 24px;
    }

    .label {
      margin-top: 10px;
      color: #777;
      font-size: 13px;
    }

    .number {
      margin-top: 4px;
      font-size: 29px;
      font-weight: 700;
    }

    h2 {
      margin-top: 30px;
      font-size: 18px;
    }

    .menu {
      background: white;
      border-radius: 16px;
      overflow: hidden;
      box-shadow: 0 2px 10px #0000000d;
    }

    .menu-item {
  width: 100%;
  display: block;
  padding: 17px;
  border: 0;
  border-bottom: 1px solid #eee;
  background: white;
  color: #292722;
  text-align: left;
  font: inherit;
  font-size: 16px;
  cursor: pointer;
}

.menu-item:last-child {
  border-bottom: none;
}

.menu-item:active {
  background: #f5f3ee;
}

    footer {
      text-align: center;
      color: #999;
      font-size: 12px;
      margin-top: 35px;
    }

    @media (min-width: 700px) {
      .grid {
        grid-template-columns: repeat(4, 1fr);
      }
    }
  </style>
</head>

<body>

  <script>
  const BASE = "https://mtshsijgfmottgkbgnir.supabase.co";
  const PUBLISHABLE_KEY = "sb_publishable_iN9jbt45ga1sPbzt5aw-0w_iWs8eWW-";

  const cfgKey = () =>
  localStorage.getItem("sakelog_pubkey") || PUBLISHABLE_KEY;

  const token =
    localStorage.getItem("sakelog_token") ||
    localStorage.getItem("sakelog_access_token");

  async function loadAdminDashboard() {
    const statusText = document.querySelector(".status-text");
    const protectedContent = document.querySelectorAll(".grid, .menu, main > h2");
    protectedContent.forEach(el => el.style.display = "none");

    try {
      if (!token) {
        statusText.textContent =
          "ログイン情報がありません。和酒ログへログインしてください。";
        return;
      }

      const key = cfgKey();

      if (!key) {
        statusText.textContent =
          "Supabase接続情報が見つかりません。";
        return;
      }

      const userResponse = await fetch(BASE + "/auth/v1/user", {
        headers: {"apikey": key, "Authorization": "Bearer " + token}
      });
      if (!userResponse.ok) {
        localStorage.removeItem("sakelog_token");
        statusText.textContent = "ログインの有効期限が切れています。和酒ログから再ログインしてください。";
        return;
      }

      const adminResponse = await fetch(BASE + "/rest/v1/rpc/is_admin", {
        method: "POST",
        headers: {"apikey": key, "Authorization": "Bearer " + token, "Content-Type": "application/json"},
        body: "{}"
      });
      const isAdmin = adminResponse.ok && await adminResponse.json();
      if (!isAdmin) {
        statusText.textContent = "管理者権限がありません。";
        return;
      }
      protectedContent.forEach(el => el.style.display = "");

      const response = await fetch(
        BASE + "/rest/v1/rpc/admin_dashboard_stats",
        {
          method: "POST",
          headers: {
            "apikey": key,
            "Authorization": "Bearer " + token,
            "Content-Type": "application/json"
          },
          body: "{}"
        }
      );

      if (!response.ok) {
        const text = await response.text();
        throw new Error(text);
      }

      const data = await response.json();

      if (!data) {
        statusText.textContent =
          "管理者権限がありません。";
        return;
      }

const autoPromotionCount = await loadAutoPromotionCount();
const unlinkedResponse = await fetch(
  BASE + "/rest/v1/drinking_records?select=id&sake_id=is.null",
  {
    headers: {
      "apikey": key,
      "Authorization": "Bearer " + token,
      "Prefer": "count=exact"
    }
  }
);
const unlinkedRange = unlinkedResponse.headers.get("content-range");
const unlinkedCount = unlinkedResponse.ok
  ? (unlinkedRange && unlinkedRange.includes("/") ? Number(unlinkedRange.split("/")[1]) || 0 : (await unlinkedResponse.json()).length)
  : null;
      
      document.getElementById("users").textContent =
        data.users ?? 0;

      document.getElementById("drinking").textContent =
        data.drinking_records ?? 0;

      document.getElementById("photos").textContent =
        data.sake_photos ?? 0;

      document.getElementById("recognition").textContent =
        data.recognition_results ?? 0;

      document.getElementById("corrections").textContent =
        data.corrections ?? 0;

      document.getElementById("dictionary").textContent =
        data.sake_dictionary ?? 0;

      document.getElementById("master").textContent =
        data.sake_master ?? 0;

document.getElementById("duplicates").textContent =
  await loadDuplicateCount() ?? "—";

document.getElementById("autoPromotion").textContent =
  autoPromotionCount ?? "—";

document.getElementById("unlinked").textContent =
  unlinkedCount ?? "—";
const unlinkedCard = document.getElementById("unlinkedCard");
const unlinkedHint = document.getElementById("unlinkedHint");
if(unlinkedCount === 0){
  unlinkedCard.style.background = "#eef6f1";
  unlinkedHint.textContent = "接続状態は正常です";
  unlinkedHint.style.color = "#2f6a4f";
}else if(unlinkedCount > 0){
  unlinkedCard.style.background = "#fff4df";
  unlinkedCard.style.boxShadow = "0 0 0 2px #e0b66055";
  unlinkedHint.textContent = "確認が必要です";
  unlinkedHint.style.color = "#8a641d";
}else{
  unlinkedCard.style.background = "white";
  unlinkedHint.textContent = "状態を取得できませんでした";
}
      
      statusText.textContent =
        "管理者認証済み・Supabase接続中";
    } catch (error) {
  console.error(error);

  statusText.textContent =
         "管理データ取得エラー：" + error.message;
    }
  }
function showAdminPanel(title, html) {
  let panel = document.getElementById("adminDetailPanel");

  if (!panel) {
    panel = document.createElement("div");
    panel.id = "adminDetailPanel";
    panel.style.cssText = `
      margin-top:20px;
      background:white;
      border-radius:16px;
      padding:18px;
      box-shadow:0 2px 10px #0000000d;
    `;

    const menu = document.querySelector(".menu");
    menu.insertAdjacentElement("afterend", panel);
  }

  panel.innerHTML = `
    <h2 style="margin-top:0">${title}</h2>
    ${html}
  `;

  panel.scrollIntoView({
    behavior: "smooth",
    block: "start"
  });
}


async function showUsers() {

  showAdminPanel(
    "👥 ユーザー管理",
    "<p>ユーザーデータを読み込んでいます...</p>"
  );

  try {

    const key = cfgKey();

    const r = await fetch(
      BASE + "/rest/v1/rpc/admin_list_users",
      {
        method: "POST",
        headers: {
          "apikey": key,
          "Authorization": "Bearer " + token,
          "Content-Type": "application/json"
        },
        body: "{}"
      }
    );

    const text = await r.text();

    if (!r.ok) {
      throw new Error(text);
    }

    const users = JSON.parse(text);

    const rows = users.map(user => `
      <div style="
        padding:14px 0;
        border-bottom:1px solid #eee;
      ">
        <strong>${user.display_name || "名前未設定"}</strong><br>
        <span style="font-size:13px;color:#777">
          ${user.email || ""}<br>
          権限：${user.role || "user"}
          ／ プラン：${user.plan || "free"}
          ／ 記録：${user.record_count ?? 0}件
        </span>
      </div>
    `).join("");

    showAdminPanel(
      "👥 ユーザー管理",
      rows || "<p>ユーザーはいません。</p>"
    );

  } catch (error) {

    console.error(error);

    showAdminPanel(
      "👥 ユーザー管理",
      "<p>取得エラー：" + error.message + "</p>"
    );
  }
}

async function promoteToMaster(dictionaryId) {

  const ok = confirm(
    "この日本酒を日本酒マスターへ登録しますか？"
  );

  if (!ok) return;

  try {

    const key = cfgKey();

    const r = await fetch(
      BASE + "/rest/v1/rpc/admin_promote_dictionary_to_master",
      {
        method: "POST",
        headers: {
          "apikey": key,
          "Authorization": "Bearer " + token,
          "Content-Type": "application/json"
        },
        body: JSON.stringify({
          p_dictionary_id: dictionaryId
        })
      }
    );

    const text = await r.text();

    if (!r.ok) {
      throw new Error(text);
    }

    const result = JSON.parse(text);

    if (result.status === "duplicate") {
      alert("⚠️ すでに同じ銘柄・商品名が日本酒マスターにあります。");
      return;
    }

    if (result.status === "created") {
      alert("🍶 日本酒マスターへ登録しました！");

    }

let mergeTarget = null;

async function selectMergeTarget(id, brand, product) {

  if (!mergeTarget) {
    mergeTarget = { id, brand, product };

    alert(
      "1件目を選びました。\n\n" +
      brand + " " + product +
      "\n\n統合したいもう1件を押してください。"
    );

    return;
  }

  if (mergeTarget.id === id) {
    alert("同じデータは選べません。");
    return;
  }

  const same =
    mergeTarget.brand === brand &&
    mergeTarget.product === product;

  if (!same) {
    alert(
      "⚠️ 銘柄・商品名が一致しません。\n\n" +
      "統合を中止します。"
    );

    mergeTarget = null;
    return;
  }

  const ok = confirm(
    "この2件を1件に統合しますか？\n\n" +
    brand + " " + product
  );

  if (!ok) {
    mergeTarget = null;
    return;
  }

  try {

    const key = cfgKey();

    const r = await fetch(
      BASE + "/rest/v1/rpc/admin_merge_dictionary_duplicates",
      {
        method: "POST",
        headers: {
          "apikey": key,
          "Authorization": "Bearer " + token,
          "Content-Type": "application/json"
        },
        body: JSON.stringify({
          p_keep_id: mergeTarget.id,
          p_delete_id: id
        })
      }
    );

    const text = await r.text();

    if (!r.ok) {
      throw new Error(text);
    }

    const result = JSON.parse(text);

    alert(
      "🔗 統合しました！\n\n" +
      "確認回数：" + result.confirmed_count + "回"
    );

    mergeTarget = null;

    await loadAdminDashboard();
    await showDictionary();

  } catch (error) {

    console.error(error);

    alert(
      "統合に失敗しました。\n\n" +
      error.message
    );

    mergeTarget = null;
  }
}

async function showLinkStatus(){
 showAdminPanel("🧩 マスター接続状況","<p>接続状況を確認しています...</p>");
 try{
  const key=cfgKey(),h={"apikey":key,"Authorization":"Bearer "+token};
  const rr=await fetch(BASE+"/rest/v1/drinking_records?select=id,brand_name,product_name,brewery_name,sake_id,created_at&order=created_at.desc",{headers:h});
  if(!rr.ok)throw new Error(await rr.text());
  const records=await rr.json();
  const mr=await fetch(BASE+"/rest/v1/sake_master?select=id,brand_name,product_name,brewery_name,verified,status",{headers:h});
  const masters=mr.ok?await mr.json():[];
  const mm=new Map(masters.map(m=>[m.id,m]));
  const norm=x=>String(x||"").replace(/株式会社|有限会社|合資会社|合同会社|[\\s・　（）()]/g,"").toLowerCase();
  const now=Date.now();
  const rows=records.map(r=>{
    const linked=r.sake_id?mm.get(r.sake_id):null;
    const createdAt=r.created_at?new Date(r.created_at).getTime():0;
    const isRecent=createdAt && (now-createdAt)<=7*24*60*60*1000;
    let state,label,detail;
    if(linked){
      state=linked.verified?"ok":"linked";
      label=linked.verified?"正式マスター接続済み":"マスター接続済み";
      detail=(linked.brand_name||"")+" "+(linked.product_name||"");
    }else{
      const cand=masters.find(m=>norm(m.brand_name)===norm(r.brand_name));
      if(cand){state="warn";label="要再確認";detail="同銘柄マスター候補あり："+(cand.product_name||"商品未設定")}
      else{state="missing";label="未接続";detail="同銘柄マスター候補なし"}
    }
    return {r,state,label,detail,isRecent};
  });
  const counts={ok:0,linked:0,warn:0,missing:0,recentIssue:0};rows.forEach(x=>{counts[x.state]++;if(x.isRecent&&(x.state==="warn"||x.state==="missing"))counts.recentIssue++});
  const badge=(txt,bg,fg)=>'<span style="display:inline-block;padding:4px 8px;border-radius:999px;background:'+bg+';color:'+fg+';font-size:11px;font-weight:700">'+txt+'</span>';
  const summary='<div style="display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-bottom:14px">'+
   '<div style="padding:12px;background:#edf5ef;border-radius:12px"><b style="font-size:22px">'+counts.ok+'</b><br><span style="font-size:11px">正式接続済み</span></div>'+
   '<div style="padding:12px;background:#f1f3f2;border-radius:12px"><b style="font-size:22px">'+counts.linked+'</b><br><span style="font-size:11px">接続済み</span></div>'+
   '<div style="padding:12px;background:#fbf2df;border-radius:12px"><b style="font-size:22px">'+counts.warn+'</b><br><span style="font-size:11px">要再確認</span></div>'+
   '<div style="padding:12px;background:#f8e8e8;border-radius:12px"><b style="font-size:22px">'+counts.missing+'</b><br><span style="font-size:11px">未接続</span></div>'+
   '<div style="padding:12px;background:#fff4df;border-radius:12px;grid-column:1/-1"><b style="font-size:22px">'+counts.recentIssue+'</b><br><span style="font-size:11px">7日以内に増えた要確認・未接続</span></div></div>';
  const sortedRows=[...rows].sort((a,b)=>Number(b.isRecent&&(b.state==="warn"||b.state==="missing"))-Number(a.isRecent&&(a.state==="warn"||a.state==="missing"))||new Date(b.r.created_at||0)-new Date(a.r.created_at||0));
  const list=sortedRows.map(x=>{
    const r=x.r;
    const b=x.state==="ok"?badge(x.label,"#e4f2e8","#245b3d"):x.state==="linked"?badge(x.label,"#edf0ef","#4b5a53"):x.state==="warn"?badge(x.label,"#faedcf","#7c5b18"):badge(x.label,"#f6dddd","#8b3333");
    const recentBadge=x.isRecent&&(x.state==="warn"||x.state==="missing")?'<span style="display:inline-block;margin-left:6px;padding:3px 6px;border-radius:999px;background:#ffe7b3;color:#7c5b18;font-size:10px;font-weight:700">NEW</span>':"";
    return '<div style="padding:13px 0;border-bottom:1px solid #eee"><div style="display:flex;justify-content:space-between;gap:8px;align-items:flex-start"><strong>'+(r.brand_name||"銘柄不明")+(r.product_name?" "+r.product_name:"")+recentBadge+'</strong>'+b+'</div><div style="font-size:12px;color:#777;margin-top:5px">蔵元：'+(r.brewery_name||"未設定")+'<br>'+x.detail+'</div></div>';
  }).join("");
  showAdminPanel("🧩 マスター接続状況",summary+list);
 }catch(e){showAdminPanel("🧩 マスター接続状況","<p>取得エラー："+e.message+"</p>")}
}

hol||"未設定")+'</div><div style="display:grid;grid-template-columns:1fr 1fr;gap:8px">'+imgs.join("")+'</div>'+candidates+'<button onclick="openRecheckRecord(\''+d.id+'\')" style="margin-top:10px;padding:10px 13px;border:1px solid #aaa;border-radius:10px;background:white">この記録を詳しく確認</button></div>');
  }
  showAdminPanel("🔎 過去の記録を再確認",blocks.join("")||"<p>再確認が必要な記録はありません ✅</p>");
 }catch(e){showAdminPanel("🔎 過去の記録を再確認","<p>取得エラー："+e.message+"</p>")}
