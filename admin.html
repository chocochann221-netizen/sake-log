<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>和酒ログ｜管理ダッシュボード</title>

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI",
        "Noto Sans JP", sans-serif;
      background: #f5f3ee;
      color: #292722;
    }

    header {
      background: #24211c;
      color: white;
      padding: 22px 18px;
    }

    header h1 {
      margin: 0;
      font-size: 22px;
    }

    header p {
      margin: 7px 0 0;
      color: #cfc9bd;
      font-size: 13px;
    }

    main {
      max-width: 900px;
      margin: auto;
      padding: 20px 16px 50px;
    }

    .status {
      background: #fff;
      border-radius: 14px;
      padding: 15px;
      margin-bottom: 18px;
      box-shadow: 0 2px 10px #0000000d;
    }

    .status-title {
      font-weight: bold;
    }

    .status-text {
      margin-top: 5px;
      color: #777;
      font-size: 13px;
    }

    .grid {
      display: grid;
      grid-template-columns: repeat(2, 1fr);
      gap: 12px;
    }

    .card {
      background: white;
      border-radius: 16px;
      padding: 18px;
      min-height: 125px;
      box-shadow: 0 2px 10px #0000000d;
    }

    .icon {
      font-size: 24px;
    }

    .label {
      margin-top: 10px;
      color: #777;
      font-size: 13px;
    }

    .number {
      margin-top: 4px;
      font-size: 29px;
      font-weight: 700;
    }

    h2 {
      margin-top: 30px;
      font-size: 18px;
    }

    .menu {
      background: white;
      border-radius: 16px;
      overflow: hidden;
      box-shadow: 0 2px 10px #0000000d;
    }

    .menu-item {
  width: 100%;
  display: block;
  padding: 17px;
  border: 0;
  border-bottom: 1px solid #eee;
  background: white;
  color: #292722;
  text-align: left;
  font: inherit;
  font-size: 16px;
  cursor: pointer;
}

.menu-item:last-child {
  border-bottom: none;
}

.menu-item:active {
  background: #f5f3ee;
}

    footer {
      text-align: center;
      color: #999;
      font-size: 12px;
      margin-top: 35px;
    }

    @media (min-width: 700px) {
      .grid {
        grid-template-columns: repeat(4, 1fr);
      }
    }
  </style>
</head>

<body>

<header>
  <h1>🍶 和酒ログ 管理</h1>
  <p>Administration Dashboard</p>
</header>

<main>

  <div class="status">
    <div class="status-title">🔐 管理者モード</div>
    <div class="status-text">
      管理者認証を確認してデータを表示します
    </div>
  </div>

  <div class="grid">

    <div class="card">
      <div class="icon">👥</div>
      <div class="label">登録ユーザー</div>
      <div class="number" id="users">—</div>
    </div>

    <div class="card">
      <div class="icon">🍶</div>
      <div class="label">飲酒記録</div>
      <div class="number" id="drinking">—</div>
    </div>

    <div class="card">
      <div class="icon">📷</div>
      <div class="label">保存写真</div>
      <div class="number" id="photos">—</div>
    </div>

    <div class="card">
      <div class="icon">🔍</div>
      <div class="label">AI認識</div>
      <div class="number" id="recognition">—</div>
    </div>

    <div class="card">
      <div class="icon">✏️</div>
      <div class="label">認識修正</div>
      <div class="number" id="corrections">—</div>
    </div>

    <div class="card">
      <div class="icon">🧠</div>
      <div class="label">学習辞書</div>
      <div class="number" id="dictionary">—</div>
    </div>

    <div class="card">
      <div class="icon">📚</div>
      <div class="label">日本酒マスター</div>
      <div class="number" id="master">—</div>
    </div>

  </div>

  <h2>管理メニュー</h2>

<div class="menu">
  <button class="menu-item" onclick="showUsers()">👥 ユーザー管理</button>
  <button class="menu-item" onclick="showRecognition()">🔍 AI認識結果</button>
  <button class="menu-item" onclick="showCorrections()">✏️ 誤認識・修正データ</button>
  <button class="menu-item" onclick="showSakeMaster()">🍶 日本酒マスター管理</button>
  <button class="menu-item" onclick="showDictionary()">🧠 学習辞書管理</button>
</div>
  
  <footer>
    和酒ログ Administrator
  </footer>

</main>

  <script>
  const BASE = "https://mtshsijgfmottgkbgnir.supabase.co";

  const cfgKey = () =>
  localStorage.getItem("sakelog_pubkey") || "";

  const token =
    localStorage.getItem("sakelog_token") ||
    localStorage.getItem("sakelog_access_token");

  async function loadAdminDashboard() {
    const statusText = document.querySelector(".status-text");

    try {
      if (!token) {
        statusText.textContent =
          "ログイン情報がありません。和酒ログへログインしてください。";
        return;
      }

      const key = cfgKey();

      if (!key) {
        statusText.textContent =
          "Supabase接続情報が見つかりません。";
        return;
      }

      const response = await fetch(
        BASE + "/rest/v1/rpc/admin_dashboard_stats",
        {
          method: "POST",
          headers: {
            "apikey": key,
            "Authorization": "Bearer " + token,
            "Content-Type": "application/json"
          },
          body: "{}"
        }
      );

      if (!response.ok) {
        const text = await response.text();
        throw new Error(text);
      }

      const data = await response.json();

      if (!data) {
        statusText.textContent =
          "管理者権限がありません。";
        return;
      }

      document.getElementById("users").textContent =
        data.users ?? 0;

      document.getElementById("drinking").textContent =
        data.drinking_records ?? 0;

      document.getElementById("photos").textContent =
        data.sake_photos ?? 0;

      document.getElementById("recognition").textContent =
        data.recognition_results ?? 0;

      document.getElementById("corrections").textContent =
        data.corrections ?? 0;

      document.getElementById("dictionary").textContent =
        data.sake_dictionary ?? 0;

      document.getElementById("master").textContent =
        data.sake_master ?? 0;

      statusText.textContent =
        "管理者認証済み・Supabase接続中";
    } catch (error) {
  console.error(error);

  statusText.textContent =
    "管理データ取得エラー：" + error.message;
}

    function showAdminPanel(title, html) {
  let panel = document.getElementById("adminDetailPanel");

  if (!panel) {
    panel = document.createElement("div");
    panel.id = "adminDetailPanel";
    panel.style.cssText = `
      margin-top:20px;
      background:white;
      border-radius:16px;
      padding:18px;
      box-shadow:0 2px 10px #0000000d;
    `;

    const menu = document.querySelector(".menu");
    menu.insertAdjacentElement("afterend", panel);
  }

  panel.innerHTML = `
    <h2 style="margin-top:0">${title}</h2>
    ${html}
  `;

  panel.scrollIntoView({
    behavior: "smooth",
    block: "start"
  });
}

async function showUsers() {
  showAdminPanel(
    "👥 ユーザー管理",
    "<p>ユーザーデータを読み込んでいます...</p>"
  );

  try {
    const response = await fetch(
      BASE + "/rest/v1/rpc/admin_list_users",
      {
        method: "POST",
        headers: {
          "apikey": cfgKey(),
          "Authorization": "Bearer " + token,
          "Content-Type": "application/json"
        },
        body: "{}"
      }
    );

    if (!response.ok) {
      throw new Error(await response.text());
    }

    const users = await response.json();

    const rows = users.map(user => `
      <div style="
        padding:14px 0;
        border-bottom:1px solid #eee;
      ">
        <strong>${user.display_name || "名前未設定"}</strong><br>
        <span style="font-size:13px;color:#777">
          ${user.email || ""}
        </span><br>
        <span style="font-size:13px;color:#777">
          権限：${user.role || "user"}
          ／ プラン：${user.plan || "free"}
          ／ 記録：${user.record_count ?? 0}件
        </span>
      </div>
    `).join("");

    showAdminPanel(
      "👥 ユーザー管理",
      rows || "<p>ユーザーはいません。</p>"
    );

  } catch (error) {
    console.error(error);

    showAdminPanel(
      "👥 ユーザー管理",
      "<p>ユーザー情報を取得できませんでした。</p>"
    );
  }
}


  alert("JavaScriptはここまで動いています");
loadAdminDashboard();
</script>
</body>
</html>
