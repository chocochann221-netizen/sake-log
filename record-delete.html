<!doctype html><html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>記録を削除 | 和酒ログ</title><style>*{box-sizing:border-box}body{margin:0;background:#f5f4ee;color:#1d251f;font-family:system-ui,-apple-system,"Noto Sans JP",sans-serif}.app{max-width:430px;margin:auto;min-height:100vh;background:#fbfaf6}.head{padding:15px 18px;border-bottom:1px solid #e4e0d7}.head a{text-decoration:none;color:#276149;font-size:12px;font-weight:800}.wrap{padding:30px 18px 55px}h1{font:700 27px serif;margin:0 0 8px}.lead{font-size:12px;line-height:1.8;color:#707873}.box{margin:22px 0;padding:17px;background:#fff;border:1px solid #e3ddd5;border-radius:18px}.box b{font:700 17px serif}.box p{font-size:11px;line-height:1.8;color:#706c66;margin:7px 0 0}.check{display:block;margin:18px 0;padding:14px;background:#f1efe8;border-radius:14px;font-size:11px;line-height:1.7}.delete{width:100%;border:1px solid #cdaea7;background:#fff;color:#8b4339;border-radius:15px;padding:14px;font-weight:800}.delete:disabled{opacity:.35}.cancel{display:block;text-align:center;margin-top:10px;padding:13px;text-decoration:none;color:#35604d;font-size:12px;font-weight:800}.msg{margin-top:14px;padding:12px;border-radius:12px;font-size:11px}.err{background:#fff0ee;color:#a32c22}.ok{background:#e8f7ef;color:#17683f}</style></head><body><div class="app"><div class="head"><a id="back" href="record-edit.html">← 編集する場所を選ぶ</a></div><main class="wrap"><h1>この日の記録を削除</h1><p class="lead">削除するのは、この日に飲んだ記録です。同じ銘柄の別の日の記録や、日本酒マスターそのものは削除しません。</p><section class="box"><b id="target">この日の記録</b><p>この記録に付けた表・裏ラベル、料理、思い出の写真も一緒に削除します。</p></section><label class="check"><input id="agree" type="checkbox"> この日の記録と写真を削除することを確認しました</label><button id="del" class="delete" disabled>この日の記録を削除する</button><a id="cancel" class="cancel" href="record-detail.html">削除せず一本の記録へ戻る</a><div id="msg"></div></main></div><script>const BASE='https://mtshsijgfmottgkbgnir.supabase.co',KEY='sb_publishable_iN9jbt45ga1sPbzt5aw-0w_iWs8eWW-';const id=new URLSearchParams(location.search).get('id'),token=localStorage.getItem('sakelog_token'),H={'apikey':localStorage.getItem('sakelog_pubkey')||KEY,'Authorization':'Bearer '+token};const $=x=>document.getElementById(x);$('back').href=id?'record-edit.html?id='+encodeURIComponent(id):'record-edit.html';$('cancel').href=id?'record-detail.html?id='+encodeURIComponent(id):'record-detail.html';$('agree').onchange=()=>$('del').disabled=!$('agree').checked;function msg(t,c){$('msg').innerHTML='<div class="msg '+c+'">'+t+'</div>'}async function load(){if(!id){msg('記録IDがありません。','err');return}const r=await fetch(BASE+'/rest/v1/drinking_records?select=brand,product,drank_at&id=eq.'+encodeURIComponent(id)+'&limit=1',{headers:H}),d=await r.json().catch(()=>[]);if(r.ok&&d[0])$('target').textContent=[d[0].brand,d[0].product,String(d[0].drank_at||'').slice(0,10)].filter(Boolean).join('　')}$('del').onclick=async()=>{if(!id||!$('agree').checked)return;if(!confirm('本当にこの日の記録を削除しますか？\nこの操作は元に戻せません。'))return;$('del').disabled=true;try{const pr=await fetch(BASE+'/rest/v1/sake_photos?select=id,storage_path&drinking_record_id=eq.'+encodeURIComponent(id),{headers:H}),photos=pr.ok?await pr.json():[];for(const p of photos){await fetch(BASE+'/rest/v1/sake_photos?id=eq.'+encodeURIComponent(p.id),{method:'DELETE',headers:H});await fetch(BASE+'/storage/v1/object/sake-photos/'+encodeURI(p.storage_path),{method:'DELETE',headers:H}).catch(()=>{})}const r=await fetch(BASE+'/rest/v1/drinking_records?id=eq.'+encodeURIComponent(id),{method:'DELETE',headers:H});if(!r.ok)throw new Error('記録を削除できませんでした。');msg('削除しました。記録一覧へ戻ります。','ok');setTimeout(()=>location.href='integrated-preview.html',600)}catch(e){msg(e.message||'削除できませんでした。','err');$('del').disabled=false}};load();</script></body></html>
